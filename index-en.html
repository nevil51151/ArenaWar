/* ---------- éléments d'interface ---------- */
.pnl{background:linear-gradient(180deg,rgba(30,36,72,.93),rgba(13,15,32,.95));border:2px solid var(--line);border-radius:16px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #ffffff14,0 12px 30px #000b}
.gbtn{background:linear-gradient(180deg,#ffe08a,#e2a93a 55%,#b47a1d);color:#2a1a03;font-family:Cinzel,serif;font-weight:900;border-radius:12px;padding:10px 22px;border:2px solid #fff3c4;box-shadow:0 4px 0 #6b4510,0 8px 18px #000a;text-shadow:0 1px 0 #fff6;transition:.12s}
.gbtn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.gbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #6b4510}

.sbtn{background:linear-gradient(180deg,#3a4277,#232850);border:2px solid #6b74b8;border-radius:10px;padding:7px 14px;font-weight:700;transition:.12s}

.mut{color:var(--mut)}

.stars{color:var(--gold);text-shadow:0 0 6px #000,0 1px 0 #000;letter-spacing:1px}

/* barre du haut */

/* sprites */

.spr.ph{display:flex;align-items:flex-end;justify-content:center;font-size:var(--es,100px);line-height:1}

/* carte de monstre (portrait) */
.mc{position:relative;width:104px;height:128px;border-radius:12px;overflow:hidden;cursor:pointer;flex:none;border:2px solid color-mix(in srgb,var(--ec) 70%,#000);background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--ec) 45%,#111) 0%,#0d0f1e 75%);box-shadow:0 4px 10px #0008;transition:.12s}
.mc:hover{transform:translateY(-3px)}
.mc .pic{position:absolute;left:6px;right:6px;top:16px;bottom:22px;--es:54px}
.mc .stars{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:12px}
.mc .lv{position:absolute;bottom:0;left:0;right:0;background:#000b;font-size:11px;font-weight:800;text-align:center;padding:2px}
.mc .elb{position:absolute;top:18px;right:4px;font-size:14px}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold)}
.mc.inteam::after{content:"✔";position:absolute;top:18px;left:5px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#2a1a03;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}

  background:linear-gradient(180deg,rgba(34,40,84,.97),rgba(14,16,36,.98));border:2px solid var(--line);border-radius:18px;box-shadow:0 14px 34px #000c;z-index:30}

.tile:hover{transform:translateY(-4px);border-color:#fff3c4}

/* ---- runes Titan parfaites ---- */
@property --ta{syntax:'<angle>';inherits:false;initial-value:0deg}
.titanfx{position:absolute;inset:-8% -16% -6%;pointer-events:none;z-index:0}
.titanfx .tring{position:absolute;left:4%;right:4%;bottom:-3%;height:26%;border-radius:50%;
  background:conic-gradient(from var(--ta),#ffe27a,#fff0 12%,#ffd24a 25%,#fff0 40%,#fff 52%,#fff0 64%,#ffb83a 78%,#fff0 90%,#ffe27a);
  -webkit-mask:radial-gradient(closest-side,#0000 74%,#000 78%,#000 92%,#0000 100%);mask:radial-gradient(closest-side,#0000 74%,#000 78%,#000 92%,#0000 100%);
  filter:drop-shadow(0 0 6px #ffd24a) drop-shadow(0 0 12px #ffb83a);animation:tspin 3.2s linear infinite}
.titanfx .tring.r2{left:16%;right:16%;bottom:1%;height:17%;animation-duration:2.2s;animation-direction:reverse;opacity:.8}
.titanfx .tbeam{position:absolute;left:22%;right:22%;bottom:4%;top:20%;background:linear-gradient(0deg,#ffd24a55,#ffd24a10 60%,#0000);filter:blur(6px);border-radius:40% 40% 10% 10%;animation:tbeam 2.4s ease-in-out infinite}
.titanfx .tglyphs b{position:absolute;bottom:4%;font-size:18px;font-weight:900;color:#fff4c2;text-shadow:0 0 6px #ffd24a,0 0 14px #ffb83a;opacity:0;animation:tglyph 3s linear infinite}
.titanfx.sz-mid .tglyphs b{font-size:13px}
@keyframes tspin{to{--ta:360deg}}
@keyframes tbeam{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes tglyph{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:translateY(-260%) scale(1.1);opacity:0}}
.sz-big.titanfx .tglyphs b{animation-name:tglyphB}
@keyframes tglyphB{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:translateY(-520%) scale(1.15);opacity:0}}
.tglow>*{animation:tglowA 2.6s ease-in-out infinite}
@keyframes tglowA{0%,100%{filter:drop-shadow(0 0 3px #ffd24a) drop-shadow(0 0 8px #ffb83a88)}50%{filter:drop-shadow(0 0 6px #fff4c2) drop-shadow(0 0 16px #ffd24a)}}
.mc.titanrun{border-color:#ffe27a!important;box-shadow:0 0 10px #ffe27a99,inset 0 0 14px #ffe27a33;overflow:hidden}
.mc.titanrun::before{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,#0000 40%,#fff5 48%,#ffe27a66 50%,#0000 58%);animation:tsweep 3s ease-in-out infinite;z-index:2;pointer-events:none}
@keyframes tsweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.mc .tbadge{position:absolute;right:4px;bottom:18px;z-index:3;font-size:13px;font-weight:900;color:#fff4c2;text-shadow:0 0 5px #ffd24a,0 0 10px #ffb83a}
.tperfect{margin-top:10px;padding:7px 10px;border-radius:10px;font-weight:800;font-size:12.5px;color:#fff4c2;background:linear-gradient(90deg,#ffd24a33,#ffb83a14);border:1px solid #ffe27a88;text-shadow:0 0 6px #ffb83a}

/* ---- runes Titan éveillées : halo doré ---- */
@property --hg{syntax:'<angle>';inherits:false;initial-value:0deg}
.hex.tawk{background:conic-gradient(from var(--hg),#ffe27a,#fff,#ffb83a,#fff4c2,#ffd24a,#fff,#ffe27a);animation:tspinH 2.4s linear infinite}
.hex.tawk>div{background:radial-gradient(circle at 50% 35%,#4a3b1a,#15110a)}

@keyframes tspinH{to{--hg:360deg}}
.hexhalo{position:absolute;width:78px;height:88px;margin:-44px 0 0 -39px;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,#ffe27acc,#ffb83a66 55%,#0000 100%);filter:blur(6px);transform:scale(1.35);animation:thalo 2s ease-in-out infinite}
@keyframes thalo{0%,100%{opacity:.55;transform:scale(1.25)}50%{opacity:1;transform:scale(1.45)}}

@keyframes tcard{0%,100%{box-shadow:0 0 8px #ffd24a66,inset 0 0 10px #ffd24a22}50%{box-shadow:0 0 20px #ffd24acc,inset 0 0 18px #ffd24a44}}

// Répartition des runes Omniscient (jokers) : complètent d'abord les sets entamés, puis renforcent ceux existants
function setAlloc(cnt){
  const c = {...cnt}; let w = c.omni||0; delete c.omni; const given = {};
  while (w>0){
    const opts = Object.keys(c).map(k=>{ const p = SETS[k].pcs, r = c[k]%p, need = r ? p-r : p; return {k, need, partial:!!r, p}; }).filter(o=>o.need<=w)
      .sort((a,b)=>(b.partial-a.partial) || (a.need-b.need) || (b.p-a.p));
    if (!opts.length) break; const o = opts[0]; c[o.k] += o.need; given[o.k] = (given[o.k]||0)+o.need; w -= o.need; }
  if (w>0) c.omni = w;
  return {c, given}; }

  if (s.berserk) p.push("damage increased by its own missing HP");
  if (s.spdDiff) p.push(`damage increased if it is faster than the target (up to +${Math.round(s.spdDiff*100)}%)`);
  if (s.perAlly) p.push(`+${s.perAlly}% damage per living ally`);
  if (s.vsStun) p.push(`+${s.vsStun}% damage against a stunned or slowed target`);
  if (s.cdBonus) p.push(`crit damage +${s.cdBonus}%`);
  if (s.breakShield) p.push(`destroys the target's shields before striking (+${s.breakShield}% damage if a shield is broken)`);
  if (s.pierce) p.push(`${s.pierce>=100?"damage pierces":`${s.pierce}% of the damage pierces`} shields`);
  if (s.vengeance) p.push(`damage increased by ${s.vengeance}% of the damage it took during the battle`);
  if (s.ignDef) p.push(`ignores ${s.ignDef}% of defense`);
  if (s.pctHp) p.push(`also deals ${s.pctHp}% of the target's max HP`);
  if (s.perDebuff) p.push(`+${s.perDebuff}% damage per negative effect on the target`);
  if (s.splash) p.push(`other enemies take ${s.splash}% of the damage`);
  if (s.critBonus) p.push(`crit damage +${s.critBonus*2}% for this attack`);   // ancien bonus de taux critique converti
  for (const f of s.fx||[]){
    if (f.k==='debuff') p.push(`${f.c}% chance to ${DEBUFF_VERB[f.s]}${f.s==='mark'?'':` for ${f.turns} turn${f.turns>1?'s':''}`}${f.lock?" (cannot be removed or transferred)":''}`);
    else if (f.k==='atb'){ if (f.who==='self') p.push(`fills its attack bar by ${f.v}%`);
      else if (f.who==='allies' || !off) p.push(`fills the allies' attack bar by ${f.v}%`);
      else p.push(`${f.c?f.c+"% chance to reduce":"reduces"} the attack bar by ${-f.v}%`); }
    else if (f.k==='buff'){
      const who = f.who==='lowest' ? "the most wounded ally" : off ? "itself" : s.t==='allies' ? "all allies" : "an ally";
      if (f.s==='shield') p.push(`gives ${who} a shield worth ${f.pct}% of their max HP (${f.turns} turns)`);
      else if (f.s==='immunity') p.push(`makes ${who} immune to negative effects for ${f.turns} turn${f.turns>1?'s':''}`);
      else if (f.s==='invincible') p.push(`becomes invincible for ${f.turns} turn`);
      else if (f.s==='regen') p.push(`gives regeneration (15%/turn) to ${who} for ${f.turns} turns`);
      else p.push(`increases the ${STAT_NAME[f.s]} of ${who} for ${f.turns} turns`);
    }
    else if (f.k==='heal'){
      const tgt = f.who==='lowest' ? "the most wounded ally" : f.who==='allies' || s.t==='allies' ? "all allies" : off ? null : "an ally";
      const amt = f.mode==='miss' ? `${f.pct}% of ${tgt==="all allies"?"their":"its"} missing HP` : f.mode==='self' ? `${f.pct}% of the caster's max HP` : f.mode==='atk' ? `${f.pct}% of the caster's ATK` : `${f.pct}%${f.who==='lowest'?'':` of ${tgt==="all allies"?"their":"its"} max HP`}`;
      p.push(tgt ? `heals ${tgt} for ${amt}` : `heals itself for ${amt}`);
      if (f.urgent) p.push(`heal ×${String(f.urgent).replace('.', GAME_LANG==='en'?'.':',')} on allies below 35% HP`);
      if (f.over) p.push(`excess healing becomes a shield`);
    }
    else if (f.k==='selfShieldDef') p.push(`gives itself a shield equal to ${f.pct}% of its defense (2 turns)`);
    else if (f.k==='selfHealDef') p.push(`heals itself for ${f.pct}% of its defense`);
    else if (f.k==='guardAllies') p.push(`protects ${f.who==='lowest'?"the most wounded ally":"all allies"} for ${f.turns} turns (takes 40% of their damage)`);
    else if (f.k==='stoneWall') p.push("becomes invincible for 1 turn and provokes all enemies");
    else if (f.k==='devour') p.push(`devours the target's positive effects: +${f.v}% attack bar and increased attack per effect devoured`);
    else if (f.k==='steal') p.push("steals the target's positive effects and gives them to all allies for 1 turn");
    else if (f.k==='invert') p.push("turns the target's positive effects into negative effects");
    else if (f.k==='transfer') p.push("transfers 1 negative effect from each ally to the target");
    else if (f.k==='atbSteal') p.push(`absorbs ${f.v}% of the target's attack bar and shares it among allies`);
    else if (f.k==='blessing') p.push(`gives each ally a random positive effect for ${f.turns} turns`);
    else if (f.k==='teamTurn') p.push("immediately gives a turn to the ally with the highest attack");
    else if (f.k==='drainTeam') p.push(`heals all allies for ${f.pct}% of the damage dealt`);
    else if (f.k==='drain') p.push(`recovers ${f.pct}% of the damage dealt`);
    else if (f.k==='cleanse') p.push("removes negative effects");
    else if (f.k==='strip') p.push("removes the target's positive effects");
    else if (f.k==='revive') p.push(`revives dead allies with ${f.pct}% HP`);
    else if (f.k==='cdReduce') p.push("reduces allies' cooldowns by 1 turn");
    else if (f.k==='extraOnKill') p.push("takes another turn if the target dies");
    else if (f.k==='joint') p.push("a random ally attacks the target with it");
    else if (f.k==='partner') p.push(`if a ${f.fam} monster is on the team, it attacks the target as a duo`);
    else if (f.k==='detonate') p.push("detonates all of the target's burns (immediate damage, burns removed)");
    else if (f.k==='hpSwap') p.push("if the target has a higher HP percentage than her, swaps their HP percentages (no effect on bosses)");
    else if (f.k==='ripBarbs') p.push("rips out all barbed spikes stuck in the target: 6% of its max HP per spike as immediate damage (spikes removed)");
    else if (f.k==='cdUp') p.push(`${f.c?f.c+"% chance to increase":"increases"} the target's cooldowns by 1 turn`);
    else if (f.k==='balance') p.push("balances the HP of the whole team");
    else if (f.k==='extendBuffs') p.push("extends allies' positive effects by 1 turn");
    else if (f.k==='extendDebuffs') p.push("extends the target's negative effects by 1 turn");
    else if (f.k==='cdReset') p.push("resets the ally's cooldowns");
    else if (f.k==='detonate') p.push("detonates the target's burns (immediate damage)");
  }
  if (s.sig && typeof SIG!=='undefined' && SIG[s.sig.k]) p.push("✦ signature: "+SIG[s.sig.k].t(s.sig));
  if (!p.length) return '';
  const t = p.join(', '); return t[0].toUpperCase()+t.slice(1)+'.';
}
const FAMILY_IMAGES = {};
for (const F of FAMILIES){
  for (const V of F.v){
    const R = ROLES[V.role], b = {...R.base};
    if (V.el==='light'||V.el==='dark') for (const k of ['hp','atk','def']) b[k] = Math.round(b[k]*1.07);
    if (V.el==='fire'){ b.atk = Math.round(b.atk*1.04); b.hp = Math.round(b.hp*1.02); }   // petits ajustements d'équilibrage
    if (V.el==='water'){ b.hp = Math.round(b.hp*1.04); b.def = Math.round(b.def*1.04); }
    // les soigneurs soignent un peu moins fort (équilibrage)
    const skills = V.sk.map(s=>({...s, fx:s.fx && s.fx.map(f=> V.role==='H' && (f.k==='heal'||f.k==='revive') ? {...f, pct:Math.round(f.pct*0.6)} : f)}));
    for (const s of skills) if (s.passive?.k==='auraHeal') s.passive = {...s.passive, v:4};
    skills.forEach(s=>s.d = describe(s));
    MONSTERS.push({id:V.id, name:V.name, emoji:F.emoji, el:V.el, stars:5, role:R.n, fam:F.fam, base:b, lead:V.lead, skills});
    FAMILY_IMAGES[V.id] = `img/${V.id}.webp`;
  }
}

const HW_FAM5 = new Set(['mortella','cendrelle','noyelle','bisemort','aubemorte','putrefia','brulemorte','marevia','ventrelle','necrosia']);
for (const id of Object.keys(EVENT_KITS)){ const base = EVENT_KITS[id], five = ['light','dark'].includes(
    {aubemorte:'light',mortella:'dark',putrefia:'light',necrosia:'dark',lumina:'light',ombrina:'dark',lumok:'light',morok:'dark',clarte:'light',suie:'dark',solara:'light',nyxara:'dark'}[id]);
  const k = five && !HW_FAM5.has(id) ? 1.08 : !five && HW_FAM5.has(id) ? 0.92 : 1;
  EVENT_KITS[id] = () => { let sk = base(); const pas = sk.filter(x=>x.passive), act = sk.filter(x=>!x.passive);
    if (!five && act.length > 2) act.length = 2;                       // un 4★ garde 2 sorts actifs
    if (five && act.length < 3 && HW_5_EXTRA[id]) act.push(HW_5_EXTRA[id]());
    if (k !== 1) for (const x of act) if (typeof x.m === 'number') x.m = Math.round(x.m*k*100)/100;
    if (HW_DEFSCALE.has(id)) for (const x of act) if (x.m > 0 && !x.sc){ x.sc = 'def'; x.sm = Math.round(x.m*0.85*100)/100; x.m = Math.round(x.m*0.44*100)/100; }
    return [...act, ...pas]; };
}

  el.forEach((n,r)=>{ for (let i=0;i<n;i++){ const k = grindKey(pick(GRIND_STATS), r); S.items.grind[k] = (S.items.grind[k]||0)+1; } }); delete S.items.elev; }
function raidReward(d, team){
  const t = TPL[d.tpl], f = d.floor, fk = fragKey(t); S.frag ??= {}; S.dclear ??= {};
  const n = RAID_FRAGS(t.stars, f) + (Math.random()<0.25 ? 1 : 0);
  S.frag[fk] = (S.frag[fk]||0) + n;
  const key = 'raid_'+t.id, first = (S.dclear[key]||0) < f; if (first) S.dclear[key] = f;
  const rw = {mana:400+f*300, xp:Math.round(70*f), crystals:first?20:0, runes:[], ups:[], frag:{tpl:t.id, n, have:S.frag[fk], need:fragNeed(t), fam:t.fam}};
  S.mana += rw.mana; S.crystals += rw.crystals;
  for (const a of team){ const m = mon(a.boxId); if (!m) continue; const up = giveXp(m, rw.xp); if (up) rw.ups.push(`${TPL[m.tpl].name} → lvl ${m.lvl}`); }
  return rw;
}
function genDungeonWaves(d){
  if (d.id==='raid') return genRaidWaves(d);
  if (d.id==='dim') return genDimWaves(d);
  if (d.id==='inst') return genInstWaves(d);
  if (d.id==='wb') return genWBWaves(d);
  if (d.id==='crypte') return genCryptWaves(d);
  const D = DUNGEONS[d.id], f = d.floor, rng = mulberry32(f*131 + D.seed);
  const lvl = dungeonLvl(f), k = dungeonK(f);
  const pool = MONSTERS.filter(m => m.stars>=3 && m.stars <= (f<=3?3 : f<=6?4 : 5));
  const waves = [];
  for (let w=0; w<2; w++){ const wave=[]; for (let i=0;i<3;i++) wave.push({tpl:pool[Math.floor(rng()*pool.length)].id, lvl:lvl+w, k}); waves.push(wave); }
  const bw = [{tpl:dungeonBoss(d.id, f), lvl:lvl+5, boss:true, k, hpMul:1.8+0.45*f}];
  if (f>=5) bw.unshift({tpl:pool[Math.floor(rng()*pool.length)].id, lvl, k}), bw.push({tpl:pool[Math.floor(rng()*pool.length)].id, lvl, k});
  waves.push(bw); return waves;
}

/* ---------- 1e. DIVERSIFICATION DES COMPÉTENCES ----------
   Quand trop de compétences ont exactement la même mécanique, on applique une variante
   (coups multiples moins forts, cibles aléatoires, ignore-défense, % PV, éclaboussure, attaque conjointe…).
   Choix déterministe : le même monstre garde toujours le même kit. */
(function diversify(){
  const sig = s => [s.t, s.hits||1, s.sc||'', s.lowHp?'L':'', s.ignDef?'I':'', s.pctHp?'P':'', s.perDebuff?'D':'', s.splash?'S':'', s.critBonus?'C':'',
    ...(s.fx||[]).map(f=>f.k+(f.s||'')+(f.who||'')).sort()].join('|');
  const hash = str => { let h=7; for (const ch of str) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; };
  const r1 = x => Math.round(x*100)/100;
  const ST = [ // variantes pour attaques mono-cible
    s=>{ const n=3; return {...s, hits:n, m:r1(s.m/n*1.12)}; },
    s=>{ const n=2; return {...s, hits:n, m:r1(s.m/n*1.08)}; },
    s=>{ const n=4; return {...s, t:'random', hits:n, m:r1(s.m/n*1.3)}; },
    s=>({...s, m:r1(s.m*0.85), ignDef:35}),
    s=>({...s, m:r1(s.m*0.78), pctHp:6}),
    s=>({...s, m:r1(s.m*0.85), perDebuff:20}),
    s=>({...s, m:r1(s.m*0.9), splash:30}),
    s=>({...s, m:r1(s.m*0.75), fx:[...(s.fx||[]), {k:'joint'}]}),
    s=>({...s, m:r1(s.m*0.92), critBonus:30}),
    s=>({...s, m:r1(s.m*0.75), sc:'spd', sm:r1(s.m*0.9)}),
    s=>({...s, fx:[...(s.fx||[]), {k:'cdUp', c:40}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'extendDebuffs'}], m:r1(s.m*0.92)}),
    s=>({...s, fx:[...(s.fx||[]), {k:'debuff', s:'oblivion', c:50, turns:2}], m:r1(s.m*0.92)}),
  ];
  const AT = [ // variantes pour attaques de zone
    s=>({...s, hits:2, m:r1(s.m/2*1.08)}),
    s=>({...s, m:r1(s.m*0.88), ignDef:30}),
    s=>({...s, fx:[...(s.fx||[]), {k:'cdUp', c:30}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'debuff', s:'oblivion', c:45, turns:2}], m:r1(s.m*0.92)}),
    s=>({...s, m:r1(s.m*0.85), perDebuff:15}),
    s=>({...s, fx:[...(s.fx||[]), {k:'extendDebuffs'}], m:r1(s.m*0.92)}),
    s=>{ const n=5; return {...s, t:'random', hits:n, m:r1(s.m*1.8/n)}; },
  ];
  const SU = [ // variantes pour soutien d'équipe
    s=>({...s, fx:[...(s.fx||[]), {k:'extendBuffs'}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'balance'}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'buff', s:'counterUp', turns:2}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'buff', s:'reflectUp', turns:2}]}),
    s=>({...s, fx:(s.fx||[]).map(f=>f.k==='cleanse'?{k:'extendBuffs'}:f)}),
  ];
  const AY = [ // variantes pour soutien mono-cible
    s=>({...s, fx:[...(s.fx||[]), {k:'cdReset'}], cd:(s.cd||2)+1}),
    s=>({...s, fx:[...(s.fx||[]), {k:'buff', s:'counterUp', turns:2}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'atb', v:30}]}),
  ];
  const cnt = {}, LIMIT = 4;
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((s,i)=>{ if (s.passive) return;
      let k = sig(s);
      if ((cnt[k]||0) >= LIMIT){
        const pool = s.t==='enemy' ? ST : s.t==='enemies' ? AT : s.t==='allies' ? SU : s.t==='ally' ? AY : null;
        if (pool){ const h = hash(M.id+i); let best=null, bk=null, bc=1e9;
          for (let j=0;j<pool.length;j++){ const c = pool[(h+j)%pool.length](s), ck = sig(c), n = cnt[ck]||0; if (n<bc){ bc=n; best=c; bk=ck; } if (n===0) break; }
          if (best){ best.d = describe(best); M.skills[i] = best; s = best; k = bk; } }
      }
      cnt[k] = (cnt[k]||0)+1; }); }
})();
/* 1f. Variété des modificateurs de dégâts : les « dégâts selon PV manquants » sont réservés aux exécuteurs
   (sorts qui rejouent sur un kill) ; les autres reçoivent un modificateur différent. Un tiers des attaques
   « simples » (un seul effet, aucun modificateur) gagne aussi un modificateur. */
(function damageVariety(){
  const MODS = [
    s=>({...s, fullHp:0.5, m:r1(s.m*0.85)}), s=>({...s, perBuff:25, m:r1(s.m*0.95)}), s=>({...s, berserk:0.8, m:r1(s.m*0.92)}), s=>({...s, spdDiff:0.5, m:r1(s.m*0.88)}),
    s=>({...s, cdBonus:40, m:r1(s.m*0.92)}), s=>({...s, perAlly:10, m:r1(s.m*0.9)}), s=>({...s, vsStun:40, m:r1(s.m*0.95)}),
  ];
  const r1 = x => Math.round(x*100)/100, hash = str => { let h=11; for (const ch of str) h = (h*33 + ch.charCodeAt(0)) >>> 0; return h; };
  const MODK = ['lowHp','ignDef','pctHp','perDebuff','splash','critBonus','sc','fullHp','perBuff','berserk','spdDiff','perAlly','vsStun','cdBonus'];
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((s,i)=>{ if (s.passive || !(s.m>0) || !isOff(s)) return;
      const h = hash(M.id+'#'+i);
      if (s.lowHp && !(s.fx||[]).some(f=>f.k==='extraOnKill')){ const c = MODS[h%MODS.length]({...s}); delete c.lowHp; c.d = describe(c); M.skills[i] = c; return; }
      const plain = !MODK.some(k=>s[k]) && (s.hits||1)===1 && s.t!=='random' && (s.fx||[]).length<=2;
      if (plain && h % (i>0 ? 2 : 3) === 0){ const c = MODS[(h>>>3)%MODS.length]({...s}); c.d = describe(c); M.skills[i] = c; }
    }); }
})();
/* 1g. Variété des soins : beaucoup de soigneurs avaient « attaque + soigne le plus blessé de 10 % ».
   Chaque sort de soin reçoit une variante (soin selon PV manquants, selon les PV du lanceur, soin d'urgence,
   excédent → bouclier, soin de groupe sur les dégâts, bouclier ou régénération sur le plus blessé…) et des valeurs nuancées. */
(function healVariety(){
  const hash = str => { let h=5381; for (const ch of str) h = ((h<<5) + h + ch.charCodeAt(0)) >>> 0; return h; };
  const jit = (v, h) => Math.max(1, Math.round(v * (0.86 + (h%29)/100)));   // valeurs entre −14 % et +14 %
  const ON_HIT = [ // attaque qui soigne le plus blessé
    (f,h)=>f,
    (f,h)=>({k:'drainTeam', pct:jit(f.pct*1.4,h)}),
    (f,h)=>({...f, mode:'miss', pct:jit(f.pct*2.6,h)}),
    (f,h)=>({...f, mode:'self', pct:jit(f.pct*1.05,h)}),
    (f,h)=>({k:'buff', s:'shield', pct:jit(f.pct*1.5,h), turns:2, who:'lowest'}),
    (f,h)=>({...f, pct:jit(f.pct*0.8,h), urgent:2}),
    (f,h)=>({k:'heal', who:'allies', pct:jit(f.pct*0.38,h)}),
    (f,h)=>({...f, pct:jit(f.pct*0.85,h), over:1}),
  ];
  const GROUP = [ // soin de groupe / mono-cible
    (f,h)=>({...f, pct:jit(f.pct,h)}),
    (f,h)=>({...f, mode:'miss', pct:jit(f.pct*2.1,h)}),
    (f,h)=>({...f, pct:jit(f.pct*0.9,h), over:1}),
    (f,h)=>({...f, pct:jit(f.pct*0.85,h), urgent:1.7}),
    (f,h)=>({...f, mode:'self', pct:jit(f.pct*1.1,h)}),
  ];
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((s,i)=>{ if (s.passive || !s.fx) return;
      const rv = s.fx.findIndex(f=>f.k==='revive');
      if (rv>=0){ const h0 = hash(M.id+'^'+i); const fx = s.fx.slice(); fx[rv] = {...fx[rv], pct:jit(fx[rv].pct, h0)}; s = M.skills[i] = {...s, fx}; s.d = describe(s); }
      const j = s.fx.findIndex(f=>f.k==='heal'); if (j<0) return;
      const h = hash(M.id+'~'+i), f = s.fx[j], off = isOff(s);
      const pool = off && f.who==='lowest' ? ON_HIT : off ? null : GROUP; if (!pool) return;
      const nf = pool[h % pool.length](f, h>>>5); if (nf===f) return;
      const fx = s.fx.slice(); fx[j] = nf; const c = {...s, fx}; c.d = describe(c); M.skills[i] = c; }); }
})();
/* 1h. Variété des soutiens : beaucoup avaient « attaque + barre d'attaque » et « alliés : barre + attaque/critique ».
   On répartit de nouvelles mécaniques : vol des bonus ennemis redonnés aux alliés, inversion des bonus,
   transfert des malus, absorption de barre d'attaque, bénédictions aléatoires, tour immédiat pour l'attaquant,
   et des passifs façon Veromos (purification d'équipe à chaque tour) ou bénédiction automatique. */
(function supportVariety(){
  const hash = str => { let h=97; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 2654435761) >>> 0; return h; };
  const r1 = x => Math.round(x*100)/100;
  const S1 = [ // attaques de base
    s=>({...s, m:r1(s.m*0.95), fx:[{k:'steal'}]}),
    s=>({...s, m:r1(s.m*0.95), fx:[{k:'invert'}]}),
    s=>({...s, fx:[{k:'atbSteal', v:25}]}),
    s=>({...s, fx:[...(s.fx||[]).filter(f=>f.k!=='atb'), {k:'transfer'}]}),
  ];
  const SA = [ // sorts de soutien d'équipe
    s=>({...s, fx:[{k:'blessing', turns:2}, atbA(15)]}),
    s=>({...s, fx:[{k:'teamTurn'}, buff('atkUp')], cd:Math.max(4, s.cd||4)}),
    s=>({...s, t:'enemy', m:3.0, fx:[{k:'steal'}, atbA(15)]}),
    s=>({...s, t:'enemy', m:2.8, fx:[{k:'invert'}, {k:'transfer'}]}),
  ];
  const PAS = [ {k:'auraCleanse', v:3}, {k:'auraBuff', v:2} ];
  const cnt = {};   // équilibre la répartition : on prend la variante la moins utilisée, en partant d'un choix « aléatoire » stable
  const choose = (pool, key, h, used) => { let best = null, bn = 1e9;
    for (let j=0;j<pool.length;j++){ const k = (h+j)%pool.length, n = (cnt[key+k]||0) + (used.has(key+k)?100:0); if (n < bn){ bn = n; best = k; } }
    cnt[key+best] = (cnt[key+best]||0)+1; used.add(key+best); return pool[best]; };
  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Soutien') continue;
    const used = new Set();
    M.skills.forEach((s,i)=>{ if (s.passive) return; let c = null; const h = hash(M.id+'@'+i);
      const fx = (s.fx||[]).map(f=>f.k+(f.s||''));
      if (i===0 && s.t==='enemy' && h%3!==0 && fx.length<=1) c = choose(S1, 'a', h>>>3, used)(s);
      else if (i>0 && s.t==='allies' && fx.includes('atb') && (fx.includes('buffatkUp')||fx.includes('buffspdUp')||fx.includes('buffcritUp'))){
        if (i===M.skills.length-1 && !M.skills.some(x=>x.passive) && (h>>>5)%3===0){ const p = PAS[(h>>>7)%2]; c = P(p.k==='auraCleanse'?"Purifying Aura":"Constant Blessing", p); }
        else if ((h>>>9)%5!==0) c = choose(SA, 'b', h>>>11, used)(s);
      }
      if (c){ c.d = describe(c); M.skills[i] = c; } }); }
})();
/* 1i. Variété des tanks : moins de « provocation + DEF » et de passifs contre-attaque / réduction / renvoi identiques.
   Nouvelles mécaniques : bouclier ou soin basés sur la DEF, vengeance (dégâts selon les dégâts subis),
   protection d'alliés (le tank encaisse 40 %), endurance (impossible de tomber sous 1 PV), mur de pierre,
   et passifs Gardien (encaisse une part des dégâts de l'équipe) / Dernier rempart. */
(function defenseVariety(){
  const hash = str => { let h=131; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 0x9E3779B1) >>> 0; return h; };
  const r1 = x => Math.round(x*100)/100, cnt = {};
  const choose = (pool, key, h, used) => { let best = 0, bn = 1e9;
    for (let j=0;j<pool.length;j++){ const k = (h+j)%pool.length, n = (cnt[key+k]||0) + (used.has(key+k)?100:0); if (n<bn){ bn=n; best=k; } }
    cnt[key+best] = (cnt[key+best]||0)+1; used.add(key+best); return pool[best]; };
  const S1 = [
    s=>({...s, fx:[...(s.fx||[]), {k:'selfShieldDef', pct:120}]}),
    s=>({...s, sm:r1((s.sm||0)*0.85), vengeance:25}),
    s=>({...s, fx:[...(s.fx||[]), {k:'selfHealDef', pct:90}]}),
    s=>({...s, fx:[...(s.fx||[]).filter(f=>f.s!=='provoke'), {k:'guardAllies', who:'lowest', turns:2}]}),
  ];
  const SA = [ // sorts d'équipe défensifs (bouclier / défense)
    s=>({...s, fx:[{k:'guardAllies', turns:2}, buff('defUp')]}),
    s=>({...s, fx:[buff('endure',1), buff('defUp'), ...(s.fx||[]).filter(f=>f.k==='cleanse')]}),
    s=>({...s, t:'self', fx:[{k:'stoneWall'}], cd:Math.max(5, s.cd||5)}),
    s=>({...s, fx:[{k:'guardAllies', turns:2}, {k:'selfShieldDef', pct:150}]}),
  ];
  const SP = [ // provocations de zone
    s=>({...s, fx:[...s.fx, buff('counterUp')]}),
    s=>({...s, fx:[...s.fx, {k:'guardAllies', turns:1}]}),
    s=>({...s, sm:r1((s.sm||0)*0.8), vengeance:30}),
  ];
  const PAS = [ s=>P("Guardian", {k:'guardAura', v:20}), s=>P("Last Bastion", {k:'lastStand', v:25}) ];
  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Défense') continue;
    const used = new Set();
    M.skills.forEach((s,i)=>{ let c = null; const h = hash(M.id+'%'+i), fx = (s.fx||[]).map(f=>f.k+(f.s||''));
      if (s.passive){ if (['counter','dmgReduce','reflect'].includes(s.passive.k) && h%5<2) c = choose(PAS, 'p', h>>>4, used)(s); }
      else if (i===0 && s.t==='enemy' && fx.length<=1 && h%3!==0) c = choose(S1, 'a', h>>>3, used)(s);
      else if (i>0 && s.t==='allies' && fx.includes('buffshield') && h%4!==0) c = choose(SA, 'b', h>>>6, used)(s);
      else if (i>0 && s.t==='enemies' && fx.includes('debuffprovoke') && h%3!==0) c = choose(SP, 'c', h>>>8, used)(s);
      if (c){ c.d = describe(c); M.skills[i] = c; } }); }
})();

   Comme dans Summoner's War : fusionner un doublon (même monstre) ou utiliser un Copycat
   augmente d'un niveau un sort tiré au hasard parmi ceux qui ne sont pas au maximum. */
const UP_TXT = {dmg:"Damage +10%", acc:"Effect chance +15%", heal:"Heals / shield +15%", cd:"Cooldown −1 turn"};
function genUps(s){
  if (s.passive) return [];
  const fx = s.fx||[], u = [];
  if (s.m>0) u.push('dmg');
  if (fx.some(f=>f.c && f.c<100)) u.push('acc');
  if (fx.some(f=>f.k==='heal'||f.k==='revive'||f.s==='shield')) u.push('heal');
  if (s.m>0) u.push('dmg');
  if ((s.cd||0)>=3) u.push('cd');
  return u.slice(0,4);
}
for (const t of MONSTERS) t.skills.forEach(s=>s.ups = genUps(s));
const skMax = s => 1 + (s.ups||[]).length;

const hash6 = str => { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0; return h; };
function awakenSkill(s, t){
  const c = {...s, fx:(s.fx||[]).map(f=>({...f})), awk6:true};
  if (s.passive){ const p = c.passive = {...s.passive};
    if (p.k==='dmgReduce') p.v = Math.min(35, p.v+10); else if (p.k==='counter') p.c = Math.min(60, p.c+20);
    else if (p.k==='revive') p.pct = Math.min(80, p.pct+25); else if ('v' in p) p.v = Math.round(p.v*1.5);
    c.awkTxt = "enhanced passive"; return c; }
  const kind = s.t==='random' ? 'random' : s.t==='enemies' && s.m>0 ? 'aoe' : s.t==='enemy' && s.m>0 ? 'single' : s.t==='allies' ? 'allies' : s.t==='ally' ? 'ally' : null;
  if (!kind){ c.fx.forEach(f=>{ if (f.pct) f.pct = Math.round(f.pct*1.3); }); c.awkTxt = "effects +30%"; c.d = describe(c); return c; }
  let opts = AWK6_VAR[kind];
  if (kind==='single' && (s.hits||1)>1) opts = opts.filter(o=>o[2]!=='multi');   // déjà multi-coups
  if (s.fx?.some(f=>f.k==='extraOnKill')) opts = opts.filter(o=>o[2]!=='extra');
  // on évite les variantes qui ajoutent un effet déjà présent (ex. bouclier sur un sort de bouclier)
  const h = hash6(t.id+'|'+s.n), dup = fx => { const k = fx.map(f=>f.k+(f.s||'')); return new Set(k).size !== k.length; };
  for (let j=0; j<opts.length; j++){ const [fn, txt] = opts[(h+j) % opts.length];
    const r = fn({...c, fx:c.fx.map(f=>({...f}))}, t.el); if (dup(r.fx) && j<opts.length-1) continue;
    if (!r.sm) delete r.sm; r.awkTxt = txt; r.d = describe(r); return r; }
}
/* ---------- Passifs 7★ ----------
   Au passage 7★, tous les passifs du monstre sont renforcés (valeurs ×1,5, plafonnées) ;
   les passifs sans valeur gagnent en plus +15 % de dégâts. */
const P7_CAP = {ward:50, cond:70, dmgReduce:45, ironWill:90, killAtb:100, opening:80, bloodOath:100, reflect:40, guardAura:40, antiShield:60, critOverflow:30, healSteal:60, overflow:100};
function boostPassive7(s){
  const p = {...s.passive, s7:true}, k = p.k; if (!['v','c','pct'].some(f=>typeof p[f]==='number')) p.flat = true;
  if (k==='stoneHeart') p.v = Math.round(p.v*0.7);
  else if (k==='auraBuff') p.v += 1;
  else for (const f of ['v','c','pct']) if (typeof p[f]==='number') p[f] = Math.min(f==='c'?100:(P7_CAP[k]??999), Math.round(p[f]*1.5));
  const n = {...s, passive:p, p7:true}; n.d = describe(n); return n;
}
const kit7 = kit => kit.map(s=>s.passive ? boostPassive7(s) : s);

  if (sk.perBuff) k *= 1 + sk.perBuff/100*Object.keys(d.st).filter(x=>STATUS[x].good).length;   // punit les bonus
  if (sk.berserk) k *= 1 + sk.berserk*(1 - a.hp/a.maxHp);                            // plus fort quand il est blessé

  if (sk.perAlly && typeof B!=='undefined' && B) k *= 1 + sk.perAlly/100*(B.friends(a).length - 1);  // force du nombre

function addThirdSkills(){

/* Tanks basés sur les PV : environ 2 tanks sur 3 frappent selon leurs PV max (et plus selon la défense),

function hpTanks(){
  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Défense') continue;
    if (M.skills.some(s=>s.sc==='hp')){ M.hpTank = true; continue; }

}

  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Attaque') continue;

    const h = hash6(M.id+'sc') % 8, kind = h<2 ? 'spd' : h===2 ? 'def' : null; if (!kind) continue;

      const c = kind==='spd' ? {...s, spdMul:true}

function assignPassives(){
  const fams = {}; for (const M of MONSTERS) if (!M.dungeonBoss) (fams[(M.fam||M.id)+'|'+M.stars] ??= []).push(M);
  const global = {};

    for (const M of list){ const pc = M.skills.filter(s=>s.passive).length, ac = M.skills.length - pc;
      // pas de passif → un passif ; 4★/5★ avec seulement 2 compétences actives et 1 passif → un 2e passif
      if (!(pc===0 || (M.stars>=4 && ac<3 && pc<2))) { M.skills.forEach(s=>s.passive && used.add(s.passive.k)); continue; }
      const own = new Set(M.skills.filter(s=>s.passive).map(s=>s.passive.k));
      const g = kitSignals(M), role = ROLES[M.role]?.n || M.role, h = hash6(M.id);
      let best = null;
      for (const [k,L] of Object.entries(PAS_LIB)){ if (k==='exploit' || own.has(k) || used.has(k) || (PAS_FORBID[role]||[]).includes(k)) continue;
        let s = 0; for (const [sig,w] of Object.entries(L.fit)) s += (g[sig]||0)*w;
        s -= (global[k]||0)*0.12; s += ((h>>> (k.length%7)) % 100)/400;           // petite variété, et on évite qu'un passif soit partout

      const L = PAS_LIB[best.k], q = {3:0.75, 4:0.88, 5:1}[M.stars] || 1, p = {k:best.k, ...L.mk(q, M.el)};

for (const [k,L] of Object.entries(PAS_LIB)) PASSIVE_TXT[k] = L.d;
PASSIVE_TXT.critOverflow = p => `Passive: +${p.v}% crit rate; crit rate above 100% is converted into crit damage (×1.5).`;
function pasDmgMul(a, d){ let m = 1; for (const p of pasAll(a)) m *= pasDmgMul1(a, d, p); return m; }
function pasDmgMul1(a, d, p){
  if (p.k==='cond') return condMul(a, d, p);
  if (p.s7 && p.flat) return 1.15;
  if (p.k==='fury') return 1 + p.v/100*(a.furyN||0);
  if (p.k==='pyreJudge') return 1 + p.v/100*Math.min(BURN_MAX, d.st.burn ? (d.st.burn.stk?.length || 1) : 0);
  if (p.k==='fallenHunger') return 1 + p.v/100*(a.hungerN||0);
  if (p.k==='cruelty') return 1 + p.v/100*Object.keys(d.st).filter(k=>!STATUS[k].good).length;
  if (p.k==='exploit' && d.st[p.s]) return 1 + p.v/100;
  return 1; }
// Vitesse multiplicative : chaque point de VIT au-dessus de 100 ajoute 0,67 % de dégâts (min ×0,8)
const spdFactor = (a, sk) => sk.spdMul ? Math.max(0.8, 1 + (effStat(a,'spd')-100)/150)
  : (!sk.passive && pasK(a,'spdRamp')?.spdAll) ? Math.max(1, 1 + (effStat(a,'spd')-100)/300) : 1;   // Brisane : moitié moins que les sorts « selon la VIT »
function calcDamage(a, d, sk){
  const adv = elemAdv(a.el, d.el);
  let base = effStat(a,'atk')*sk.m*spdFactor(a, sk);
  if (sk.sc) base += (sk.sc==='hp' ? a.maxHp : effStat(a, sk.sc)) * sk.sm;
  const ign = Math.min(90, (hwM(a)==='burningBlade' ? 30 : 0) + (sk.ignDef||0) + (sk.slipStrike ? Math.min(sk.slipStrike, Math.max(0, (effStat(a,'spd')-100)/5)) : 0));
  let dmg = base * 1000 / (1140 + 3.5*effStat(d,'def')*(1-ign/100)*(trOf(a)==='shatter'?0.85:1));
  if (sk.perDebuff) dmg *= 1 + sk.perDebuff/100*Object.keys(d.st).filter(k=>!STATUS[k].good).length;
  if (sk.pctHp) dmg += (d.wb ? 60000 : d.maxHp)*sk.pctHp/100*(d.boss?0.3:1)*(sk.hits?1/sk.hits:1);   // boss mondial : PV de référence fixes
  if (sk.vengeance) dmg += Math.min(a.maxHp*0.6, (a.sTaken||0)*sk.vengeance/100) / (sk.hits||1);
  if (sk.lowHp) dmg *= 1 + sk.lowHp*(1 - d.hp/d.maxHp);
  dmg *= extraMods(a, d, sk) * traitDmgMul(a, d) * pasDmgMul(a, d) * wardMul(a, d, sk) * SIG.dmgMul(sk, a, d) * (a.shiny ? 1.1 : 1);
  if (!!pasK(a,'bonusVsDebuff') && hasBad(d)) dmg *= 1 + pasK(a,'bonusVsDebuff').v/100;
  dmg *= hwDmgMul(a, d);
  if (d.st.mark) dmg *= 1.25;
  if (d.st.carapace) dmg *= 1 - 0.15*d.st.carapace.n;
  if (a.st.overheat) dmg *= 1 + 0.15*a.st.overheat.n;
  if (!!pasK(d,'dmgReduce')) dmg *= 1 - pasK(d,'dmgReduce').v/100;
  let crit=false, glance=false;
  if (adv<0 && Math.random()<0.25){ glance=true; dmg*=0.7; }
  else { const co = pasK(a,'critOverflow'), ch = (hwM(a)==='snipeWeak' && d.hp < d.maxHp*0.5 ? 999 : 0) + effStat(a,'cr') + (adv>0?15:0) + (co ? co.v : 0);
    if (Math.random()*100 < ch){ crit=true; dmg *= 1 + (effStat(a,'cd') + (sk.cdBonus||0) + (sk.critBonus||0)*2 + (a.insp||0)*8 + (co ? Math.max(0, ch-100)*1.5 : 0))/100; } }

/* Brûlure : 5 % des PV max par cumul et par tour, jusqu'à 5 cumuls.

/* ---------- Mécaniques des boss (donjons, niveau 21+) ----------

             Retirer ses effets positifs annule le souffle ; l'immunité protège des effets.
   echos   : Miroir — tous les 3 tours, renvoie 50 % des dégâts 2 tours (à retirer). Sous 50 % de PV, se soigne de 8 % par tour sauf soins bloqués.
   tresor  : Coffre-fort — tous les 3 tours, bouclier de 20 % de ses PV. S'il tient encore à son tour suivant : pluie d'or sur toute l'équipe.

  forge:"♨️ Overheat: +15% damage per turn (6 stacks). Slowing it or reducing its attack bar removes them; so does positive-effect removal.",
};

const WB_TRIES = 3, WB_TURNS = 5;
const wbDay = () => Math.floor(Date.now()/86400000);

const WB_RANKS = [1,2,3,4,6,8,11,15,20,28,38,50,70,95,130,180,250,340,460,620,850,1150,1600,2200,3000,4200,6000,8500];
function genWBWaves(){ return [[{tpl:wbBoss(), lvl:70, boss:true, giant:true, wb:true, k:1.5, hpMul:100}]]; }
// équipes des invocateurs IA : composition cohérente reprise de l'arène, runes selon le rang (Légion pour les 10 meilleurs)
// les invocateurs IA (arène, boss mondial, instance, highlights) ont leurs sorts montés au maximum, comme un vrai joueur
const npcSkl = id => TPL[id].skills.map(s=>skMax(s));
function wbBotMon(tplId, rar, rl, lvl, rnd){

// simulation rapide (sans affichage) d'un combat contre le boss mondial
async function simWB(allyUnits){
  const keys = ['back','banner','buildField','cast','endModal','float','hit','impact','lunge','skillBar','sparkle','update','hlEnd'], saved = {};
  keys.forEach(k=>{ saved[k] = UI[k]; UI[k] = k==='lunge' ? async()=>{} : ()=>{}; }); const sim0 = window.SIM; window.SIM = true;

}
async function wbBoard(onProgress){

}
function wbRank(dmg){ const b = S.wb?.board || []; return 1 + b.filter(x=>x.dmg > dmg).length; }
const WB_RANK_RW = r => r===1 ? {crystals:400, legion:1, grind:[7,7]} : r<=3 ? {crystals:250, titan:1, grind:[6,6]} : r<=10 ? {crystals:150, grind:[5,6]} : r<=20 ? {crystals:80, grind:[4,5]} : {crystals:40, grind:[3]};

function wbReward(dmg){
  const mana = Math.min(60000, 1500 + Math.round(dmg/40)); S.mana += mana;
  if (dmg > (S.wb.best||0)) S.wb.best = dmg; S.wb.last = dmg; S.wb.tries++; save();
  return {mana, xp:0, crystals:0, runes:[], ups:[], wb:{dmg, best:S.wb.best, rank:wbRank(S.wb.best)}};
}


class Battle {
  constructor(stage, dungeon=null, arena=null, hl=null){
    this.stage = stage; this.dungeon = dungeon; this.arena = arena; this.hl = hl;
    if (hl){ this.waves = [hl.b.team]; this.waveIdx = 0; this.allies = hl.a.team.map(x=>hlMake(x,'ally')); this.lead = applyLead(this.allies);
      this.enemies = []; this.over = false; this.pending = null; this.sel = 0; this.auto = true; this.speed = S.prefs.speed; this.active = null; this.turns = 0; this.kills = 0; return; }
    this.waves = arena ? [arenaNpc(arena.id, arena.ctr).team] : dungeon ? genDungeonWaves(dungeon) : genWaves(stage); this.waveIdx = 0;
    this.allies = dungeon?.units ? dungeon.units : S.team.map(mon).filter(Boolean).map(unitFromMonster);
    if (dungeon?.id==='inst'){ this.allies.forEach(a=>a.owner="You");
      const mine = this.allies.slice();
      for (const p of instParty(dungeon.floor)) for (const x of p.team) this.allies.push(makeUnit(x.tpl, x.lvl, 'ally', {...x.stats}, {aura:x.aura, awk6:x.stars>=6, s7:x.stars>=7, sets:x.sets||[], skl:npcSkl(x.tpl), bot:true, owner:p.name}));
      // chaque monstre des bots frappe au moins aussi fort qu'un monstre moyen de ton équipe
      const bots = this.allies.filter(u=>u.bot), avg = us => us.reduce((t,u)=>t + u.stats.atk*(1+Math.min(100,u.stats.cr)/100*u.stats.cd/100)*(0.6+u.stats.spd/250), 0) / Math.max(1, us.length);
      const mul = Math.max(1, Math.min(4, avg(mine) / Math.max(1, avg(bots)) * 1.15));
      for (const u of bots) u.botMul = mul; this.botMul = mul; }
    this.lead = dungeon?.units ? null : applyLead(this.allies);
    this.enemies = []; this.over = false; this.pending = null; this.sel = 0; if (dungeon?.id==='wb') this.wbDmg = 0;
    this.auto = dungeon?.units ? true : S.prefs.auto; this.speed = S.prefs.speed; this.active = null; this.turns = 0; this.kills = 0;
  }
  all(){ return [...this.allies, ...this.enemies]; }
  side(u){ return u.side==='ally'?this.allies:this.enemies; }
  friends(u){ return this.side(u).filter(x=>!x.dead); }
  foes(u){ return (u.side==='ally'?this.enemies:this.allies).filter(x=>!x.dead); }
  lowest(arr){ return arr.slice().sort((x,y)=>x.hp/x.maxHp - y.hp/y.maxHp)[0]; }

  async run(){
    this.startWave();
    while (!this.over){
      if (!this.allies.some(a=>!a.dead)) return this.finish(false);
      if (!this.enemies.some(e=>!e.dead)){
        if (this.waveIdx < this.waves.length-1){ this.waveIdx++; await wait(700); if(this.over) return; this.startWave(); await wait(500); continue; }
        return this.finish(true);
      }
      const u = this.nextActor();
      await this.turn(u);
      if (u.wb && !this.over && ++u.wbT >= WB_TURNS){ UI.banner("⏱️ End of battle", u); await wait(600); return this.finish(true); }
      if (++this.turns > 800) return this.finish(false); // garde-fou
    }
  }
  traitWaveStart(){ for (const u of this.all()) if (!u.dead && trOf(u)==='supporter') for (const x of this.friends(u)) x.atb = Math.min(99, x.atb+15);
    for (const u of this.all()){ if (u.dead) continue; for (const p of pasAll(u)){
      if (p?.k==='opening'){ u.atb = Math.min(99, u.atb + p.v); u.st.spdUp = {t:2}; }
      if (p?.k==='aegis') u.st.shield = {t:3, v:Math.round(u.maxHp*p.v/100)}; } }
    for (const u of this.all()) if (!u.dead) this.proc(u,'wave'); }
  startWave(){
    if (this.hl){ this.enemies = this.hl.b.team.map(x=>hlMake(x,'enemy')); applyLead(this.enemies);
      this.traitWaveStart(); UI.buildField(); UI.banner(`🎬 ${this.hl.a.name} vs ${this.hl.b.name}`); return; }
    if (this.arena){ this.enemies = this.waves[0].map(e=>makeUnit(e.tpl, e.lvl, 'enemy', {...e.stats}, {sets:e.sets||[], skl:npcSkl(e.tpl), aura:e.aura, awk6:e.stars>=6, s7:e.stars>=7})); applyLead(this.enemies);
      this.traitWaveStart(); UI.buildField(); UI.banner(`🏟️ ${arenaNpc(this.arena.id).name}`); return; }
    this.enemies = this.waves[this.waveIdx].map(e=>unitEnemy(e, this.stage));
    if (this.dungeon && BOSS_MECH[this.dungeon.id] && this.dungeon.floor>=MECH_FLOOR) this.enemies.forEach(x=>{ if (x.boss){ x.mech = this.dungeon.id; x.mechT = 0; } });
    if (this.waveIdx===2) applyLead(this.enemies.filter(e=>e.boss));
    this.traitWaveStart(); UI.buildField(); UI.banner(this.waveIdx===2 ? "👑 Boss wave" : `Wave ${this.waveIdx+1}`);
  }
  // Barre d'attaque : chaque unité remplit sa barre selon sa vitesse ; la première à 100 joue.
  nextActor(){
    const alive = this.all().filter(u=>!u.dead);
    const ready = alive.filter(u=>u.atb>=100);
    if (ready.length) return ready.sort((a,b)=>b.atb-a.atb || effStat(b,'spd')-effStat(a,'spd'))[0];
    let best=null, tmin=Infinity;
    for (const u of alive){ const s=effStat(u,'spd'), t=(100-u.atb)/s;
      if (t<tmin || (t===tmin && s>effStat(best,'spd'))){ tmin=t; best=u; } }
    for (const u of alive) u.atb += effStat(u,'spd')*tmin;
    best.atb = 100;
    return best;
  }
  usable(u, i){
    const s = u.skills[i];
    return !s.passive && u.cds[i]<=0 && !(u.st.silence && (s.cd||0)>0);
  }
  async turn(u){
    // Instance : si les bots restent loin derrière toi en dégâts, leur bonus monte petit à petit (jusqu'à ×6)
    if (this.botMul){ const al = this.allies, me = al.filter(x=>!x.bot), bo = al.filter(x=>x.bot);
      const dm = me.reduce((t,x)=>t+(x.sDmg||0),0)/Math.max(1,me.length), db = bo.reduce((t,x)=>t+(x.sDmg||0),0)/Math.max(1,bo.length);
      if (dm > 0 && this.turns > 3){ const m = Math.max(1, Math.min(6, this.botMul * Math.pow(Math.max(0.25, Math.min(4, dm*0.8/Math.max(1,db))), 0.15)));
        this.botMul = m; for (const x of bo) x.botMul = m; } }
    this.active = u; this.kills = 0; u.carry = 0; u.cds = u.cds.map(c=>Math.max(0,c-1)); UI.update();
    if (u.mech && !u.dead && await this.bossMech(u)){ this.endTurn(u); return; }
    // effets de début de tour
    if (u.st.burn){ const n = u.st.burn.stk?.length || 1, d = Math.round(u.maxHp*BURN_PCT*n); this.damage(u, d, {}, null); this.log(`${u.tpl.name} takes ${d} burn damage${n>1?` (×${n})`:''}.`); await wait(350); if (u.dead){ this.active=null; return; } }
    { const hq = !u.wb && this.foes(u).find(x=>!x.dead && pasK(x,'hellQueen')), nd = Object.keys(u.st).filter(k=>STATUS[k] && !STATUS[k].good).length;
      if (hq && nd>=2){ const p = pasK(hq,'hellQueen'), d = Math.round(u.maxHp*p.v/100*(u.boss||u.giant?0.5:1)); this.damage(u, d, {}, hq); hq.atb = Math.min(100, hq.atb + p.atb);
        UI.float(u,"🔥 Damned Soul",'glance'); this.log(`🔥 ${u.tpl.name} burns in the infernal flames (${d}) · ${hq.tpl.name} gains ${p.atb}% bar.`); await wait(300); if (u.dead){ this.active=null; return; } } }
    if (u.st.regen) this.heal(u, u.maxHp*0.15);
    if (!!pasK(u,'regen')) this.heal(u, u.maxHp*pasK(u,'regen').v/100);
    if (!!pasK(u,'auraHeal')) this.friends(u).forEach(x=>this.heal(x, x.maxHp*pasK(u,'auraHeal').v/100));
    if (!!pasK(u,'auraCleanse')) this.friends(u).forEach(x=>{ const k = Object.keys(x.st).find(k=>!STATUS[k].good && !x.st[k].lock); if (!k) return; delete x.st[k]; UI.float(x,"Purified",'info'); this.heal(x, x.maxHp*pasK(u,'auraCleanse').v/100); });
    if (!!pasK(u,'auraBuff')){ const fr = this.friends(u); if (fr.length){ const x = fr.reduce((b,y)=>y.hp/y.maxHp<b.hp/b.maxHp?y:b); this.addStatus(x, pick(['atkUp','defUp','spdUp','critUp','counterUp','reflectUp']), pasK(u,'auraBuff').v); } }
    if (!!pasK(u,'auraAtb')) this.friends(u).forEach(x=>{ if (x!==u) x.atb = Math.min(100, x.atb+pasK(u,'auraAtb').v); });
    if (await this.hwTurnStart(u)) return;
    { const tb = pasK(u,'tideBless'); if (tb){ const al = this.side(u).filter(x=>!x.dead && x!==u).sort((a,b)=>a.atb-b.atb)[0];
        if (al){ al.atb = Math.min(100, al.atb + tb.atb); this.addStatus(al,'shield',2,{v:Math.round(u.maxHp*tb.sh/100)}); UI.float(al,"🌊 Blessed Tide",'info'); } } }
    { const ce = pasK(u,'cycloneEye'); if (ce){ let n = 0; for (const f of this.foes(u)) if (!f.dead && (f.st.stun||f.st.freeze||f.st.sleep||f.st.silence)){ f.atb = Math.max(0, f.atb - ce.atb); n++; UI.float(f,'🌀 −'+ce.atb+"% bar",'glance'); }
        if (n) this.log(`🌀 ${u.tpl.name}'s Eye of the Cyclone slows ${n} controlled enemy(ies).`); } }
    { const rp = pasK(u,'spdRamp'); if (rp && (u.ramp||0) < rp.max){ u.ramp = (u.ramp||0)+1; UI.float(u,`💨 SPD +${rp.v*u.ramp}${rp.flat?'':'%'}`,'info'); } }
    this.proc(u,'turnStart'); u.ptc = (u.ptc||0)+1; if (u.ptc%3===0) this.proc(u,'every3');
    if (u.st.stun){ UI.float(u,"Stunned",'info'); this.log(`${u.tpl.name} is stunned.`); await wait(600); this.endTurn(u); return; }
    let choice;
    const pv = u.st.provoke && this.all().find(x=>x.uid===u.st.provoke.src && !x.dead);
    if (pv){ choice = {i:0, target:pv}; UI.float(u,"Provoked",'info'); }
    else choice = (u.side==='ally' && !this.auto && !u.bot) ? await this.askPlayer(u) : aiChoose(this, u);
    if (this.over) return;
    await this.useSkill(u, choice.i, choice.target);
    const pe = pasK(u,'echo'), pm = pasK(u,'moonGrace');
    if (pe && !u.dead && !this.over && Math.random()*100 < pe.c){ const f = this.foes(u); if (f.length){ UI.float(u,"🔁 Echo",'info'); await this.useSkill(u, 0, this.lowest(f), false); } }
    if (pm && !u.dead){ const l = this.lowest(this.friends(u)); if (l) this.heal(l, l.maxHp*pm.v/100); }
    this.endTurn(u);
  }
  endTurn(u){
    for (const [k,v] of Object.entries(u.st)){ if (v.fresh){ v.fresh=false; continue; }
      if (k==='burn' && v.stk){ v.stk = v.stk.map(t=>t-1).filter(t=>t>0); if (!v.stk.length) delete u.st[k]; else v.t = Math.max(...v.stk); continue; }
      if (--v.t<=0) delete u.st[k]; }
    u.atb = u.dead ? 0 : Math.min(100, u.carry); u.carry = 0; this.active = null;
    if (!u.dead && !this.over && u.sets?.includes('godpower') && !u.st.stun && Math.random() < 0.10*u.sets.filter(k=>k==='godpower').length){
      u.atb = 100; UI.float(u,"⚡ God Power: extra turn!",'info'); this.log(`⚡ ${u.tpl.name} plays again thanks to the God Power set!`); }
    UI.update();
  }
  askPlayer(u){
    return new Promise(res=>{
      this.pending = {u, res};
      this.sel = u.skills.findIndex((s,i)=>this.usable(u,i)); if (this.sel<0) this.sel = 0;
      UI.skillBar(); UI.update();
    });
  }
  resolvePlayer(i, target){
    const p = this.pending; if (!p) return;
    this.pending = null; UI.skillBar(); p.res({i, target});
  }
  validTargets(u, sk){
    if (sk.passive) return [];
    if (isOff(sk)) return this.foes(u);
    if (sk.t==='self') return [u];
    return this.friends(u);
  }
  async useSkill(u, i, target, isCounter=false){
    this.actSeq = (this.actSeq||0) + 1;   // une « attaque » = une utilisation de compétence
    const sk = u.skills[i]; if (!isCounter) u.cds[i] = sk.cd||0;
    const offensive = isOff(sk);
    if (!target || target.dead) target = offensive ? this.lowest(this.foes(u)) : u;
    if (!target) return;
    let targets = (sk.t==='enemy'||sk.t==='ally'||sk.t==='self') ? [target] : this.validTargets(u, sk);
    let hitList = null;
    if (sk.t==='random'){ const fs = this.foes(u); hitList = Array.from({length:sk.hits||1}, ()=>pick(fs)); targets = [...new Set(hitList)]; }
    UI.banner(isCounter ? "Counterattack!" : sk.n, u);
    const A = animOf(sk, u.el);
    if (offensive && A.melee) await UI.lunge(u, targets, sk); else UI.cast(u, targets, sk);
    if (!isCounter) this.log(`<b>${u.tpl.name}</b> uses ${sk.n}${targets.length===1&&target!==u?' sur '+target.tpl.name:''}.`);
    await playAnim(u, sk, targets, A);
    let total = 0; const hit = []; let critCdDone = false, anyCrit = false;
    if (sk.sig?.k==='bloodPrice' && !isCounter && u.hp > u.maxHp*0.1){ u.hp -= Math.round(u.maxHp*0.06); UI.float(u,"🩸 Blood Price",'info'); }
    if (offensive && sk.m>0){
      const seq = hitList ? hitList.map(t=>[t,1]) : targets.map(t=>[t, sk.hits||1]);
      for (const [tg0,n] of seq){
        for (let h=0; h<n; h++){
          let tg = tg0; if (tg.dead){ if (!hitList) break; const al = this.foes(u); if (!al.length) break; tg = pick(al); }
          let broke = false; if (sk.breakShield && tg.st.shield){ delete tg.st.shield; broke = true; UI.float(tg,"💥 Shield broken",'info'); }
          const r = calcDamage(u, tg, sk); if (broke) r.dmg = Math.round(r.dmg*(1+sk.breakShield/100)); if (sk.pierce) r.pierce = sk.pierce;
          if (!!pasK(u,'antiShield') && (tg.st.shield || Object.keys(tg.st).some(k=>STATUS[k].good))) r.dmg = Math.round(r.dmg*(1+pasK(u,'antiShield').v/100));
          const slowed = !!tg.st.slow; UI.impact(tg, u.el, r.crit); const dealt = this.damage(tg, r.dmg, r, u); total += dealt;
          if (trOf(u)==='vampire' && dealt>0) this.heal(u, dealt*0.10);
          const pu = pasK(u,'emberSoul'), ph = pasK(u,'hunterMark');
          if (pu && !tg.dead && tg.st.burn){ const n = tg.st.burn.stk?.length||1; const x = this.damage(tg, Math.round(effStat(u,'atk')*pu.v/100*n), {glance:true}, u); total += x; }
          if (ph && !tg.dead && Math.random()*100 < ph.c) this.addStatus(tg, 'mark', 1);
          if (r.crit){ anyCrit = true; this.proc(u,'crit'); for (const x of this.friends(u)) if (x!==u) this.proc(x,'allyCrit'); }
          if (pasK(u,'critCd') && r.crit && !critCdDone){ critCdDone = true; let j = -1; u.cds.forEach((c,ii)=>{ if (ii!==i && c>0 && (j<0 || c>u.cds[j])) j = ii; }); if (j>=0){ u.cds[j]--; UI.float(u,'⏩ Recharge','info'); } }
          if (trOf(u)==='frost' && slowed && !tg.dead) tg.atb = Math.max(0, tg.atb-10);
          if (!hit.includes(tg)) hit.push(tg);
          if (sk.splash && dealt>0) for (const o of this.foes(u)) if (o!==tg) this.damage(o, Math.round(dealt*sk.splash/100), {glance:true}, u);
          this.hwHit(u, tg, dealt, sk, i);
          if (sk.armorCrush && dealt>0 && !tg.dead && effStat(u,'def') > effStat(tg,'def')) this.tryDebuff(u, tg, {k:'debuff', s:'defBreak', c:sk.armorCrush, turns:2});
          if (sk.destroy && dealt>0 && !tg.dead && !tg.wb){ tg.maxHp0 ??= tg.maxHp; const cut = Math.min(Math.round(dealt*sk.destroy/100), Math.round(tg.maxHp0*0.05), Math.max(0, tg.maxHp - Math.round(tg.maxHp0*0.5)));
            if (cut>0){ tg.maxHp -= cut; tg.hp = Math.min(tg.hp, tg.maxHp); UI.float(tg,'💔 −'+fmt(cut)+" Max HP",'glance'); } }
          if ((sk.hits||1)>1) await wait(170);
        }
      }
      if (sk.afterimage && !isCounter){ const k = Math.min(sk.afterimage, Math.floor(Math.max(0, effStat(u,'spd')-100)/100));
        for (let x=0; x<k; x++){ const tg = targets.find(t=>!t.dead) || this.foes(u)[0]; if (!tg) break; await wait(140); const r = calcDamage(u, tg, sk); UI.float(tg,"💨 Afterimage",'info'); UI.impact(tg, u.el, r.crit); total += this.damage(tg, Math.round(r.dmg*0.6/(sk.hits||1)), r, u); } }
      if (sk.critAgain && anyCrit && !isCounter){ const tg = targets.find(x=>!x.dead); if (tg){ await wait(160); const r = calcDamage(u, tg, sk); UI.float(tg,"⚔️ Double hit",'info'); UI.impact(tg, u.el, r.crit); total += this.damage(tg, Math.round(r.dmg*0.5/(sk.hits||1)), r, u); } }
      if (hitList) targets = hit.length ? hit : targets;
      if (!!pasK(u,'chain') && sk.t==='enemy' && total>0 && !isCounter){ const o = this.foes(u).filter(x=>!hit.includes(x)); if (o.length){ const c = pick(o); UI.float(c,"⚡ Bounce",'info'); this.damage(c, Math.round(total*pasK(u,'chain').v/100), {glance:true}, u); } }
      if (!!pasK(u,'fury') && !isCounter) u.furyN = Math.min(5, (u.furyN||0)+1);
    }
    for (const f of sk.fx||[]){
      const who = f.who==='self' ? [u] : f.who==='allies' ? this.friends(u) : f.who==='lowest' ? [this.lowest(this.friends(u))]
                : (offensive ? [u] : targets);
      switch (f.k){
        case 'debuff': targets.forEach(tg=>this.tryDebuff(u, tg, f)); break;
        case 'buff':   who.forEach(x=>this.addStatus(x, f.s, f.turns, f.s==='shield' ? {v:Math.round(u.maxHp*f.pct/100)} : {})); break;
        case 'heal':   who.forEach(x=>{ if (!x || x.dead) return;
            let a = f.mode==='miss' ? (x.maxHp-x.hp)*f.pct/100 : f.mode==='self' ? u.maxHp*f.pct/100 : f.mode==='atk' ? effStat(u,'atk')*f.pct/100 : x.maxHp*f.pct/100;
            if (f.urgent && x.hp/x.maxHp < 0.35) a *= f.urgent;
            const miss = x.maxHp - x.hp; this.heal(x, a);
            if (f.over && a > miss && !x.st.healBlock){ const sh = Math.round((a-miss)*f.over); if (sh>0) this.addStatus(x, 'shield', 2, {v:sh + (x.st.shield?.v||0)}); } }); break;
        case 'selfShieldDef': this.addStatus(u, 'shield', 2, {v:Math.round(effStat(u,'def')*f.pct/100) + (u.st.shield?.v||0)}); break;
        case 'selfHealDef': this.heal(u, effStat(u,'def')*f.pct/100); break;
        case 'guardAllies': { const fr = this.friends(u).filter(x=>x!==u); const ws = f.who==='lowest' ? (fr.length?[fr.reduce((b,x)=>x.hp/x.maxHp<b.hp/b.maxHp?x:b)]:[]) : fr;
          ws.forEach(x=>this.addStatus(x, 'guard', f.turns||2, {src:u.uid})); break; }
        case 'stoneWall': this.addStatus(u, 'invincible', 1); this.foes(u).forEach(x=>{ if (!(!!pasK(x,'immuneCC')) && !x.st.immunity) this.addStatus(x, 'provoke', 1, {src:u.uid}); }); break;
        case 'devour': targets.forEach(x=>{ if (x.dead) return; const n = Object.keys(x.st).filter(k=>STATUS[k].good).length; if (!n) return;
            for (const k in x.st) if (STATUS[k].good) delete x.st[k]; UI.float(x,"Devoured!",'info'); u.carry = Math.min(100, (u.carry||0) + f.v*n); this.addStatus(u,'atkUp',2); }); break;
        case 'steal': targets.forEach(x=>{ if (x.dead) return; const got = Object.entries(x.st).filter(([k])=>STATUS[k].good);
            got.forEach(([k])=>delete x.st[k]); if (!got.length) return; UI.float(x,"Effects stolen!",'info');
            this.friends(u).forEach(a=>got.forEach(([k,v])=>this.addStatus(a, k, 1, k==='shield'?{v:v.v}:{}))); }); break;
        case 'invert': { const INV = {atkUp:'atkBreak', defUp:'defBreak', spdUp:'slow', critUp:'mark', immunity:'healBlock', regen:'burn', counterUp:'provoke', reflectUp:'silence'};
          targets.forEach(x=>{ if (x.dead) return; for (const [k,v] of Object.entries(x.st)) if (STATUS[k].good){ delete x.st[k]; if (INV[k]) this.addStatus(x, INV[k], Math.max(1,v.t), INV[k]==='provoke'?{src:u.uid}:{}); } }); break; }
        case 'transfer': { const tg = targets.find(t=>!t.dead); if (!tg) break;
          this.friends(u).forEach(a=>{ const k = Object.keys(a.st).find(k=>!STATUS[k].good && !a.st[k].lock); if (!k) return; const v = a.st[k]; delete a.st[k]; this.addStatus(tg, k, Math.max(1,v.t), k==='provoke'?{src:u.uid}:{}); }); break; }
        case 'atbSteal': targets.forEach(x=>{ if (x.dead) return; const t = Math.min(x.atb, f.v); x.atb -= t; const fr = this.friends(u).filter(a=>a!==u);

function arenaPP(){ const A = S.arena; if (!A) return 0; const def = (A.def||S.team).map(mon).filter(Boolean), atk = S.team.map(mon).filter(Boolean);

/* ---------- 6c. HIGHLIGHTS ----------

/* IA de ciblage : note chaque ennemi et vise le meilleur.
   Priorités : achever une cible tuable, PV bas, défense brisée / marquée / affaiblie, avantage élémentaire,
   soigneurs et attaquants dangereux, et garder la même cible que l'équipe (focus). On évite les cibles invincibles,
   et les contrôleurs évitent de ré-appliquer un effet déjà présent. */
function expDamage(a, d, sk){
  const adv = elemAdv(a.el, d.el);
  let base = effStat(a,'atk')*sk.m*spdFactor(a, sk); if (sk.sc) base += (sk.sc==='hp' ? a.maxHp : effStat(a, sk.sc)) * sk.sm;
  const ign = Math.min(90, (hwM(a)==='burningBlade' ? 30 : 0) + (sk.ignDef||0) + (sk.slipStrike ? Math.min(sk.slipStrike, Math.max(0, (effStat(a,'spd')-100)/5)) : 0));
  let dmg = base * 1000 / (1140 + 3.5*effStat(d,'def')*(1-ign/100)*(trOf(a)==='shatter'?0.85:1));
  if (sk.perDebuff) dmg *= 1 + sk.perDebuff/100*Object.keys(d.st).filter(k=>!STATUS[k].good).length;
  if (sk.pctHp) dmg += (d.wb ? 60000 : d.maxHp)*sk.pctHp/100*(d.boss?0.3:1)*(sk.hits?1/sk.hits:1);   // boss mondial : PV de référence fixes
  if (sk.lowHp) dmg *= 1 + sk.lowHp*(1 - d.hp/d.maxHp);
  dmg *= extraMods(a, d, sk) * traitDmgMul(a, d) * pasDmgMul(a, d) * wardMul(a, d, sk) * SIG.dmgMul(sk, a, d) * (a.shiny ? 1.1 : 1);
  if (!!pasK(a,'bonusVsDebuff') && hasBad(d)) dmg *= 1 + pasK(a,'bonusVsDebuff').v/100;
  dmg *= hwDmgMul(a, d);
  if (d.st.mark) dmg *= 1.25;
  if (d.st.carapace) dmg *= 1 - 0.15*d.st.carapace.n;
  if (a.st.overheat) dmg *= 1 + 0.15*a.st.overheat.n;
  if (!!pasK(d,'dmgReduce')) dmg *= 1 - pasK(d,'dmgReduce').v/100;
  const co = pasK(a,'critOverflow'), ch = effStat(a,'cr') + (adv>0?15:0) + (co ? co.v : 0), cr = Math.min(100, ch)/100;
  dmg *= 1 + cr*(effStat(a,'cd') + (sk.cdBonus||0) + (sk.critBonus||0)*2 + (co ? Math.max(0, ch-100)*1.5 : 0))/100;
  if (adv>0) dmg*=1.3; else if (adv<0) dmg*=0.8;
  return dmg * (sk.hits||1);
}
function aiPickFoe(b, u, s, foes){
  const ROLE_W = {Soin:18, Attaque:12, Soutien:8, 'Contrôle':6, 'Défense':-6};
  const cc = (s.fx||[]).filter(f=>f.k==='debuff').map(f=>f.s), focus = b.focus?.[b.allies.includes(u)?'a':'e'];
  let best = null, bs = -1e9;
  for (const f of foes){
    const hpPct = f.hp/f.maxHp, dmg = s.m>0 ? expDamage(u, f, s) : 0, eff = f.hp + (f.st.shield?.v||0);
    let sc = (1-hpPct)*60;                                   // PV manquants
    sc += Math.min(1, dmg/Math.max(1,eff))*45;               // part des PV restants qu'on enlève
    if (dmg >= eff) sc += 60;                                // coup fatal
    if (f.st.defBreak) sc += 28; if (f.st.mark) sc += 18;
    sc += Object.keys(f.st).filter(k=>!STATUS[k].good).length*4;
    const adv = elemAdv(u.el, f.el); sc += adv>0 ? 18 : adv<0 ? -14 : 0;
    sc += ROLE_W[f.tpl.role] || 0;
    if (f.boss && foes.length>1) sc -= 10;                  // on nettoie les adds avant le boss
    if (f.st.invincible) sc -= 200; if (f.st.shield) sc -= 6;
    if (!!pasK(f,'reflect') || f.st.reflectUp) sc -= 6;
    for (const k of cc) if (f.st[k] && !['burn','defBreak','mark'].includes(k)) sc -= 22;  // déjà sous l'effet
    if (cc.length && (!!pasK(f,'immuneCC') || f.st.immunity)) sc -= 15;
    if (focus===f.uid) sc += 14;
    const anti = s.breakShield || s.pierce || (s.fx||[]).some(x=>['devour','strip','steal','invert'].includes(x.k) || ['curse','seal','healBlock','oblivion'].includes(x.s));
    if (anti){ if (f.st.shield) sc += 22; sc += Object.keys(f.st).filter(k=>STATUS[k].good).length*7; if (f.tpl.role==='Soin' || f.tpl.role==='Soutien') sc += 14; }
    if (sc > bs){ bs = sc; best = f; }
  }
  if (best){ b.focus ??= {}; b.focus[b.allies.includes(u)?'a':'e'] = best.uid; }
  return best || b.lowest(foes);
}
function aiChoose(b, u){
  const sk = u.skills, friends = b.friends(u), foes = b.foes(u);
  const low = b.lowest(friends), anyDead = b.side(u).some(x=>x.dead);
  for (let i=sk.length-1; i>=0; i--){
    if (!b.usable(u,i)) continue;
    const s = sk[i], fx = s.fx||[];
    if (i>0 && s.m===0){
      const revives = fx.some(f=>f.k==='revive'), heals = fx.some(f=>f.k==='heal');
      if (revives && !anyDead && low.hp/low.maxHp > 0.5) continue;
      if (!revives && heals && low.hp/low.maxHp > 0.65) continue;
    }
    let target;
    if (s.t==='enemy') target = aiPickFoe(b, u, s, foes);
    else if (s.t==='ally') target = low;
    else if (s.t==='self') target = u;
    else target = (s.t==='enemies'||s.t==='random'?foes:friends)[0];
    return {i, target};
  }
  return {i:0, target:b.lowest(foes)};
}

const COND = {

const EL_SUF = {fire:["of Embers","of Flames","of the Blaze","of Ash"], water:["of the Tides","of Frost","of the Abyss","of Foam"], wind:["of the Zephyr","of Storms","of the Peaks","of the Blizzard"], light:["of Dawn","of the Sun","Celestial","of the Aurora"], dark:["of the Night","of Shadows","of the Void","of the Eclipse"]};
const COND_N = ["Predation","Opportunism",'Instinct',"Ascendancy",'Domination',"Superiority","Advantage","Glance"];
const WARD_N = ["Guard",'Vigilance',"Scale","Shield","Parry","Armor"];
PASSIVE_TXT.proc = p => `Passive: ${TRIG[p.on].t}, ${PFX[p.fx].t(p)}${p.cap?` (${p.cap} times per wave)`:''}.`;
PASSIVE_TXT.cond = p => `Passive: +${p.v}% damage ${COND[p.when].t}.`;

// ---------- moteur des déclencheurs ----------
Battle.prototype.proc = function(u, on, ctx={}){
  if (!u || u.dead) return;
  for (const p of pasAll(u)){ if (p.k!=='proc' || p.on!==on) continue;
    u.pcnt ??= {}; const key = on+p.fx;
    if (p.cap){ const w = this.waveIdx||0; if (u.pcntW!==w){ u.pcnt = {}; u.pcntW = w; } if ((u.pcnt[key]||0) >= p.cap) continue; u.pcnt[key] = (u.pcnt[key]||0)+1; }
    const foes = this.foes(u), fr = this.friends(u), atk = effStat(u,'atk');
    const nm = u.skills.find(s=>s.passive===p)?.n; if (nm) UI.float(u, '✦ '+nm, 'info');
    switch (p.fx){
      case 'atbSelf': u.atb = Math.min(100, u.atb + p.v); break;
      case 'atbAllies': fr.forEach(x=>{ if (x!==u) x.atb = Math.min(100, x.atb + p.v); }); break;
      case 'healSelf': this.heal(u, u.maxHp*p.v/100); break;
      case 'healAllies': fr.forEach(x=>this.heal(x, x.maxHp*p.v/100)); break;
      case 'shieldSelf': this.addStatus(u,'shield',2,{v:Math.round(u.maxHp*p.v/100)}); break;
      case 'shieldLow': { const l = this.lowest(fr); if (l) this.addStatus(l,'shield',2,{v:Math.round(u.maxHp*p.v/100)}); break; }
      case 'buffSelf': this.addStatus(u, p.s, p.d); break;
      case 'buffAllies': fr.forEach(x=>this.addStatus(x, p.s, p.d)); break;
      case 'debuffSrc': if (ctx.src && !ctx.src.dead && ctx.src.side!==u.side) this.tryDebuff(u, ctx.src, {s:p.s, c:p.c, turns:2}); break;
      case 'debuffRnd': if (foes.length) this.tryDebuff(u, pick(foes), {s:p.s, c:p.c, turns:2}); break;
      case 'strikeAll': foes.forEach(o=>this.damage(o, Math.round(atk*p.v/100*1000/(1140+3.5*effStat(o,'def'))*3), {glance:true}, u)); break;
      case 'strikeOne': { const l = this.lowest(foes); if (l) this.damage(l, Math.round(atk*p.v/100*1000/(1140+3.5*effStat(l,'def'))*3), {glance:true}, u); break; }
      case 'cdSelf': u.cds = u.cds.map(c=>Math.max(0,c-1)); break;
      case 'cleanseSelf': for (const k of Object.keys(u.st)) if (!STATUS[k].good && !u.st[k].lock) delete u.st[k]; break;
      case 'cleanseAllies': fr.forEach(x=>{ const k = Object.keys(x.st).find(k=>!STATUS[k].good && !x.st[k].lock); if (k) delete x.st[k]; }); break;
      case 'stripRnd': { const t = foes.filter(o=>Object.keys(o.st).some(k=>STATUS[k].good)); if (t.length){ const o = pick(t), k = Object.keys(o.st).find(k=>STATUS[k].good); delete o.st[k]; UI.float(o,"Effect removed",'info'); } break; }
      case 'drainAtb': foes.forEach(o=>{ if (!o.wb) o.atb = Math.max(0, o.atb - p.v); }); break;
      case 'stackAtk': u.pstk ??= {}; u.pstk.atk = Math.min(6, (u.pstk.atk||0)+1); break;
      case 'stackDef': u.pstk ??= {}; u.pstk.def = Math.min(6, (u.pstk.def||0)+1); break;
      case 'stackSpd': u.pstk ??= {}; u.pstk.spd = Math.min(6, (u.pstk.spd||0)+1); break;
    }
  }
};
// cumuls permanents (stackAtk/Def/Spd) appliqués aux statistiques effectives
{ const _eff = effStat; effStat = function(u, k){ let v = _eff(u, k); if (k==='spd' && u.ramp){ const rp = pasK(u,'spdRamp'); if (rp) v = rp.flat ? v + rp.v*u.ramp : v*(1 + rp.v/100*u.ramp); } const st = u.pstk; if (!st) return v;
    for (const p of pasAll(u)) if (p.k==='proc'){ if (k==='atk' && p.fx==='stackAtk') v *= 1 + p.v/100*(st.atk||0); if (k==='def' && p.fx==='stackDef') v *= 1 + p.v/100*(st.def||0); if (k==='spd' && p.fx==='stackSpd') v *= 1 + p.v/100*(st.spd||0); }
    return v; }; }
function condMul(a, d, p){
  const w = p.when, ok =
    w==='slower' ? effStat(d,'spd') < effStat(a,'spd') :
    w==='buffed' ? Object.keys(d.st).some(k=>STATUS[k]?.good) :
    w==='fullHp' ? d.hp/d.maxHp > 0.8 :
    w==='boss' ? !!d.boss :
    w==='adv' ? elemAdv(a.el, d.el) > 0 :
    w==='selfFull' ? a.hp/a.maxHp > 0.8 :
    w==='selfBuff' ? Object.keys(a.st).some(k=>STATUS[k]?.good) :
    w==='fewFoes' ? (B ? B.foes(a).length <= 2 : false) :
    w==='shielded' ? !!a.st.shield :
    w==='stunned' ? !!(d.st.stun || d.st.sleep) :
    w==='highDef' ? effStat(d,'def') > effStat(a,'def') :
    w==='perDead' ? true : false;
  if (!ok) return 1;
  if (w==='perDead') return 1 + p.v/100*(B ? B.side(a).filter(x=>x.dead).length : 0);
  return 1 + p.v/100;
}
function wardMul(a, d, sk){ let m = 1;
  for (const p of pasAll(d)){ if (p.k!=='ward') continue; const w = p.when, ok =
    w==='selfFull' ? d.hp/d.maxHp > 0.8 : w==='selfBuff' ? Object.keys(d.st).some(k=>STATUS[k]?.good) : w==='lowHp' ? d.hp/d.maxHp < 0.4 :
    w==='aoe' ? sk?.t==='enemies' : w==='debuffedSrc' ? Object.keys(a.st).some(k=>!STATUS[k]?.good) : w==='alone' ? true : false;
    if (!ok) continue;
    m *= w==='alone' ? 1 - Math.min(0.6, p.v/100*(B ? B.side(d).filter(x=>x.dead).length : 0)) : 1 - p.v/100; }
  return m; }

// ---------- conception des passifs ----------
function designPassives(){
  // passifs d'origine trop répandus (plus de 3 monstres) : au-delà des 3 premiers, on les redessine aussi
  const seen = {};
  for (const M of MONSTERS){ if (M.dungeonBoss) continue; for (const s of M.skills){ if (!s.passive || s.gen || ['critOverflow','exploit'].includes(s.passive.k)) continue;
    seen[s.passive.k] = (seen[s.passive.k]||0)+1; if (seen[s.passive.k] > 3) s.gen = true; } }
  const used = new Map(), useCnt = k => used.get(k)||0;
  const pickFrom = (arr, h) => arr[((h % arr.length) + arr.length) % arr.length];
  const hp6 = s => Math.abs(hash6(s));
  const DEBUFF_EL = {fire:['burn','defBreak'], water:['slow','atkBreak'], wind:['atkBreak','slow'], light:['mark','silence'], dark:['healBlock','curse']};
  const BUFFS_BY_ROLE = {Attaque:['atkUp','critUp','spdUp'], 'Contrôle':['spdUp','immunity','critUp'], Soutien:['spdUp','atkUp','defUp','immunity'], Soin:['regen','defUp','immunity'], 'Défense':['defUp','counterUp','reflectUp','endure']};
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((ps, idx)=>{ if (!ps.passive || !ps.gen || ps.passive.k==='critOverflow') return;
      const role = ROLES[M.role]?.n || M.role, g = kitSignals(M), q = {3:0.75, 4:0.88, 5:1}[M.stars] || 1, own = new Set(M.skills.filter(s=>s.passive && s!==ps).map(s=>JSON.stringify([s.passive.k, s.passive.on, s.passive.fx, s.passive.when])));
      const cands = [];
      // déclencheur → effet
      for (const on of Object.keys(TRIG)) for (const fx of Object.keys(PFX)){
        let s = 0;
        const off = role==='Attaque', sup = role==='Soutien'||role==='Soin', tank = role==='Défense';
        if (['strikeAll','strikeOne','stackAtk'].includes(fx)) s += off?2:role==='Contrôle'?0.8:-1;
        if (['healSelf','shieldSelf','stackDef'].includes(fx)) s += tank?2:0.3;
        if (['healAllies','shieldLow','cleanseAllies','buffAllies','atbAllies'].includes(fx)) s += sup?2.2:tank?0.8:-0.5;
        if (['debuffSrc'].includes(fx)) s += tank?1.8:0.2;
        if (['debuffRnd','drainAtb','stripRnd'].includes(fx)) s += role==='Contrôle'?2:0.4;
        if (['atbSelf','cdSelf','stackSpd','buffSelf'].includes(fx)) s += off||role==='Contrôle'?1.2:0.5;
        if (on==='hit' || on==='hitCrit') s += tank?1.5:-0.3;
        if (on==='kill') s += off?1.6:-1.5;
        if (on==='crit') s += (g.hits||0)+(g.crit||0)*0.8 + (off?0.6:-0.5);
        if (on==='allyCrit') s += sup?0.9:-0.3;
        if (on==='cdUse') s += (g.cd||0)*0.8;
        if (on==='resist') s += tank||role==='Soin'?0.6:0;
        if (on==='lowHp') s += tank?1:0.2;
        if (on==='allyDeath') s += (g.vengeance||0)+(g.berserk||0)*0.6;
        if (on==='foeDeath') s += (g.drain||0)*0.8 + (g.kill||0)*0.5;
        if (on==='turnStart' || on==='every3') s += sup?0.7:0.3;
        if (fx==='debuffSrc' && !(on==='hit'||on==='hitCrit')) continue;
        if ((fx==='healSelf'||fx==='shieldSelf') && on==='kill' && tank) s += 0.5;
        if (fx==='cleanseSelf' && on!=='turnStart' && on!=='lowHp' && on!=='every3') s -= 1;
        if (['turnStart'].includes(on) && ['strikeAll','healAllies','atbAllies','buffAllies','stackAtk','stackDef','stackSpd','drainAtb'].includes(fx)) s -= 0.6; // trop fort à chaque tour
        cands.push({p:{k:'proc', on, fx}, s});
      }
      // dégâts conditionnels
      if (role==='Attaque' || role==='Contrôle') for (const w of Object.keys(COND)){ let s = role==='Attaque' ? 2.5 : 1.5;
        if (w==='slower') s += (g.spd||0)*0.8; if (w==='stunned') s += (g.ctrl||0)*0.7; if (w==='perDead') s += (g.vengeance||0)*0.7; if (w==='shielded') s -= 0.4;
        if (w==='highDef') s += (g.def||0)*0.4; if (w==='buffed') s += (g.atbS||0)*0.3;
        cands.push({p:{k:'cond', when:w}, s}); }
      // protections conditionnelles
      if (role!=='Attaque') for (const w of Object.keys(WARD)){ let s = role==='Défense' ? 2.6 : 1.2; if (w==='debuffedSrc') s += (g.debuffs||0)*0.3; cands.push({p:{k:'ward', when:w}, s}); }
      // passifs spéciaux de la bibliothèque
      for (const [k,L] of Object.entries(PAS_LIB)){ if (k==='exploit' || (PAS_FORBID[role]||[]).includes(k)) continue;
        let s = 0; for (const [sig,w] of Object.entries(L.fit)) s += (g[sig]||0)*w; cands.push({p:{k}, s:s*0.95+0.6}); }
      // choix : adéquation au kit, rareté de l'usage, petite part de hasard stable
      let best = null; const h = hp6(M.id+'#'+idx);
      for (const c of cands){ const key = JSON.stringify([c.p.k, c.p.on, c.p.fx, c.p.when]); if (own.has(key)) continue;
        const sc = c.s - useCnt(key)*1.6 - (c.p.k!=='proc'&&c.p.k!=='cond'&&c.p.k!=='ward' ? useCnt('lib:'+c.p.k)*0.35 : 0) + ((hp6(M.id+key)%1000)/1000)*1.4;
        if (!best || sc>best.sc) best = {...c, sc, key}; }
      used.set(best.key, useCnt(best.key)+1); if (!['proc','cond','ward'].includes(best.p.k)) used.set('lib:'+best.p.k, useCnt('lib:'+best.p.k)+1);
      // valeurs propres au monstre
      const rr = (r, salt) => { const [a,b] = r; return a===b ? a : Math.round((a + (hp6(M.id+salt)%1000)/1000*(b-a))*q); };
      let p = {...best.p}, name;
      if (p.k==='proc'){ const F = PFX[p.fx];
        if (['atbSelf','atbAllies','healSelf','healAllies','shieldSelf','shieldLow','strikeAll','strikeOne','drainAtb','stackAtk','stackDef','stackSpd'].includes(p.fx)) p.v = rr(F.r,'v');
        if (p.fx==='debuffSrc' || p.fx==='debuffRnd'){ p.c = rr(F.r,'c'); p.s = pickFrom(DEBUFF_EL[M.el], h); }
        if (p.fx==='buffSelf' || p.fx==='buffAllies'){ const bl = BUFFS_BY_ROLE[role]||BUFFS_BY_ROLE.Attaque; p.s = pickFrom(bl, h>>3); p.d = p.s==='immunity'||p.s==='endure' ? 1 : 2; }
        if (['turnStart','hit','crit','allyCrit'].includes(p.on) && !['debuffSrc','debuffRnd'].includes(p.fx)) p.cap = p.on==='turnStart' ? 0 : 2;
        if (p.on==='turnStart' && ['strikeAll','healAllies','atbAllies'].includes(p.fx)) p.v = Math.max(1, Math.round(p.v*0.5));
        const nouns = [...TRIG[p.on].n, ...F.n];
        name = `${pickFrom(nouns, h>>5)} ${pickFrom(EL_SUF[M.el], h>>7)}`;
        if (M.skills.some(s=>s.passive && s.n===name)) name = `${pickFrom(nouns, (h>>5)+1)} ${pickFrom(EL_SUF[M.el], (h>>7)+1)}`;
      } else if (p.k==='cond'){ p.v = rr(COND[p.when].r,'v'); name = `${pickFrom(COND_N, h>>4)} ${pickFrom(EL_SUF[M.el], h>>7)}`; }
      else if (p.k==='ward'){ p.v = rr(WARD[p.when].r,'v'); name = `${pickFrom(WARD_N, h>>4)} ${pickFrom(EL_SUF[M.el], h>>7)}`; }
      else { const L = PAS_LIB[p.k]; p = {k:p.k, ...L.mk(q, M.el)};
        for (const f of ['v','c']) if (typeof p[f]==='number' && p[f]>2){ const j = 0.8 + (hp6(M.id+f)%1000)/1000*0.45; p[f] = Math.round(p[f]*j); }
        name = L.names[M.el] || L.names.dark; }
      const sk = P(name, p); sk.ups = []; sk.gen = true; sk.d = describe(sk); M.skills[idx] = sk;
    });
  }
}


/* ================= SIGNATURES DE COMPÉTENCES =================
   1) Multiplicateurs : chaque compétence offensive reçoit une valeur propre (±12 %, arrondie à 0,05).
   2) Chaque monstre reçoit une « signature » : un effet unique ajouté à l'une de ses compétences,
      choisi selon son rôle, son élément et son kit, en évitant les répétitions dans le jeu. */

SIG.dmgMul = (s, a, d) => { const g = s.sig; if (!g) return 1;
  if (g.k==='bloodPrice') return 1 + g.v/100;
  if (g.k==='sunder' && d.st.shield) return 1 + g.v/100;
  if (g.k==='momentumHit' && B) return 1 + g.v/100 * B.side(d).filter(x=>x.dead).length;
  return 1; };
Battle.prototype.sigRider = async function(u, sk, targets, total, hit, anyCrit){
  const g = sk.sig; if (!g || u.dead) return; const foes = this.foes(u), fr = this.friends(u), tg = targets.find(x=>x.side!==u.side);
  switch (g.k){

  // pp = puissance de ton équipe ramenée à 3 monstres (taille d'une vague)
  if (!pp) return W;
  const eff = e => { const st = {...e.stats}; st.hp *= e.hpK; st.def *= e.defK; st.atk *= e.atkK; return st; };
  let kBoss = 1;
  for (const wave of W){ const runed = wave.filter(e=>e.runed); if (!runed.length) continue;

  try { const hit = Math.max(...S.team.map(mon).filter(Boolean).map(m=>{ const st = monStats(m).s; return st.atk * (1 + st.cd/100) * 4.5; }));

}

const BUFF_COL = {atkUp:'#ff6a5a', defUp:'#5aa8ff', spdUp:'#6affa0', critUp:'#ffd24a', immunity:'#ffffff', regen:'#7aff9a', invincible:'#fff2a8', shield:'#9ad8ff'};
async function supportAnim(u, ts, sk, C){
  const fx = sk.fx||[];
  const [cx,cy]=feet(u); FX.sigil(cx,cy,70,C.a,.7); FX.p({x:cen(u)[0],y:cen(u)[1],life:.4,size:20,size2:70,color:C.a});
  await wt(180);
  const has = k => fx.some(f=>f.k===k);
  if (has('revive')) for (const t of B.side(u)){ if (!t.dead && !ts.includes(t)) continue; const [x]=cen(t), [,fy]=feet(t);
    FX.column(x,fy,80,fy+40,'#fff6c8',.8); FX.burst(x,fy-80,{n:14,speed:160,color:'#fff',shape:'feather',size:6,life:1,grav:80,vr:3,add:false}); }
  for (const t of ts){ const [x,y]=cen(t), [fx2,fy]=feet(t);
    if (has('heal')){ for (let i=0;i<10;i++){ const a=i/10*6.28; FX.p({x:x+Math.cos(a)*45,y:fy-10,vx:-Math.cos(a)*20,vy:-140-Math.random()*80,life:.9,size:18,shape:'glyph',glyph:'✚',color:'#7dff9a',add:false}); }
      FX.add({life:.8, draw(c,p,tt){ c.globalCompositeOperation='lighter'; c.globalAlpha=1-p; for (let i=0;i<3;i++){ c.strokeStyle='#7dff9a'; c.lineWidth=3; c.beginPath(); c.ellipse(x,fy-p*160-i*30,50-i*8,12,0,tt*8+i,tt*8+i+3.5); c.stroke(); } }}); }
    if (fx.some(f=>f.s==='shield')) FX.dome(x,y,85,'#9ad8ff',1);
    const bf = fx.filter(f=>f.k==='buff' && f.s!=='shield');
    if (bf.length){ FX.sigil(fx2,fy,60,BUFF_COL[bf[0].s]||C.a,.8);
      bf.forEach((f,j)=>{ for (let i=0;i<5;i++) FX.p({x:x+(Math.random()-.5)*70,y:fy-20,vy:-200-Math.random()*90,life:.8,size:20,shape:'glyph',glyph:'▲',color:BUFF_COL[f.s]||C.a,add:false}); }); }
    if (fx.some(f=>f.k==='atb' && f.v>0)) for (let i=0;i<6;i++) FX.streak(x-90,y-40+i*16,x+90,y-40+i*16,'#bff',.3,2.5);
    if (has('cleanse')) FX.burst(x,y,{n:14,speed:150,color:'#fff',shape:'glyph',glyph:'✧',size:14,life:.7,grav:-150,add:false});
  }
  await wt(250);
}
async function playAnim(u, sk, targets, A){
  const C = FXCOL[u.el]||FXCOL.fire; u._skn = sk.n.toLowerCase();
  const fn = ANIMS[A.kind]||ANIMS.fireball, MELEE = ['claw','bite','slash','charge','punch'];
  const go = !isOff(sk) ? supportAnim(u, targets, sk, C)
    : (MELEE.includes(A.kind) && targets.length>1) ? Promise.all(targets.map((t,i)=>wait(i*70).then(()=>fn(u,[t],C)))) : fn(u, targets, C);
  try { await Promise.race([go, wait(2600)]); } catch(e){}
}
