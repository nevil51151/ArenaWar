(function(){
  const touch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  if (!touch) return;
  document.body.classList.add('touch');
  document.body.insertAdjacentHTML('beforeend', `<div id="rotateMsg"><div class="ph">📱</div><div>${GAME_LANG==='ru'?'Поверни телефон горизонтально':GAME_LANG==='en'?'Turn your phone sideways':"Turn your phone sideways"}</div></div>
    <button id="fsBtn" title="Fullscreen">⛶</button>`);
  const goFs = () => { const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!rq || document.fullscreenElement || document.webkitFullscreenElement) return;
    try { const p = rq.call(el, {navigationUI:'hide'}); p?.then?.(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{}); } catch(e){} };
  let asked = false;
  addEventListener('pointerdown', () => { if (!asked){ asked = true; goFs(); } }, {passive:true});
  document.getElementById('fsBtn').addEventListener('click', e => { e.stopPropagation(); goFs(); });
  const fsCh = () => { document.body.classList.toggle('fs', !!(document.fullscreenElement || document.webkitFullscreenElement)); setTimeout(fit, 120); };
  document.addEventListener('fullscreenchange', fsCh); document.addEventListener('webkitfullscreenchange', fsCh);
  visualViewport?.addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
  document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
  // appui long sur un élément avec info-bulle (title) : affiche le texte
  let lp = null, tip = null;
  const hide = () => { clearTimeout(lp); lp = null; tip?.remove(); tip = null; };
  addEventListener('touchstart', e => { hide(); const el = e.target.closest?.('[title]'); if (!el || !el.title) return; const t = e.touches[0];
    lp = setTimeout(() => { tip = document.createElement('div'); tip.id = 'tipBubble'; tip.textContent = el.title; document.body.appendChild(tip);
      const r = tip.getBoundingClientRect(); tip.style.left = Math.max(6, Math.min(innerWidth - r.width - 6, t.clientX - r.width/2)) + 'px'; tip.style.top = Math.max(6, t.clientY - r.height - 18) + 'px'; }, 450); }, {passive:true});
  addEventListener('touchend', () => { clearTimeout(lp); setTimeout(()=>{ tip?.remove(); tip = null; }, 1600); }, {passive:true});
  addEventListener('touchmove', hide, {passive:true});
})();

    $('#scr').querySelectorAll('*').forEach(e=>{ const k = e.className; cnt[k] = (cnt[k]||0)+1; if (e.scrollTop||e.scrollLeft) keep.push([k, cnt[k], e.scrollTop, e.scrollLeft]); }); }

  if (keep.length){ const cnt = {}, els = {};

    for (const [k,i,t,l] of keep){ const e = els[k+'#'+i]; if (e){ e.scrollTop = t; e.scrollLeft = l; } } }

  positions(list, side){

function summonOne(type, feat=null){
  const c = SCROLLS[type]; let r = Math.random()*100, st = c.stars[c.stars.length-1][0];
  for (const [s,p] of c.stars){ if (r<p){ st=s; break; } r-=p; }
  let els = c.els;
  if (c.elW){ let x = Math.random()*100; for (const [el,w] of Object.entries(c.elW)){ if (x<w){ els=[el]; break; } x-=w; } if (els.length>1) els=[els[0]]; }
  if (c.pity){ const e = evState(); e.pity = (e.pity||0) + 1; if (st!==5 && e.pity>=c.pity) st = 5; if (st===5) e.pity = 0; }
  let pool = c.pool ? Object.values(TPL).filter(m=>m.event===c.pool && m.stars===st) : MONSTERS.filter(m=>m.stars===st && els.includes(m.el) && !m.dungeonBoss);
  if (!pool.length) pool = MONSTERS.filter(m=>m.stars===st && !m.dungeonBoss);
  // invocation ciblée : 50 % de chance d'obtenir le monstre vedette s'il correspond à la rareté tirée et au parchemin
  const fm = feat ? [feat.f4, feat.f5].filter(x=>x.stars===st).flatMap(famOf).filter(x=>els.includes(x.el)) : [];
  const t = fm.length && Math.random()<0.5 ? pick(fm) : pick(pool), m = newMonster(t.id), shiny = Math.random() < SHINY_RATE;
  if (shiny) m.shiny = true;

  S.box.push(m);

    <div class="zhint mut">Wheel or pinch to zoom · drag to move · double-click to enlarge / reset · Esc to close</div></div>`);
  ZV.reset();
  const st = $('#zoomv .zstage'), scale = () => $('#stage').getBoundingClientRect().width/1280;
  const local = e => { const r = st.getBoundingClientRect(), k = scale(); return [(e.clientX - r.left - r.width/2)/k, (e.clientY - r.top - r.height/2)/k]; };
  st.addEventListener('wheel', e=>{ e.preventDefault(); const [cx,cy] = local(e); ZV.set(ZV.s*(e.deltaY<0?1.15:1/1.15), cx, cy); }, {passive:false});

    if (pts.size===2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a[0]-b[0],a[1]-b[1]), s:ZV.s}; } });

    const k = scale(); ZV.x += (e.clientX-last[0])/k; ZV.y += (e.clientY-last[1])/k; last = [e.clientX,e.clientY]; ZV.apply(); });

function dgLocked(id){ const zi = DG_REQ[id]; if (zi===undefined) return null; const z = ZONES[zi];
  if (S.cleared?.[z.to] || (S.dclear?.[id]||0) > 0) return null;
  const done = Array.from({length:z.to-z.from+1},(_,i)=>z.from+i).filter(x=>S.cleared?.[x]).length;
  return {ch:zi+1, z, done, pct:done/(z.to-z.from+1)*100}; }

function bestSpot(kind, a){
  S.dclear ??= {}; const open = id => dgLocked(id) ? 0 : Math.min((S.dclear[id]||0)+1, DUNGEONS[id].floors);
  const pickFloor = (id, score) => { const D = DUNGEONS[id]; let best = null;
    for (let f=1; f<=D.floors; f++){ const s = score(f); if (s<=0) continue; const ok = f<=open(id), v = ok ? s*100+f : -f;   // étages accessibles d'abord, sinon le plus bas
      if (!best || v>best.v) best = {id, f, v, ok, s}; }
    return best; };
  if (kind==='ess'){ let best = null;
    for (const [id,D] of Object.entries(DUNGEONS)) if (D.rot && !D.hidden){
      const b = pickFloor(id, f=>TPL[dungeonBoss(id,f)].el===a.el ? essDrop(f,a.tier) : 0); if (b && (!best || b.v>best.v)) best = b; }
    return best && {dg:{id:best.id, floor:best.f}, why:`${DUNGEONS[best.id].icon} ${DUNGEONS[best.id].n} lvl ${best.f}: boss ${ELEM[a.el].n}, ~${best.s} ${ESS_TIERS[a.tier].n.toLowerCase()}${best.ok?'':" (floor not unlocked yet: finish the previous ones)"}`}; }
  if (kind==='mana'){ const f = open('tresor'); return {dg:{id:'tresor', floor:f}, why:`💰 Treasure Cave lvl ${f}: lots of mana`}; }
  if (kind==='xp'){ const f = open('echos'); return {dg:{id:'echos', floor:f}, why:`👼 Sanctuary of Echoes lvl ${f}: XP ×3`}; }
  if (kind==='forge'){ const f = open('forge'); return {dg:{id:'forge', floor:f}, why:`🔨 Rune Forge lvl ${f}: reroll stones and gems`}; }
  if (kind==='dim' && AWK2[a.tpl]?.star5) return {dg:{id:'inst', floor:INST_A2_FLOOR}, why:`🐙 Great Ancient Instance, floor ${INST_A2_FLOOR}: 5★ awakening gauge${(S.dclear?.inst||0)<INST_A2_FLOOR-1?" (finish the previous floors first)":''}`};
  if (kind==='dim') return {dim:a.tpl, why:`🌀 ${TPL[a.tpl].name}'s Awakening Dimension`};
  if (kind==='frag') return {screen:'feature', why:`🗝️ ${TPL[a.tpl].fam}'s secret raid`};
  return null;
}

/* ---------- Récompenses de présence ----------
   Toutes les 15 minutes passées dans le jeu (même onglet en arrière-plan), un coffre se débloque.
   Aucun plafond quotidien : les coffres s'accumulent tant que le jeu est ouvert. Le contenu suit un cycle,
   avec de gros coffres réguliers (☯️ tous les 8, 🌟 tous les 16, 💎 gemme tous les 24, 🌈 tous les 48). */
const PRES_MS = 15*60*1000;
const presState = () => (S.pres ??= {acc:0, avail:0, total:0, last:Date.now()});
function presReward(k){ // k = numéro du coffre (1, 2, 3…)
  const g = {}, add = (key,v)=>g[key]=(g[key]||0)+v;
  [()=>add('mana',4000), ()=>add('crystals',15), ()=>add('scrolls',1), ()=>{ add('mana',6000); add('rune',1); }, ()=>add('crystals',20), ()=>add('reroll',1)][(k-1)%6]();
  if (k%4===0) add('crystals',30);
  if (k%8===0) add('ldScrolls',1);
  if (k%16===0) add('legScrolls',1);
  if (k%24===0) add('gem',1);
  if (k%48===0) add('allScrolls',1);
  return g;
}
const PRES_ICON = {mana:'🔷', crystals:'💎', scrolls:'📜', ldScrolls:'☯️', legScrolls:'🌟', allScrolls:'🌈', rune:'⬡ rune', reroll:'🔮', gem:'💠'};
const presTxt = g => Object.entries(g).map(([k,v])=>`${PRES_ICON[k]} ${k==='rune'?'×'+v:fmt(v)}`).join(' · ');
function presBtn(){ const P = presState(), left = Math.max(0, PRES_MS - P.acc), mm = Math.floor(left/60000), ss = Math.floor(left/1000)%60;
  return `<button class="presb ${P.avail?'ready':''}" id="presBtn" data-act="presence" title="Presence chest: one chest every 15 minutes of play">🎁 <span>${P.avail?`${P.avail} ready`:`${mm}:${String(ss).padStart(2,'0')}`}</span></button>`; }
function presTick(){
  if (!S) return; const P = presState(), now = Date.now(), d = now - (P.last||now); P.last = now;
  if (d > 0 && d < 120000) P.acc += d;             // le temps hors jeu (page fermée, ordinateur en veille) ne compte pas
  let got = 0; while (P.acc >= PRES_MS){ P.acc -= PRES_MS; P.avail++; got++; }
  if (got){ save(); toast(`🎁 Presence chest available!`); }
  const b = document.getElementById('presBtn'); if (b){ const left = Math.max(0, PRES_MS - P.acc);
    b.classList.toggle('ready', P.avail>0);
    b.querySelector('span').textContent = P.avail ? `${P.avail} ready` : `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`; }
}
setInterval(presTick, 1000);

/* ================= MUSIQUE ORIGINALE (synthétisée en direct, Web Audio) =================
   Aucun fichier audio : chaque morceau est composé ici (accords, basse, arpèges, mélodie, percussions)
   et joué en boucle par un petit séquenceur. Démarre au premier clic (règle des navigateurs). */
const MUS = (()=>{
  let ctx = null, master = null, comp = null, verb = null, cur = null, want = 'menu', timer = null, unlocked = false;
  const vol = () => (S?.prefs?.music ?? 0.55);
  const on = () => !(S?.prefs?.mute);
  const hz = m => 440*Math.pow(2,(m-69)/12);
  // ---- graines : la mélodie d'un morceau est la même à chaque écoute
  const rng = seed => () => { seed = (seed*16807) % 2147483647; return seed/2147483647; };

  function init(){
    if (ctx) return true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return false; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    master = ctx.createGain(); master.gain.value = on() ? vol() : 0;
    // petite réverbération générée
    verb = ctx.createConvolver(); const len = ctx.sampleRate*2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c=0;c<2;c++){ const d = ir.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
    verb.buffer = ir; const vg = ctx.createGain(); vg.gain.value = 0.28; verb.connect(vg); vg.connect(comp);
    comp.connect(master); master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const nd = noiseBuf.getChannelData(0); for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    return true;
  }
  let noiseBuf = null;

  // ---- instruments
  function tone(out, t, m, dur, o){
    const g = ctx.createGain(), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.cut || 3000; f.Q.value = o.q || 0.7;
    const a = o.a ?? 0.005, r = o.r ?? 0.12, v = o.v ?? 0.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t+a); g.gain.setValueAtTime(v, t+Math.max(a, dur-r*0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+r);
    (o.det || [0]).forEach(d=>{ const os = ctx.createOscillator(); os.type = o.w || 'triangle'; os.frequency.value = hz(m); os.detune.value = d;
      if (o.vib){ const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.2; lg.gain.value = o.vib; l.connect(lg); lg.connect(os.detune); l.start(t); l.stop(t+dur+r+0.05); }
      if (o.glide){ os.frequency.setValueAtTime(hz(m+o.glide), t); os.frequency.exponentialRampToValueAtTime(hz(m), t+0.06); }
      os.connect(f); os.start(t); os.stop(t+dur+r+0.05); });
    if (o.fenv){ f.frequency.setValueAtTime(o.fenv, t); f.frequency.exponentialRampToValueAtTime(o.cut||800, t+Math.min(dur,0.3)); }
    f.connect(g); g.connect(out); if (o.wet) { const w = ctx.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(verb); }
  }
  function kick(out, t, v=0.9){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type='sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t+0.12);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.35); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.4); }
  function noise(out, t, dur, type, freq, v, q=0.8, wet=0){ const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur); s.connect(f); f.connect(g); g.connect(out);
    if (wet){ const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); } s.start(t); s.stop(t+dur+0.02); }
  const snare = (out,t,v=0.35) => { noise(out,t,0.18,'bandpass',1900,v,0.7,0.25); tone(out,t,50,0.05,{w:'triangle',v:v*0.5,r:0.06}); };
  const hat = (out,t,v=0.08,open) => noise(out,t,open?0.22:0.05,'highpass',8000,v);
  const tom = (out,t,m,v=0.5) => tone(out,t,m,0.12,{w:'sine',v,r:0.2,glide:7});

  // ---- théorie : accords et gammes
  const CH = {m:[0,3,7], M:[0,4,7], m7:[0,3,7,10], M7:[0,4,7,11], s4:[0,5,7], dim:[0,3,6], '7':[0,4,7,10]};
  const SC = {minor:[0,2,3,5,7,8,10], harm:[0,2,3,5,7,8,11], dor:[0,2,3,5,7,9,10], major:[0,2,4,5,7,9,11], phryg:[0,1,3,5,7,8,10]};
  const NOTE = n => ({C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11})[n];
  const chordOf = s => { const m = s.match(/^([A-G][b#]?)(.*)$/); return {root:NOTE(m[1]), q:m[2]||'M'}; };

  /* ---- les morceaux ----
     prog : accords (1 par mesure) · key/scale : tonalité de la mélodie · rhythm : placement des notes de mélodie sur 16 pas
     bass / arp / drums : motifs sur 16 pas · parts : quels instruments jouent */
  const TRACKS = {
    menu:   {bpm:78,  key:2,  scale:'minor', prog:['Dm','Bb','F','C','Dm','Gm','Bb','A'], seed:11,
             rhythm:'x.....x...x.....', bass:'x.......x.......', arp:'x.x.x.x.x.x.x.x.', drums:null, lead:{w:'triangle',v:0.13,vib:9,wet:0.5,oct:5}, pad:true},
    story:  {bpm:96,  key:9,  scale:'dor',   prog:['Am','F','C','G','Am','F','G','E'], seed:23,
             rhythm:'x..x..x.x...x...', bass:'x...x.x.x...x.x.', arp:'x.xxx.xxx.xxx.xx', drums:'k.h.s.h.k.hks.h.', lead:{w:'square',v:0.07,vib:6,wet:0.3,oct:5,cut:2200}, pad:true},
    dungeon:{bpm:104, key:5,  scale:'phryg', prog:['Fm','Gb','Fm','Eb','Db','Gb','C','C'], seed:37,
             rhythm:'x...x..x..x.x...', bass:'x..x..x...x..x..', arp:'x..x..x..x..x.x.', drums:'k..hs..hk.kh s..', lead:{w:'sawtooth',v:0.06,vib:8,wet:0.45,oct:5,cut:1600}, pad:true},
    combat: {bpm:138, key:4,  scale:'minor', prog:['Em','C','D','B','Em','C','Am','B'], seed:41,
             rhythm:'x.x.x..x.xx.x.x.', bass:'xxxxxxxxxxxxxxxx', arp:'x.x.x.x.x.x.x.x.', drums:'k.h.s.hkk.h.s.hh', lead:{w:'square',v:0.075,vib:5,wet:0.25,oct:5,cut:2600}, pad:false, power:true},
    arena:  {bpm:128, key:7,  scale:'harm',  prog:['Gm','Eb','F','D','Gm','Eb','Cm','D'], seed:53,
             rhythm:'x..x..x.x.x.x...', bass:'x.xx.xx.x.xx.xx.', arp:'x.x.x.x.x.x.x.x.', drums:'k.h.s.h.k.k.s.hh', lead:{w:'sawtooth',v:0.06,vib:6,wet:0.3,oct:5,cut:2400}, pad:true, power:true},
    boss:   {bpm:152, key:0,  scale:'harm',  prog:['Cm','Ab','Bb','G','Cm','Db','G','G'], seed:67,
             rhythm:'x.xx.x.xx.x.xxx.', bass:'xxxxxxxxxxxxxxxx', arp:'xxxxxxxxxxxxxxxx', drums:'kkh.skh.kkhksh.h', lead:{w:'sawtooth',v:0.07,vib:4,wet:0.25,oct:5,cut:3000}, pad:true, power:true, choir:true},
    // 🎃 Halloween : boîte à musique désaccordée sur ré mineur harmonique, bourdon en triton, battements de cœur, glas et murmures
    horror: {bpm:64,  key:2,  scale:'harm',  prog:['Dm','Bb','Gm','A','Dm','Eb','Dm','A'], seed:131,
             rhythm:'x...x.x...x.....', bass:'x...............', arp:'x..x..x..x..x...', drums:null, lead:{w:'sine',v:0.11,vib:16,wet:0.8,oct:6,det:[-13,11]}, pad:true, horror:true, heart:true},
    // 🪦 combats de la Crypte : phrygien sur do#, pulsation lourde, chœur et cloches
    horrorBattle:{bpm:118, key:1, scale:'phryg', prog:['C#m','D','C#m','G','C#m','D','A','G#'], seed:149,
             rhythm:'x.x..x.xx..x.x..', bass:'x.xx.xx.x.xx.x.x', arp:'x.x.x.x.x.x.x.x.', drums:'k..hs.hkk.h.s.hh', lead:{w:'sawtooth',v:0.06,vib:10,wet:0.45,oct:5,cut:1700}, pad:true, power:true, choir:true, horror:true},
  };
  const JINGLES = {
    victory:{bpm:132, notes:[[0,60,1],[1,64,1],[2,67,1],[3,72,3],[6,71,1],[7,72,1],[8,74,1],[9,76,6]], chords:[[0,'C',4],[4,'G',2],[6,'C',8]]},
    defeat: {bpm:80,  notes:[[0,69,2],[2,65,2],[4,64,2],[6,62,6]], chords:[[0,'Dm',4],[4,'Bb',2],[6,'A',8]]},
    summon: {bpm:150, notes:[[0,72,1],[1,76,1],[2,79,1],[3,84,1],[4,88,4]], chords:[[0,'C',8]]},
  };

  // mélodie déterminée par la graine : notes d'accord sur les temps forts, conduite par degrés conjoints
  function compose(T){
    const r = rng(T.seed*997+3), sc = SC[T.scale], out = [];
    let deg = 7;
    T.prog.forEach((c, bar)=>{ const ch = chordOf(c), tones = CH[ch.q] || CH.M;
      const bars = []; for (let s=0;s<16;s++){
        if (T.rhythm[s]!=='x' || (bar%4===3 && s>8)) { bars.push(null); continue; }
        const strong = s%4===0;
        if (strong){ // note de l'accord la plus proche
          const target = tones.map(t=>(ch.root+t-T.key+120)%12); let best = deg, bd = 99;
          for (let d=deg-4; d<=deg+4; d++){ const pc = (sc[((d%7)+7)%7])%12; if (target.includes(pc) && Math.abs(d-deg)<bd){ bd = Math.abs(d-deg); best = d; } }
          deg = best;
        } else deg += r()<0.5 ? (r()<0.5?1:-1) : (r()<0.5?2:-2);
        deg = Math.max(2, Math.min(12, deg));
        const o = Math.floor(deg/7), m = 12*T.lead.oct + T.key + sc[((deg%7)+7)%7] + 12*o;
        let len = 1; while (s+len<16 && T.rhythm[s+len]!=='x' && len<4) len++;
        bars.push({m, len});
      }
      out.push(bars); });
    return out;
  }
  Object.values(TRACKS).forEach(T=>T.mel = compose(T));

  // ---- séquenceur
  function playStep(P, t){
    const T = P.T, step = P.step%16, bar = Math.floor(P.step/16) % T.prog.length, sd = 60/T.bpm/4, out = P.out;
    const ch = chordOf(T.prog[bar]), tones = CH[ch.q] || CH.M, root = 36 + ch.root;
    if (step===0 && T.pad){ tones.forEach((iv,i)=>tone(out, t, root+24+iv, sd*16, {w:'sawtooth', det:[-8,8], v:0.028, a:0.35, r:0.6, cut:T.power?1400:900, wet:0.6}));
      if (T.choir) tone(out, t, root+36, sd*16, {w:'triangle', det:[-5,5], v:0.03, a:0.5, r:0.8, cut:1800, vib:12, wet:0.7}); }
    if (T.bass[step]==='x'){ const m = (T.power && step%8===6) ? root+7 : root; tone(out, t, m, sd*(T.power?0.9:1.8), {w:T.power?'sawtooth':'triangle', v:T.power?0.14:0.18, r:0.05, cut:T.power?700:500, fenv:T.power?1800:0}); }
    if (T.arp && T.arp[step]==='x'){ const seq = [0,1,2,1,0,2,1,2], iv = tones[seq[(step/ (T.bpm>120?1:2) |0)%seq.length] % tones.length] ?? 0;
      tone(out, t, root+24+iv+(step>=8&&!T.power?12:0), sd*0.9, {w:'triangle', v:T.power?0.045:0.06, r:0.18, cut:3200, wet:0.35}); }
    const nt = T.mel[bar][step]; if (nt) tone(out, t, nt.m, sd*nt.len*0.92, {...T.lead, r:0.15});
    if (T.horror){
      if (step===0){ // bourdon grave + triton qui frotte, avec un léger trémolo
        tone(out, t, root+12, sd*16, {w:'sine', v:0.05, a:1.2, r:1.2, cut:600, vib:5, wet:0.5});
        tone(out, t, root+18, sd*16, {w:'triangle', det:[-18,18], v:0.016, a:2, r:1.5, cut:900, vib:22, wet:0.8}); }
      if (step===0 && bar%2===0){ // glas : cloche inharmonique
        const bm = root+48; tone(out, t, bm, sd*12, {w:'sine', v:0.05, a:0.002, r:2.2, cut:5000, wet:0.9});
        tone(out, t, bm+15, sd*8, {w:'sine', det:[37], v:0.018, a:0.002, r:1.6, cut:5000, wet:0.9}); }
      if (step===8 && bar%4===1) noise(out, t, 2.4, 'bandpass', 900 + (bar*137)%700, 0.05, 6, 0.9);   // murmure
      if (step===12 && bar%8===5) tone(out, t, root+31, sd*6, {w:'sine', v:0.035, a:0.6, r:1, cut:3000, glide:-1, vib:30, wet:0.9});   // plainte
      if (T.heart && (step===0 || step===3)) kick(out, t, step===0 ? 0.42 : 0.3);   // battement de cœur
    }
    if (T.drums){ const d = T.drums[step];
      if (d==='k') kick(out, t, T.power?0.85:0.6); else if (d==='s') snare(out, t, T.power?0.32:0.22); else if (d==='h') hat(out, t, 0.06);
      if (T.power && step===15 && bar%4===3){ tom(out, t, 50); tom(out, t+sd/2, 45); }
      if (bar%8===7 && step===0) noise(out, t, 1.2, 'highpass', 5000, 0.12, 0.5, 0.4);   // cymbale de fin de phrase
    }
  }
  function tick(){
    if (!cur || !ctx) return;
    const sd = 60/cur.T.bpm/4;
    while (cur.next < ctx.currentTime + 0.12){ playStep(cur, cur.next); cur.next += sd; cur.step++; }
  }
  function start(name){
    if (!ctx || !TRACKS[name]) return;
    if (cur && cur.name===name) return;
    const old = cur;
    if (old){ old.out.gain.cancelScheduledValues(ctx.currentTime); old.out.gain.setTargetAtTime(0, ctx.currentTime, 0.25); setTimeout(()=>old.out.disconnect(), 1500); }
    const out = ctx.createGain(); out.gain.value = 0; out.connect(comp); out.gain.setTargetAtTime(1, ctx.currentTime+0.05, 0.4);
    cur = {name, T:TRACKS[name], out, step:0, next:ctx.currentTime+0.1};
    if (!timer) timer = setInterval(tick, 25);
  }
  function jingle(name, then){
    if (!ctx || !on()) return;
    const J = JINGLES[name]; if (cur){ const o = cur; o.out.gain.setTargetAtTime(0, ctx.currentTime, 0.15); setTimeout(()=>o.out.disconnect(), 1200); cur = null; }
    const out = ctx.createGain(); out.gain.value = 1; out.connect(comp); const sd = 60/J.bpm/4, t0 = ctx.currentTime+0.05;
    J.chords.forEach(([s,c,l])=>{ const ch = chordOf(c); (CH[ch.q]||CH.M).forEach(iv=>tone(out, t0+s*sd*2, 48+ch.root+iv, sd*2*l, {w:'sawtooth', det:[-7,7], v:0.035, a:0.05, r:0.8, cut:1600, wet:0.6})); });
    J.notes.forEach(([s,m,l])=>tone(out, t0+s*sd*2, m, sd*2*l*0.95, {w:'square', v:0.09, r:0.3, cut:2800, vib:6, wet:0.4}));
    if (name==='victory'){ kick(out, t0, 0.8); noise(out, t0+9*sd*2, 1.5, 'highpass', 5000, 0.14, 0.5, 0.5); }
    want = then || want;
  }
  function unlock(){ if (unlocked) return; if (!init()) return; unlocked = true; ctx.resume?.(); if (on()) start(want); }
  return {
    play(name){ want = name; if (unlocked && on()) start(name); },
    jingle, unlock,
    setVol(v){ S.prefs.music = v; save(); if (master) master.gain.setTargetAtTime(on()?v:0, ctx.currentTime, 0.05); },
    toggle(){ S.prefs.mute = !S.prefs.mute; save(); if (!ctx) return; master.gain.setTargetAtTime(on()?vol():0, ctx.currentTime, 0.05); if (on()) { unlock(); start(want); } updBtn(); },
    get want(){ return want; }
  };
})();
// choix du morceau selon l'écran
function musicFor(scr){
  if (B) return null;
  if (scr==='arena') return 'arena';
  if (scr==='event' || (scr==='prep' && prepDungeon?.id==='crypte')) return 'horror';
  if (scr==='dungeons' || scr==='dims' || (scr==='prep' && prepDungeon)) return 'dungeon';
  if (scr==='map' || scr==='prep') return 'story';
  return 'menu';
}
{ const _go = go; go = function(s, arg){ _go(s, arg); const m = musicFor(s); if (m) MUS.play(m); }; }
{ const _sw = Battle.prototype.startWave; Battle.prototype.startWave = function(){ const r = _sw.apply(this, arguments);
    const boss = this.hl || this.dungeon?.id==='inst' || this.dungeon?.id==='raid' || this.enemies.some(e=>e.boss);
    MUS.play(this.dungeon?.id==='crypte' ? 'horrorBattle' : boss ? 'boss' : this.arena ? 'arena' : 'combat'); return r; }; }
// scènes de l'histoire d'Halloween
{ const _sp = storyPlay; storyPlay = function(k){ if (String(k).startsWith('hw')) MUS.play('horror'); return _sp.apply(this, arguments); }; }
{ const _fin = Battle.prototype.finish; Battle.prototype.finish = function(win){ const first = !this.over; const r = _fin.apply(this, arguments);
    if (first && !this.hl) MUS.jingle(win ? 'victory' : 'defeat', musicFor(screen) || 'menu'); return r; }; }
// bouton 🔊 toujours visible
function updBtn(){ const b = document.getElementById('musicBtn'); if (b) b.textContent = S?.prefs?.mute ? '🔇' : '🎵'; }
document.body.insertAdjacentHTML('beforeend', `<button id="musicBtn" title="Music (click: mute / unmute)">🎵</button>`);
document.getElementById('musicBtn').addEventListener('click', e=>{ e.stopPropagation(); MUS.toggle(); });
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev, ()=>MUS.unlock(), {once:false, passive:true}));
load(); fit(); render();
</script>
