<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena War</title>
<script>
var GAME_LANG = 'ru', LANG_FILES = {fr:'index.html', en:'index-en.html', ru:'index-ru.html'}, LANG_NAMES = {fr:'🇫🇷 Français', en:'🇬🇧 English', ru:'🇷🇺 Русский'};
(function(){ var w = 'en'; try { w = localStorage.getItem('aw_lang') || 'en'; } catch(e){} /* anglais par défaut */ if (w && w !== GAME_LANG && LANG_FILES[w]) location.replace(LANG_FILES[w] + location.search + location.hash); })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c14e;--gold2:#c9952a;--txt:#f1eefc;--mut:#a9abc8;--good:#4ade80;--bad:#f87171;--line:#c9a24a;
--fire:#ff6b3d;--water:#3da5ff;--wind:#f0c43c;--light:#fff1c2;--dark:#a46bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04050b;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:#0b0d1a;font-size:15px}
.screen{position:absolute;inset:0;animation:fadein .35s}
.screen.still{animation:none}
@keyframes fadein{from{opacity:0}}
.bg{position:absolute;inset:0;z-index:0}
.bg svg,.bg img{width:100%;height:100%;display:block;object-fit:cover}
.layer{position:absolute;inset:0;z-index:1}
.hidden{display:none!important}
h1,h2,h3,.cz{font-family:Cinzel,serif;margin:0;letter-spacing:.5px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
.el-fire{--ec:var(--fire)}.el-water{--ec:var(--water)}.el-wind{--ec:var(--wind)}.el-light{--ec:var(--light)}.el-dark{--ec:var(--dark)}

/* ---------- éléments d'interface ---------- */
.pnl{background:linear-gradient(180deg,rgba(30,36,72,.93),rgba(13,15,32,.95));border:2px solid var(--line);border-radius:16px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #ffffff14,0 12px 30px #000b}
.gbtn{background:linear-gradient(180deg,#ffe08a,#e2a93a 55%,#b47a1d);color:#2a1a03;font-family:Cinzel,serif;font-weight:900;border-radius:12px;padding:10px 22px;border:2px solid #fff3c4;box-shadow:0 4px 0 #6b4510,0 8px 18px #000a;text-shadow:0 1px 0 #fff6;transition:.12s}
.gbtn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.gbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #6b4510}
.gbtn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.sbtn{background:linear-gradient(180deg,#3a4277,#232850);border:2px solid #6b74b8;border-radius:10px;padding:7px 14px;font-weight:700;transition:.12s}
.sbtn:hover:not(:disabled){border-color:var(--gold)}
.sbtn.on{border-color:var(--gold);background:linear-gradient(180deg,#6b5520,#3a2d10)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.mut{color:var(--mut)}
.plus{color:var(--good)}
.stars{color:var(--gold);text-shadow:0 0 6px #000,0 1px 0 #000;letter-spacing:1px}

/* barre du haut */
.hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:10;background:linear-gradient(180deg,#000c,#0000)}
.hud .back{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#3a4277,#1b1f3e);border:2px solid var(--line);font-size:22px;display:flex;align-items:center;justify-content:center}
.hud h2{font-size:24px;text-shadow:0 2px 6px #000}
.res{margin-left:auto;display:flex;gap:10px}
.res span{background:#0009;border:1px solid #ffffff30;border-radius:999px;padding:6px 14px 6px 34px;font-weight:800;min-width:80px;text-align:right;position:relative;white-space:nowrap}
.res span b{position:absolute;left:8px}
.res .presb span{background:none;border:0;padding:0;min-width:0;position:static}

/* sprites */
.spr{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;pointer-events:none;filter:drop-shadow(0 6px 8px #0008)}
.spr.ph{display:flex;align-items:flex-end;justify-content:center;font-size:var(--es,100px);line-height:1}
.flip .spr{transform:scaleX(-1)}
svg.spr{overflow:hidden;max-width:100%;max-height:100%}
#zoomv .zsvg{width:100%;height:100%;display:block}
.idle{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-6px)}}
.pedestal{position:absolute;width:var(--pw,180px);height:calc(var(--pw,180px)*.28);border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--ec,#fff) 55%,transparent) 0%,#0000 70%),radial-gradient(ellipse,#0009,#0000 70%);transform:translateX(-50%)}

/* carte de monstre (portrait) */
.mc{position:relative;width:104px;height:128px;border-radius:12px;overflow:hidden;cursor:pointer;flex:none;border:2px solid color-mix(in srgb,var(--ec) 70%,#000);background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--ec) 45%,#111) 0%,#0d0f1e 75%);box-shadow:0 4px 10px #0008;transition:.12s}
.mc:hover{transform:translateY(-3px)}
.mc .pic{position:absolute;left:6px;right:6px;top:16px;bottom:22px;--es:54px}
.mc .stars{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:12px}
.mc .lv{position:absolute;bottom:0;left:0;right:0;background:#000b;font-size:11px;font-weight:800;text-align:center;padding:2px}
.mc .elb{position:absolute;top:18px;right:4px;font-size:14px}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold)}
.mc.inteam::after{content:"✔";position:absolute;top:18px;left:5px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#2a1a03;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}

/* ---------- LOBBY ---------- */
.title{position:absolute;top:70px;left:0;right:0;text-align:center}
.title h1{font-size:54px;font-weight:900;background:linear-gradient(180deg,#fff7d6,#f2c14e 60%,#b47a1d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px #000)}
.leader{position:absolute;left:640px;top:200px;width:300px;height:300px;transform:translateX(-50%);--es:200px}
.menu{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.tile{width:136px;height:120px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,rgba(40,48,96,.95),rgba(16,18,40,.96));border:2px solid var(--line);box-shadow:0 6px 0 #00000080,0 10px 24px #000a;transition:.15s;font-family:Cinzel,serif;font-weight:900;font-size:16px}
.tile .ic{font-size:44px;filter:drop-shadow(0 3px 4px #000)}
.lobwrap{position:relative}
.lobfly{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,10px) scale(.96);opacity:0;pointer-events:none;transition:.16s;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;width:370px;
  background:linear-gradient(180deg,rgba(34,40,84,.97),rgba(14,16,36,.98));border:2px solid var(--line);border-radius:18px;box-shadow:0 14px 34px #000c;z-index:30}
.lobfly.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.lobfly::after{content:'';position:absolute;top:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--line)}
.lobfly button{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid #ffffff1c;font:900 15px Cinzel,serif;color:#fff;text-align:left;white-space:nowrap;transition:.12s}
.lobfly button:hover{background:rgba(255,215,120,.16);border-color:#ffd77a88;transform:translateY(-1px)}
.lobfly button span{font-size:26px;filter:drop-shadow(0 2px 3px #000)}
.lobopt{position:absolute;left:18px;top:14px;z-index:40!important;width:44px;height:44px;border-radius:50%;font-size:22px;background:rgba(16,18,40,.85);border:2px solid var(--line);box-shadow:0 4px 12px #0008;z-index:5;transition:.15s}
.lobopt:hover{transform:rotate(40deg) scale(1.06)}
.tile:hover{transform:translateY(-4px);border-color:#fff3c4}
.tile.main{width:170px;background:linear-gradient(180deg,#a8322a,#5a1410);border-color:#ffd27a}

/* ---------- CARTE ---------- */
.zones{position:absolute;top:84px;left:24px;right:24px;bottom:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.zcard{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 26px #000a}
.zcard .bg svg{filter:brightness(.8)}
.zcard h3{position:absolute;top:0;left:0;right:0;padding:14px;font-size:20px;background:linear-gradient(180deg,#000c,#0000);text-shadow:0 2px 4px #000;z-index:2}
.zcard.locked .bg{filter:grayscale(1) brightness(.4)}
.dglock{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-40%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px;border-radius:14px;background:#0b0d1ccc;border:1px solid #ffffff22}
.dglock b{font-size:17px;color:var(--gold)} .dglock .fb{width:80%;height:8px;border-radius:5px;background:#ffffff18;overflow:hidden;margin-top:6px} .dglock .fb i{display:block;height:100%;background:linear-gradient(90deg,#e8c060,#ffe08a)}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,#ffe9a8,#d79b2c 60%,#7a4c0e);border:3px solid #fff3c4;box-shadow:0 4px 0 #0008,0 0 18px #f2c14e88;font-family:Cinzel,serif;font-weight:900;font-size:22px;color:#2a1a03;display:flex;align-items:center;justify-content:center;transition:.12s}
.node:hover:not(:disabled){transform:scale(1.12)}
.node.done{background:radial-gradient(circle at 35% 30%,#c6ffd9,#2fae5f 60%,#145c2e);color:#04210f}
.node:disabled{background:radial-gradient(circle,#555,#222);border-color:#777;color:#999;box-shadow:none;cursor:not-allowed}
.node.boss{width:80px;height:80px;margin:-40px 0 0 -40px;font-size:28px}
.zpath{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.zones .node{width:46px;height:46px;margin:-23px 0 0 -23px;font-size:17px}
.zones .node.boss{width:66px;height:66px;margin:-33px 0 0 -33px;font-size:26px}
#tuto{position:absolute;inset:0;z-index:80;pointer-events:none}
#story{position:absolute;inset:0;z-index:85}
#story .sbg{position:absolute;inset:0;overflow:hidden} #story .sbg img{width:100%;height:100%;object-fit:cover;filter:brightness(.75)}
#story .tshade{position:absolute;inset:0;background:linear-gradient(#0000 40%,#000c)}
#story .tgod{position:absolute;bottom:-30px;height:760px;filter:drop-shadow(0 0 26px var(--glow,#ffe6a088));animation:tgodIn .5s ease-out,tgodFloat 5s ease-in-out .5s infinite;transition:filter .3s}
#story .tgod.l{left:30px} #story .tgod.r{right:30px}
#story .tgod.dim{filter:brightness(.45) saturate(.6)}
#story .tbox{position:absolute;bottom:40px;padding:18px 22px;border:2px solid var(--glow,#e8c060);animation:tgodIn .3s ease-out}
#story .tbox.l{left:430px;right:60px} #story .tbox.r{left:60px;right:430px} #story .tbox.lr{left:400px;right:400px}
#story .tname{font-family:Cinzel,serif;font-weight:900;color:var(--nc,var(--gold));font-size:20px} #story .tname small{font-family:Inter,sans-serif;font-weight:500;color:#aab;font-size:12px;margin-left:6px}
#story .ttxt{font-size:18px;line-height:1.55;margin:8px 0 12px;min-height:56px}
#story .tnav{display:flex;gap:10px;align-items:center;justify-content:flex-end} #story .tnav .mut{margin-right:auto}
#story .chap{position:absolute;left:0;right:0;top:70px;text-align:center;font-family:Cinzel,serif;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 20px #000,0 2px 8px #000;letter-spacing:2px}
#story .chap small{display:block;font-size:15px;color:var(--gold);letter-spacing:4px}
#tuto.talk{pointer-events:auto}
#tuto .tshade{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 60%,#ffe6a033,#000c 70%)}
#tuto .tgod{position:absolute;left:30px;bottom:-30px;height:760px;filter:drop-shadow(0 0 30px #ffe6a088);animation:tgodIn .7s ease-out,tgodFloat 5s ease-in-out .7s infinite}
@keyframes tgodIn{from{opacity:0;transform:translateY(30px)}}
@keyframes tgodFloat{50%{transform:translateY(-10px)}}
#tuto .tbox{position:absolute;left:440px;right:40px;bottom:40px;padding:18px 22px;border:2px solid #e8c060;box-shadow:0 0 40px #e8c06044;animation:tgodIn .4s ease-out}
#tuto .tname{font-family:Cinzel,serif;font-weight:900;color:var(--gold);font-size:20px} #tuto .tname small{font-family:Inter,sans-serif;font-weight:500;color:#aab;font-size:12px;margin-left:6px}
#tuto .ttxt{font-size:18px;line-height:1.55;margin:8px 0 12px;min-height:56px}
#tuto .tnav{display:flex;gap:10px;align-items:center;justify-content:flex-end} #tuto .tnav .mut{margin-right:auto}
#tuto.hint .tbub{position:absolute;left:20px;bottom:20px;max-width:430px;display:flex;gap:12px;align-items:center;padding:10px 16px 10px 10px;border:2px solid #e8c060;font-size:15px;line-height:1.45;animation:tgodIn .4s ease-out}
#tuto.hint .tbub img{width:70px;height:90px;object-fit:cover;object-position:50% 8%;border-radius:12px;border:1px solid #e8c06088}
.tcode{background:#e8c06022;border:1px dashed #e8c060;padding:1px 6px;border-radius:6px;color:#ffe08a;letter-spacing:1px}
.tutoglow{animation:tutoglowK 1.2s ease-in-out infinite;position:relative;z-index:5}
@keyframes tutoglowK{0%,100%{box-shadow:0 0 0 3px #ffe08a,0 0 18px #ffd36a}50%{box-shadow:0 0 0 6px #ffe08a,0 0 40px #ffd36a}}

/* ---------- PRÉPARATION ---------- */
.prep-team{position:absolute;left:30px;top:90px;width:640px;height:360px}
.pslot{position:absolute;width:140px;height:160px;transform:translateX(-50%);cursor:pointer;--es:90px}
.pslot .pedestal{left:50%;bottom:-14px;--pw:150px}
.pslot .empty{position:absolute;inset:30px 20px 0;border:2px dashed #ffffff50;border-radius:50% 50% 12px 12px;display:flex;align-items:center;justify-content:center;color:#fff9;font-size:30px}
.pslot .nm{position:absolute;bottom:-34px;left:-20px;right:-20px;text-align:center;font-weight:800;font-size:13px;text-shadow:0 2px 3px #000}
.prep-foe{position:absolute;right:30px;top:90px;width:520px;padding:16px}
.wave{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff18}
.wave .mini{width:56px;height:56px;border-radius:10px;--es:36px;border:2px solid var(--ec);background:radial-gradient(circle,color-mix(in srgb,var(--ec) 35%,#111),#0d0f1e)}
.wave .mini.boss{width:70px;height:70px;--es:46px;box-shadow:0 0 12px var(--gold)}
.boxbar{position:absolute;left:0;right:0;bottom:0;height:178px;padding:14px 20px;background:linear-gradient(180deg,#0000,#000d 30%)}
.boxrow{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 10px}
.boxrow::-webkit-scrollbar{height:8px}.boxrow::-webkit-scrollbar-thumb{background:#ffffff40;border-radius:4px}

/* ---------- MONSTRES ---------- */
.boxpanel{position:absolute;left:18px;top:76px;bottom:18px;width:362px;padding:12px;display:flex;flex-direction:column}
.boxgrid{display:grid;grid-template-columns:repeat(3,104px);gap:10px;overflow-y:auto;padding:4px;flex:1;align-content:start}
.showcase{position:absolute;left:392px;top:64px;width:480px;bottom:0}
.showcase .big{position:absolute;left:240px;top:150px;width:300px;height:300px;transform:translateX(-50%);--es:190px}
.showcase .pedestal{left:240px;top:420px;--pw:280px}
.showcase .nmz{position:absolute;top:14px;left:0;right:0;text-align:center}
.showcase .nmz h2{font-size:30px;text-shadow:0 3px 6px #000}
.hex{position:absolute;width:78px;height:88px;margin:-44px 0 0 -39px;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--rc,#555);transition:.12s}
.hex>div{position:absolute;inset:3px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#2b3060,#0d0f22);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.hex .si{font-size:22px}
.hex .rmain{font-size:9px;color:var(--gold);font-weight:800;line-height:1}
.rcard .hex .rmain{display:none}
.hex.empty{--rc:#ffffff40}
.hex.empty>div{color:#fff8;font-size:22px}
.hex:hover{transform:scale(1.1)}
.infopanel{position:absolute;right:18px;top:76px;bottom:18px;width:382px;padding:14px;overflow-y:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st td{padding:4px 2px;border-bottom:1px solid #ffffff14}
table.st td:last-child{text-align:right;font-weight:700}
.skl{display:flex;gap:10px;margin-top:8px;padding:8px;border-radius:10px;background:#0006;border:1px solid #ffffff18}
.skl .sic{width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ec) 70%,#fff),color-mix(in srgb,var(--ec) 60%,#000));border:2px solid #fff6}
.skl b{color:var(--gold)}
.skl small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.xpbar{height:8px;border-radius:5px;background:#0009;overflow:hidden;border:1px solid #ffffff20}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#fff3c4)}

/* ---------- INVOCATION ---------- */
.portal{position:absolute;left:640px;top:330px;width:380px;height:380px;margin:-190px 0 0 -190px}
.portal i{position:absolute;inset:0;border-radius:50%;border:3px dashed #c9a2ff;animation:spin 14s linear infinite;box-shadow:0 0 30px #a46bff,inset 0 0 30px #a46bff}
.portal i:nth-child(2){inset:40px;border-style:dotted;border-color:#7dd3fc;animation-duration:9s;animation-direction:reverse}
.portal i:nth-child(3){inset:90px;border:2px solid #f2c14e;animation-duration:20s}
.portal i:nth-child(4){inset:120px;border:none;background:radial-gradient(circle,#fff 0%,#c9a2ff 25%,#5b21b6 55%,#0000 72%);animation:pulse2 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse2{50%{transform:scale(1.12);filter:brightness(1.3)}}
.sumbtns{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;gap:24px}
.sumbtns .gbtn{font-size:18px;padding:14px 26px}
.rates{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px}
.reveal{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#2a1550cc,#000e 70%)}
.reveal .beam{position:absolute;left:50%;top:0;bottom:0;width:180px;margin-left:-90px;background:linear-gradient(90deg,#0000,#fff8,#fff,#fff8,#0000);animation:beam 1s forwards;filter:blur(6px)}
@keyframes beam{0%{transform:scaleX(0);opacity:1}40%{transform:scaleX(1.4);opacity:1}100%{transform:scaleX(.2);opacity:0}}
.reveal .rm{width:320px;height:320px;--es:200px;animation:rise .9s .35s both cubic-bezier(.2,1.5,.4,1)}
@keyframes rise{from{transform:translateY(80px) scale(.3);opacity:0}}
.reveal .rs{font-size:38px;animation:rise .6s .9s both}
.reveal h2{font-size:38px;animation:rise .6s 1s both;text-shadow:0 3px 8px #000}
.reveal .rb{margin-top:18px;display:flex;gap:14px;animation:rise .5s 1.2s both}
.reveal.s5{background:radial-gradient(circle,#6b4a10dd,#000e 70%)}

/* ---------- RUNES ---------- */
.shopgrid{position:absolute;left:24px;right:24px;top:84px;bottom:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start;overflow-y:auto}
.shopcard{padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.shopcard h3{font-size:15px}
.shic{font-size:46px;filter:drop-shadow(0 4px 6px #000)}
.shbtns{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:auto}
.shbtns .gbtn{padding:7px 10px;font-size:13px}
.stars.evo{color:#b98aff;text-shadow:0 0 6px #8a3aff,0 1px 0 #000}
.essbox{flex:1;text-align:center;padding:8px;border-radius:10px;background:#0007;border:1px solid #ffffff20}
.req{padding:5px 8px;border-radius:8px;margin:3px 0;background:#f8717122;color:#fca5a5}
.req.ok{background:#4ade8022;color:#86efac}

/* ---- runes Titan parfaites ---- */
@property --ta{syntax:'<angle>';inherits:false;initial-value:0deg}
.titanfx{position:absolute;inset:-8% -16% -6%;pointer-events:none;z-index:0}
.titanfx .tring{position:absolute;left:4%;right:4%;bottom:-3%;height:26%;border-radius:50%;
  background:conic-gradient(from var(--ta),#ffe27a,#fff0 12%,#ffd24a 25%,#fff0 40%,#fff 52%,#fff0 64%,#ffb83a 78%,#fff0 90%,#ffe27a);
  -webkit-mask:radial-gradient(closest-side,#0000 74%,#000 78%,#000 92%,#0000 100%);mask:radial-gradient(closest-side,#0000 74%,#000 78%,#000 92%,#0000 100%);
  filter:drop-shadow(0 0 6px #ffd24a) drop-shadow(0 0 12px #ffb83a);animation:tspin 3.2s linear infinite}
.titanfx .tring.r2{left:16%;right:16%;bottom:1%;height:17%;animation-duration:2.2s;animation-direction:reverse;opacity:.8}
.titanfx .tbeam{position:absolute;left:22%;right:22%;bottom:4%;top:20%;background:linear-gradient(0deg,#ffd24a55,#ffd24a10 60%,#0000);filter:blur(6px);border-radius:40% 40% 10% 10%;animation:tbeam 2.4s ease-in-out infinite}
.titanfx .tglyphs b{position:absolute;bottom:4%;font-size:18px;font-weight:900;color:#fff4c2;text-shadow:0 0 6px #ffd24a,0 0 14px #ffb83a;opacity:0;animation:tglyph 3s linear infinite}
.titanfx.sz-mid .tglyphs b{font-size:13px}
@keyframes tspin{to{--ta:360deg}}
@keyframes tbeam{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes tglyph{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:translateY(-260%) scale(1.1);opacity:0}}
.sz-big.titanfx .tglyphs b{animation-name:tglyphB}
@keyframes tglyphB{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:translateY(-520%) scale(1.15);opacity:0}}
.tglow>*{animation:tglowA 2.6s ease-in-out infinite}
@keyframes tglowA{0%,100%{filter:drop-shadow(0 0 3px #ffd24a) drop-shadow(0 0 8px #ffb83a88)}50%{filter:drop-shadow(0 0 6px #fff4c2) drop-shadow(0 0 16px #ffd24a)}}
.mc.titanrun{border-color:#ffe27a!important;box-shadow:0 0 10px #ffe27a99,inset 0 0 14px #ffe27a33;overflow:hidden}
.mc.titanrun::before{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,#0000 40%,#fff5 48%,#ffe27a66 50%,#0000 58%);animation:tsweep 3s ease-in-out infinite;z-index:2;pointer-events:none}
@keyframes tsweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.mc .tbadge{position:absolute;right:4px;bottom:18px;z-index:3;font-size:13px;font-weight:900;color:#fff4c2;text-shadow:0 0 5px #ffd24a,0 0 10px #ffb83a}
.tperfect{margin-top:10px;padding:7px 10px;border-radius:10px;font-weight:800;font-size:12.5px;color:#fff4c2;background:linear-gradient(90deg,#ffd24a33,#ffb83a14);border:1px solid #ffe27a88;text-shadow:0 0 6px #ffb83a}

/* ---- runes Titan éveillées : halo doré ---- */
@property --hg{syntax:'<angle>';inherits:false;initial-value:0deg}
.hex.tawk{background:conic-gradient(from var(--hg),#ffe27a,#fff,#ffb83a,#fff4c2,#ffd24a,#fff,#ffe27a);animation:tspinH 2.4s linear infinite}
.hex.tawk>div{background:radial-gradient(circle at 50% 35%,#4a3b1a,#15110a)}
.hex.tawk .awkst{color:#fff4c2;text-shadow:0 0 6px #ffd24a,0 0 12px #ffb83a}
.hex.tawk::after{background:conic-gradient(from 0deg,#ffe27a,#fff,#ffb83a,#ffe27a)!important;opacity:.7}
@keyframes tspinH{to{--hg:360deg}}
.hexhalo{position:absolute;width:78px;height:88px;margin:-44px 0 0 -39px;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,#ffe27acc,#ffb83a66 55%,#0000 100%);filter:blur(6px);transform:scale(1.35);animation:thalo 2s ease-in-out infinite}
@keyframes thalo{0%,100%{opacity:.55;transform:scale(1.25)}50%{opacity:1;transform:scale(1.45)}}
.rcard .hexhalo,.rtile .hexhalo,.rpick .hexhalo{display:none}
.rcard.tawk,.rtile.tawk{border-color:#ffe27a!important;animation:tcard 2s ease-in-out infinite}
@keyframes tcard{0%,100%{box-shadow:0 0 8px #ffd24a66,inset 0 0 10px #ffd24a22}50%{box-shadow:0 0 20px #ffd24acc,inset 0 0 18px #ffd24a44}}
.rcard.tawk .hex,.rtile.tawk .hex{filter:none}

/* ---- second éveil ---- */
.spiritfx{position:absolute;inset:-6% -14% -4%;pointer-events:none;z-index:0}
.spiritfx .sfl{position:absolute;bottom:2%;border-radius:50% 50% 40% 40%;filter:blur(10px);mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 85%,#fff 0%,color-mix(in srgb,var(--ec,#7fe8ff) 80%,#fff) 25%,color-mix(in srgb,var(--ec,#7fe8ff) 60%,#0000) 55%,#0000 75%);transform-origin:50% 100%;animation:sflame 1.6s ease-in-out infinite}

// Répartition des runes Omniscient (jokers) : complètent d'abord les sets entamés, puis renforcent ceux existants
function setAlloc(cnt){
  const c = {...cnt}; let w = c.omni||0; delete c.omni; const given = {};
  while (w>0){
    const opts = Object.keys(c).map(k=>{ const p = SETS[k].pcs, r = c[k]%p, need = r ? p-r : p; return {k, need, partial:!!r, p}; }).filter(o=>o.need<=w)
      .sort((a,b)=>(b.partial-a.partial) || (a.need-b.need) || (b.p-a.p));
    if (!opts.length) break; const o = opts[0]; c[o.k] += o.need; given[o.k] = (given[o.k]||0)+o.need; w -= o.need; }
  if (w>0) c.omni = w;
  return {c, given}; }

    if (V.el==='fire'){ b.atk = Math.round(b.atk*1.04); b.hp = Math.round(b.hp*1.02); }   // petits ajustements d'équilibrage

}

// niveau maximum d'un donjon à plusieurs niveaux (hors boss mondial et Dimensions)
const isMaxFloor = d => { const D = d && DUNGEONS[d.id]; return !!(D && D.floors > 1 && d.floor >= D.floors); };
const bossRage3 = b => isMaxFloor(b.dungeon);   // coups subis avant la rage d'un boss (anti-cleave)   // le second éveil des 5★ se gagne uniquement ici
function instReward(d, team){
  const f = d.floor, first = (S.dclear.inst||0) < f; if (first) S.dclear.inst = f;
  S.items ??= {}; S.items.grind ??= {};
  const rs = INST_DROPS[f].slice(); if (Math.random()<0.35) rs.push(INST_DROPS[f][Math.floor(Math.random()*3)]); if (first) rs.push(INST_DROPS[f][2]);
  const drops = rs.map(r=>({s:pick(GRIND_STATS), r}));
  drops.forEach(g=>{ const k = grindKey(g.s,g.r); S.items.grind[k] = (S.items.grind[k]||0)+1; });
  const rw = {mana:800+f*500, xp:200+f*80, crystals:first?40:0, runes:[], ups:[], grind:drops, a2:[]};
  if (f===INST_A2_FLOOR) for (const a of team){ const m = a.boxId && mon(a.boxId); if (!m || m.awk2 || !AWK2[m.tpl]?.star5) continue;
    const from = m.a2p||0; m.a2p = Math.min(100, from + DIM_GAIN()); rw.a2.push({name:TPL[m.tpl].name, from, to:m.a2p}); }
  S.mana += rw.mana; S.crystals += rw.crystals;
  for (const a of team){ const m = a.boxId && mon(a.boxId); if (!m) continue; const up = giveXp(m, rw.xp); if (up) rw.ups.push(`${TPL[m.tpl].name} → ур. ${m.lvl}`); }
  save(); return rw;
}
// applique une meule sur la sous-stat i ; renvoie l'ancien et le nouveau bonus
function grindRune(rn, i, r){
  const sub = rn.subs[i]; if (!sub || !GRIND_STATS.includes(sub.s)) return null;
  const k = grindKey(sub.s, r); if (!(S.items?.grind?.[k]>0)) return null;
  S.items.grind[k]--; if (!S.items.grind[k]) delete S.items.grind[k];
  const [lo,hi] = grindRange(sub.s, r), roll = rint(lo,hi), old = sub.g||0, nv = Math.max(old, roll);
  sub.v += nv - old; sub.g = nv; save(); return {old, roll, nv};
}
// anciennes pierres d'élévation → meules
function migrateElev(){ const el = S.items?.elev; if (!el) return; S.items.grind ??= {};
  el.forEach((n,r)=>{ for (let i=0;i<n;i++){ const k = grindKey(pick(GRIND_STATS), r); S.items.grind[k] = (S.items.grind[k]||0)+1; } }); delete S.items.elev; }
function raidReward(d, team){
  const t = TPL[d.tpl], f = d.floor, fk = fragKey(t); S.frag ??= {}; S.dclear ??= {};
  const n = RAID_FRAGS(t.stars, f) + (Math.random()<0.25 ? 1 : 0);
  S.frag[fk] = (S.frag[fk]||0) + n;
  const key = 'raid_'+t.id, first = (S.dclear[key]||0) < f; if (first) S.dclear[key] = f;
  const rw = {mana:400+f*300, xp:Math.round(70*f), crystals:first?20:0, runes:[], ups:[], frag:{tpl:t.id, n, have:S.frag[fk], need:fragNeed(t), fam:t.fam}};
  S.mana += rw.mana; S.crystals += rw.crystals;
  for (const a of team){ const m = mon(a.boxId); if (!m) continue; const up = giveXp(m, rw.xp); if (up) rw.ups.push(`${TPL[m.tpl].name} → ур. ${m.lvl}`); }
  return rw;
}
function genDungeonWaves(d){
  if (d.id==='raid') return genRaidWaves(d);
  if (d.id==='dim') return genDimWaves(d);
  if (d.id==='inst') return genInstWaves(d);
  if (d.id==='wb') return genWBWaves(d);
  if (d.id==='crypte') return genCryptWaves(d);
  const D = DUNGEONS[d.id], f = d.floor, rng = mulberry32(f*131 + D.seed);
  const lvl = dungeonLvl(f), k = dungeonK(f);
  const pool = MONSTERS.filter(m => m.stars>=3 && m.stars <= (f<=3?3 : f<=6?4 : 5));
  const waves = [];
  for (let w=0; w<2; w++){ const wave=[]; for (let i=0;i<3;i++) wave.push({tpl:pool[Math.floor(rng()*pool.length)].id, lvl:lvl+w, k}); waves.push(wave); }
  const bw = [{tpl:dungeonBoss(d.id, f), lvl:lvl+5, boss:true, k, hpMul:1.8+0.45*f}];
  if (f>=5) bw.unshift({tpl:pool[Math.floor(rng()*pool.length)].id, lvl, k}), bw.push({tpl:pool[Math.floor(rng()*pool.length)].id, lvl, k});
  waves.push(bw); return waves;
}

    yeying:['Attaque',[E("Удар чёрной ци",3.5,[lockD(defB(40))]), E("Ладонь семи точек",1.0,[],{hits:4,cd:3,perDebuff:15}), E("Тихая смерть",5.0,[sil(70)],{cd:4,spdDiff:0.5})]],

  const BOOST = {nyxar:1.18, sekhmor:1.15, rlyeh_dark:1.16, aubeline:1.14, morgause:1.15, kurohime:1.18, pyrella:1.13, noxia:1.2, flameche:1.15};

    const m = MONSTERS.find(x=>x.id===id); if (!m) continue;
    const rs = ref[m.stars+role] || [m.base], b = {};
    for (const s of Object.keys(m.base)) b[s] = Math.round(rs.reduce((a,x)=>a+(x[s]||0),0)/rs.length);
    if (m.el==='light'||m.el==='dark') for (const s of ['hp','atk','def']) b[s] = Math.round(b[s]*1.03);
    const k = BOOST[id] || 1;   // ajustement après simulation
    const sk2 = k===1 ? sk : sk.map(s=>s.passive ? s : {...s, m:s.m?Math.round(s.m*k*100)/100:s.m, sm:s.sm?Math.round(s.sm*k*100)/100:s.sm,

    m.role = role; m.base = b; m.skills = sk2.map(s=>({...s, d:describe(s)}));
    if (m.stars===5){ const l = L(m.el, role); if (l) m.lead = l; }
  }
})();
/* ---------- 1e. DIVERSIFICATION DES COMPÉTENCES ----------
   Quand trop de compétences ont exactement la même mécanique, on applique une variante
   (coups multiples moins forts, cibles aléatoires, ignore-défense, % PV, éclaboussure, attaque conjointe…).
   Choix déterministe : le même monstre garde toujours le même kit. */
(function diversify(){
  const sig = s => [s.t, s.hits||1, s.sc||'', s.lowHp?'L':'', s.ignDef?'I':'', s.pctHp?'P':'', s.perDebuff?'D':'', s.splash?'S':'', s.critBonus?'C':'',
    ...(s.fx||[]).map(f=>f.k+(f.s||'')+(f.who||'')).sort()].join('|');
  const hash = str => { let h=7; for (const ch of str) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; };
  const r1 = x => Math.round(x*100)/100;
  const ST = [ // variantes pour attaques mono-cible
    s=>{ const n=3; return {...s, hits:n, m:r1(s.m/n*1.12)}; },
    s=>{ const n=2; return {...s, hits:n, m:r1(s.m/n*1.08)}; },
    s=>{ const n=4; return {...s, t:'random', hits:n, m:r1(s.m/n*1.3)}; },
    s=>({...s, m:r1(s.m*0.85), ignDef:35}),
    s=>({...s, m:r1(s.m*0.78), pctHp:6}),
    s=>({...s, m:r1(s.m*0.85), perDebuff:20}),
    s=>({...s, m:r1(s.m*0.9), splash:30}),
    s=>({...s, m:r1(s.m*0.75), fx:[...(s.fx||[]), {k:'joint'}]}),
    s=>({...s, m:r1(s.m*0.92), critBonus:30}),
    s=>({...s, m:r1(s.m*0.75), sc:'spd', sm:r1(s.m*0.9)}),
    s=>({...s, fx:[...(s.fx||[]), {k:'cdUp', c:40}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'extendDebuffs'}], m:r1(s.m*0.92)}),
    s=>({...s, fx:[...(s.fx||[]), {k:'debuff', s:'oblivion', c:50, turns:2}], m:r1(s.m*0.92)}),
  ];
  const AT = [ // variantes pour attaques de zone
    s=>({...s, hits:2, m:r1(s.m/2*1.08)}),
    s=>({...s, m:r1(s.m*0.88), ignDef:30}),
    s=>({...s, fx:[...(s.fx||[]), {k:'cdUp', c:30}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'debuff', s:'oblivion', c:45, turns:2}], m:r1(s.m*0.92)}),
    s=>({...s, m:r1(s.m*0.85), perDebuff:15}),
    s=>({...s, fx:[...(s.fx||[]), {k:'extendDebuffs'}], m:r1(s.m*0.92)}),
    s=>{ const n=5; return {...s, t:'random', hits:n, m:r1(s.m*1.8/n)}; },
  ];
  const SU = [ // variantes pour soutien d'équipe
    s=>({...s, fx:[...(s.fx||[]), {k:'extendBuffs'}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'balance'}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'buff', s:'counterUp', turns:2}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'buff', s:'reflectUp', turns:2}]}),
    s=>({...s, fx:(s.fx||[]).map(f=>f.k==='cleanse'?{k:'extendBuffs'}:f)}),
  ];
  const AY = [ // variantes pour soutien mono-cible
    s=>({...s, fx:[...(s.fx||[]), {k:'cdReset'}], cd:(s.cd||2)+1}),
    s=>({...s, fx:[...(s.fx||[]), {k:'buff', s:'counterUp', turns:2}]}),
    s=>({...s, fx:[...(s.fx||[]), {k:'atb', v:30}]}),
  ];
  const cnt = {}, LIMIT = 4;
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((s,i)=>{ if (s.passive) return;
      let k = sig(s);
      if ((cnt[k]||0) >= LIMIT){
        const pool = s.t==='enemy' ? ST : s.t==='enemies' ? AT : s.t==='allies' ? SU : s.t==='ally' ? AY : null;
        if (pool){ const h = hash(M.id+i); let best=null, bk=null, bc=1e9;
          for (let j=0;j<pool.length;j++){ const c = pool[(h+j)%pool.length](s), ck = sig(c), n = cnt[ck]||0; if (n<bc){ bc=n; best=c; bk=ck; } if (n===0) break; }
          if (best){ best.d = describe(best); M.skills[i] = best; s = best; k = bk; } }
      }
      cnt[k] = (cnt[k]||0)+1; }); }
})();
/* 1f. Variété des modificateurs de dégâts : les « dégâts selon PV manquants » sont réservés aux exécuteurs
   (sorts qui rejouent sur un kill) ; les autres reçoivent un modificateur différent. Un tiers des attaques
   « simples » (un seul effet, aucun modificateur) gagne aussi un modificateur. */
(function damageVariety(){
  const MODS = [
    s=>({...s, fullHp:0.5, m:r1(s.m*0.85)}), s=>({...s, perBuff:25, m:r1(s.m*0.95)}), s=>({...s, berserk:0.8, m:r1(s.m*0.92)}), s=>({...s, spdDiff:0.5, m:r1(s.m*0.88)}),
    s=>({...s, cdBonus:40, m:r1(s.m*0.92)}), s=>({...s, perAlly:10, m:r1(s.m*0.9)}), s=>({...s, vsStun:40, m:r1(s.m*0.95)}),
  ];
  const r1 = x => Math.round(x*100)/100, hash = str => { let h=11; for (const ch of str) h = (h*33 + ch.charCodeAt(0)) >>> 0; return h; };
  const MODK = ['lowHp','ignDef','pctHp','perDebuff','splash','critBonus','sc','fullHp','perBuff','berserk','spdDiff','perAlly','vsStun','cdBonus'];
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((s,i)=>{ if (s.passive || !(s.m>0) || !isOff(s)) return;
      const h = hash(M.id+'#'+i);
      if (s.lowHp && !(s.fx||[]).some(f=>f.k==='extraOnKill')){ const c = MODS[h%MODS.length]({...s}); delete c.lowHp; c.d = describe(c); M.skills[i] = c; return; }
      const plain = !MODK.some(k=>s[k]) && (s.hits||1)===1 && s.t!=='random' && (s.fx||[]).length<=2;
      if (plain && h % (i>0 ? 2 : 3) === 0){ const c = MODS[(h>>>3)%MODS.length]({...s}); c.d = describe(c); M.skills[i] = c; }
    }); }
})();
/* 1g. Variété des soins : beaucoup de soigneurs avaient « attaque + soigne le plus blessé de 10 % ».
   Chaque sort de soin reçoit une variante (soin selon PV manquants, selon les PV du lanceur, soin d'urgence,
   excédent → bouclier, soin de groupe sur les dégâts, bouclier ou régénération sur le plus blessé…) et des valeurs nuancées. */
(function healVariety(){
  const hash = str => { let h=5381; for (const ch of str) h = ((h<<5) + h + ch.charCodeAt(0)) >>> 0; return h; };
  const jit = (v, h) => Math.max(1, Math.round(v * (0.86 + (h%29)/100)));   // valeurs entre −14 % et +14 %
  const ON_HIT = [ // attaque qui soigne le plus blessé
    (f,h)=>f,
    (f,h)=>({k:'drainTeam', pct:jit(f.pct*1.4,h)}),
    (f,h)=>({...f, mode:'miss', pct:jit(f.pct*2.6,h)}),
    (f,h)=>({...f, mode:'self', pct:jit(f.pct*1.05,h)}),
    (f,h)=>({k:'buff', s:'shield', pct:jit(f.pct*1.5,h), turns:2, who:'lowest'}),
    (f,h)=>({...f, pct:jit(f.pct*0.8,h), urgent:2}),
    (f,h)=>({k:'heal', who:'allies', pct:jit(f.pct*0.38,h)}),
    (f,h)=>({...f, pct:jit(f.pct*0.85,h), over:1}),
  ];
  const GROUP = [ // soin de groupe / mono-cible
    (f,h)=>({...f, pct:jit(f.pct,h)}),
    (f,h)=>({...f, mode:'miss', pct:jit(f.pct*2.1,h)}),
    (f,h)=>({...f, pct:jit(f.pct*0.9,h), over:1}),
    (f,h)=>({...f, pct:jit(f.pct*0.85,h), urgent:1.7}),
    (f,h)=>({...f, mode:'self', pct:jit(f.pct*1.1,h)}),
  ];
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((s,i)=>{ if (s.passive || !s.fx) return;
      const rv = s.fx.findIndex(f=>f.k==='revive');
      if (rv>=0){ const h0 = hash(M.id+'^'+i); const fx = s.fx.slice(); fx[rv] = {...fx[rv], pct:jit(fx[rv].pct, h0)}; s = M.skills[i] = {...s, fx}; s.d = describe(s); }
      const j = s.fx.findIndex(f=>f.k==='heal'); if (j<0) return;
      const h = hash(M.id+'~'+i), f = s.fx[j], off = isOff(s);
      const pool = off && f.who==='lowest' ? ON_HIT : off ? null : GROUP; if (!pool) return;
      const nf = pool[h % pool.length](f, h>>>5); if (nf===f) return;

})();

function genRune(slot, minRarity=0, sets=null){
  slot = slot || rint(1,6);
  const main = pick(SLOT_MAIN[slot]);
  const r = Math.random()*100;
  let rarity = r<35?0 : r<65?1 : r<85?2 : r<96?3 : 4;
  rarity = Math.max(rarity, minRarity);
  const rn = {id:newId(), slot, set:pick(sets || Object.keys(SETS)), main, lvl:0, rarity, subs:[], on:null};
  for (let i=0;i<Math.min(4,rarity);i++) addSub(rn);

  return rn;
}

function legionify(rn){
  const m0 = subMult(rn); rn.rarity = 7; while (rn.subs.length<6) addSub(rn, true);
  rn.subs.forEach(s=>{ s.v = Math.round(s.t ? s.v*2.5 : s.v/m0*2.5); delete s.t; });
}

  const m0 = raw ? 1 : subMult(rn); rn.rarity = 6; while (rn.subs.length<5) addSub(rn, true);
  rn.subs.forEach(s=>{ s.v = Math.round(s.t ? s.v*2 : s.v/m0*2); delete s.t; });

function mythify(rn){
  rn.rarity = 5; while (rn.subs.length<4) addSub(rn);

function baseStats(tplId, lvl){
  const b = TPL[tplId].base, g = 1 + 0.06*(lvl-1);
  return {hp:b.hp*g, atk:b.atk*g, def:b.def*g, spd:b.spd, cr:b.cr, cd:b.cd, acc:b.acc, res:b.res};
}
function finalStats(tplId, lvl, runeList=[], evo=0){
  const b = baseStats(tplId, lvl);
  if (evo>0){ const k = 1 + 0.12*evo; b.hp*=k; b.atk*=k; b.def*=k; }
  if (TPL[tplId] && TPL[tplId].stars + evo >= 7){ b.hp*=1.1; b.atk*=1.1; b.def*=1.1; b.spd+=5; }   // transcendance 7★
  const a = {hpF:0,hpP:0,atkF:0,atkP:0,defF:0,defP:0,spd:0,spdP:0,cr:0,cd:0,acc:0,res:0};
  const sets = {};
  for (const rn of runeList){ if(!rn) continue;
    a[rn.main] += runeMain(rn); rn.subs.forEach(s=>a[s.s]+=s.v);
    sets[rn.set] = (sets[rn.set]||0)+1; }
  const active = [];
  for (const [k,n] of Object.entries(setAlloc(sets).c)){
    const def = SETS[k], times = Math.floor(n/def.pcs);
    for (let i=0;i<times;i++){ active.push(k); for (const [st,v] of Object.entries(def.bonus)) a[st]+=v; }
  }
  return { base:b, sets:active, s:{
    hp:Math.round(b.hp*(1+a.hpP/100)+a.hpF), atk:Math.round(b.atk*(1+a.atkP/100)+a.atkF),
    def:Math.round(b.def*(1+a.defP/100)+a.defF), spd:Math.round(b.spd*(1+a.spdP/100)+a.spd),
    cr:b.cr+a.cr, cd:b.cd+a.cd,   // taux critique non plafonné (l'excédent sert au passif « critique parfait »)
    acc:b.acc+a.acc, res:Math.min(100,b.res+a.res) }};
}

function extraMods(a, d, sk){
  let k = 1;
  if (sk.fullHp) k *= 1 + sk.fullHp*(d.hp/d.maxHp);                                   // plus fort sur les cibles en bonne santé
  if (sk.perBuff) k *= 1 + sk.perBuff/100*Object.keys(d.st).filter(x=>STATUS[x].good).length;   // punit les bonus
  if (sk.berserk) k *= 1 + sk.berserk*(1 - a.hp/a.maxHp);                            // plus fort quand il est blessé
  if (sk.spdDiff) k *= 1 + Math.min(sk.spdDiff, Math.max(0, (effStat(a,'spd') - effStat(d,'spd'))/100));   // plus rapide que la cible
  if (sk.perAlly && typeof B!=='undefined' && B) k *= 1 + sk.perAlly/100*(B.friends(a).length - 1);  // force du nombre
  if (sk.vsStun && (d.st.stun || d.st.slow)) k *= 1 + sk.vsStun/100;                 // cible entravée

  if (sk.crushWeight) k *= 1 + Math.min(sk.crushWeight/100, Math.max(0, (a.maxHp - d.maxHp)/d.maxHp)*0.5);   // écrase les cibles plus frêles

function pickTrait(t){
  const sk = t.skills.filter(s=>!s.passive), sc = {}, add = (k,v) => sc[k] = (sc[k]||0)+v;

    if (has('burn')) add('pyro', 2);
    if (has('drain')) add('vampire', 2.6);
    if (s.lowHp || has('kill') || has('extraOnKill')) add('predator', 2.2);
    if (has('healBlock') || has('curse')) add('venom', 2.2);
    if (has('stun')) add('tyrant', 2);
    if (has('slow')) add('frost', 2);
    if (has('defBreak') || has('strip') || s.ignDef) add('shatter', 1.8);
    if (s.berserk || s.vengeance) add('berserker', 2.6);
    if (has('heal') || has('revive') || has('healLow')) add('healer', 1.6);
    if (has('shield') || has('guard') || has('provoke') || s.sc==='def' || s.sc==='hp') add('bulwark', 1.6);
    if (fx.some(f=>f.k==='atb' && f.v>0 && f.who!=='self') || fx.filter(f=>f.k==='buff').length>=2) add('supporter', 1.6);
    if ((s.hits||1)>=3 || s.t==='random' || s.critBonus) add('sharp', 1.5);
    if (s.spdDiff || s.sc==='spd' || has('atbSteal')) add('swift', 1.8);
    if (has('seal') || has('oblivion') || has('silence') || has('mark') || has('invert')) add('arcane', 1.6);
  }
  const role = roleOf(t);
  add({Attaque:'sharp', 'Contrôle':'arcane', Soutien:'supporter', Soin:'healer', 'Défense':'bulwark'}[role] || 'sharp', 0.6);
  if (role==='Soin') add('healer', 1.2); else delete sc.healer;
  if (role==='Défense') add('bulwark', 1.2);

}

// signaux tirés du kit
function kitSignals(t){
  const sk = t.skills.filter(s=>!s.passive), g = {}, add = (k,v=1) => g[k] = (g[k]||0)+v, role = ROLES[t.role]?.n || t.role;
  for (const s of sk){ const fx = s.fx||[], has = k => fx.some(f=>f.s===k || f.k===k);
    if (has('burn')) add('burn'); if (has('drain')) add('drain'); if (has('extraOnKill')) add('kill'); if (s.lowHp) add('lowHp');
    if (has('curse')) add('curse'); if (has('healBlock')) add('healBlock'); if (has('provoke')) add('prov'); if (has('shield')||has('guard')) add('shield');
    if (has('heal')||has('healLow')) add('heal'); if (has('revive')) add('revive'); if (has('mark')) add('mark');
    if (fx.filter(f=>f.k==='debuff').length) add('debuffs', fx.filter(f=>f.k==='debuff').length*0.6);
    if (has('stun')||has('silence')||has('oblivion')||has('seal')) add('ctrl');
    if (s.berserk) add('berserk'); if (s.vengeance) add('vengeance'); if (s.perDebuff) add('perDebuff');
    if ((s.hits||1)>=3 || s.t==='random') add('hits'); if (s.critBonus) add('crit');
    if (s.spdDiff || s.sc==='spd' || s.spdMul) add('spd'); if (has('atbSteal')||fx.some(f=>f.k==='atb'&&f.v<0)) add('atbS');
    if (s.sc==='def') add('def'); if (s.sc==='hp') add('hp'); if ((s.cd||0)>=4) add('cd', 0.5);
    if (s.t==='enemy' && s.m>0) add('single', 0.5);
    if (fx.some(f=>f.k==='atb'&&f.v>0) || fx.filter(f=>f.k==='buff').length) add('supp');
  }
  if (role==='Attaque') add('atk',1.5); if (role==='Défense') add('def',1.5); if (role==='Soin') add('heal',1); if (role==='Soutien') add('supp',1.5); if (role==='Contrôle') add('ctrl',1);
  add(t.el, 1); return g;
}
const PAS_FORBID = {Soin:['executioner','bloodOath','fury','critCd','cruelty','chain','hunterMark','emberSoul'], Soutien:['executioner','fury'], 'Défense':['executioner','critCd','fury']};
// Passif qui poserait un effet que ses compétences posent déjà : il devient « dégâts accrus contre les cibles portant cet effet »
const EXPLOIT_NAMES = {mark:{light:"Обличающий свет",dark:"Добыча тьмы",fire:"Подожжённая цель",water:"Добыча приливов",wind:"Добыча ветра"},
  burn:"Раздуватель углей", slow:"Морозный хищник", atkBreak:"Сокрушитель воли", healBlock:"Открытая рана", defBreak:"Удар в брешь", curse:"Проклятая душа", stun:"Удар ниже пояса", silence:"Заглушённый голос", seal:"Печать суда", oblivion:"Пустой разум"};
function fixRedundantPassives(){
  for (const M of MONSTERS) M.skills.forEach((ps,i)=>{ if (!ps.passive) return; const p = ps.passive;
    const kitHas = s => M.skills.some(x=>!x.passive && (x.fx||[]).some(f=>f.s===s));
    const s = p.k==='hunterMark' ? 'mark' : p.k==='thorns' ? p.s : null;
    if (!s || !kitHas(s)) return;
    const role = ROLES[M.role]?.n || M.role;
    if (p.k==='thorns' && (role==='Défense' || role==='Soin' || role==='Soutien')){
      // un tank garde ses épines, mais avec un effet que son kit ne pose pas
      const alt = ['burn','slow','atkBreak','mark','healBlock','defBreak'].find(x=>!kitHas(x)); if (alt){ M.skills[i] = {...M.skills[i], passive:{...p, s:alt}}; M.skills[i].d = describe(M.skills[i]); }
      return; }
    const q = {3:0.75, 4:0.88, 5:1}[M.stars] || 1, nm = EXPLOIT_NAMES[s];
    const sk = P(typeof nm==='object' ? nm[M.el] : nm, {k:'exploit', s, v:Math.round(35*q)}); sk.ups = []; sk.d = describe(sk); M.skills[i] = sk; });
}

function addThirdSkills(){
  const fams = {}; for (const M of MONSTERS) if (!M.dungeonBoss && M.stars>=4) (fams[(M.fam||M.id)+'|'+M.stars] ??= []).push(M);
  for (const list of Object.values(fams)){ const used = new Set();
    for (const M of list){ const act = M.skills.filter(s=>!s.passive); if (act.length>=3) continue;
      const role = ROLES[M.role]?.n || M.role, V = THIRD[role] || THIRD['Attaque'], h = hash6(M.id+'3');
      let vi = h % V.length; for (let j=0;j<V.length && used.has(vi);j++) vi = (vi+1)%V.length; used.add(vi);
      const [names, mk] = V[vi], sk = mk(M.el); sk.n = names[M.el]; sk.ups = genUps(sk); sk.d = describe(sk);
      const pi = M.skills.findIndex(s=>s.passive); if (pi<0) M.skills.push(sk); else M.skills.splice(pi, 0, sk); }
  }
}

/* Tanks basés sur les PV : environ 2 tanks sur 3 frappent selon leurs PV max (et plus selon la défense),
   pour qu'une défense brisée ne les rende pas inoffensifs. Conversion : PV ≈ 17 × DÉF pour un tank. */
function hpTanks(){
  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Défense') continue;
    if (M.skills.some(s=>s.sc==='hp')){ M.hpTank = true; continue; }
    if (!M.skills.some(s=>s.sc==='def') || hash6(M.id+'hp')%3===0) continue;
    M.hpTank = true;
    M.skills = M.skills.map(s=>{ if (s.sc!=='def') return s; const c = {...s, sc:'hp', sm:Math.round(s.sm/17*1000)/1000}; c.d = describe(c); return c; }); }
}

/* Attaquants « vitesse » et « défense » : environ 1 attaquant sur 4 frappe aussi selon sa vitesse,
   1 sur 8 selon sa défense (les attaquants qui en avaient déjà gardent leur kit). */
function scaleAttackers(){
  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Attaque') continue;
    if (M.skills.some(s=>s.sc==='spd')){ M.spdAtk = true; continue; }
    if (M.skills.some(s=>s.sc)) continue;
    const h = hash6(M.id+'sc') % 8, kind = h<2 ? 'spd' : h===2 ? 'def' : null; if (!kind) continue;
    M[kind==='spd'?'spdAtk':'defAtk'] = true;
    M.skills = M.skills.map(s=>{ if (s.passive || !(s.m>0) || !isOff(s)) return s;
      const c = kind==='spd' ? {...s, spdMul:true}
                             : {...s, m:Math.round(s.m*0.6*100)/100, sc:'def', sm:Math.round(s.m*0.75*100)/100};
      c.d = describe(c); return c; }); }
}
// Passif « critique parfait » : +15 % de taux critique, et l'excédent au-delà de 100 % devient des dégâts critiques (×1,5)
const OVER_NAMES = {fire:"Раскалённая ярость", water:"Совершенный клинок", wind:"Абсолютное лезвие", light:"Абсолютный блеск", dark:"Совершенный удар"};
function critOverflowPassives(){
  for (const M of MONSTERS){ if (M.dungeonBoss || (ROLES[M.role]?.n||M.role)!=='Attaque' || M.stars<4) continue;
    if (hash6(M.id+'sc') % 8 !== 3 && !M.skills.some(s=>s.critBonus>=20 && (s.hits||1)>=3)) continue;
    const i = M.skills.findIndex(s=>s.passive && s.gen); if (i<0) continue;
    const sk = P(OVER_NAMES[M.el], {k:'critOverflow', v:15}); sk.ups = []; sk.gen = true; sk.d = describe(sk); M.skills[i] = sk; M.critOver = true; }
}

function assignPassives(){
  const fams = {}; for (const M of MONSTERS) if (!M.dungeonBoss) (fams[(M.fam||M.id)+'|'+M.stars] ??= []).push(M);
  const global = {};
  for (const list of Object.values(fams)){ const used = new Set();
    for (const M of list){ const pc = M.skills.filter(s=>s.passive).length, ac = M.skills.length - pc;
      // pas de passif → un passif ; 4★/5★ avec seulement 2 compétences actives et 1 passif → un 2e passif
      if (!(pc===0 || (M.stars>=4 && ac<3 && pc<2))) { M.skills.forEach(s=>s.passive && used.add(s.passive.k)); continue; }
      const own = new Set(M.skills.filter(s=>s.passive).map(s=>s.passive.k));
      const g = kitSignals(M), role = ROLES[M.role]?.n || M.role, h = hash6(M.id);
      let best = null;
      for (const [k,L] of Object.entries(PAS_LIB)){ if (k==='exploit' || own.has(k) || used.has(k) || (PAS_FORBID[role]||[]).includes(k)) continue;
        let s = 0; for (const [sig,w] of Object.entries(L.fit)) s += (g[sig]||0)*w;
        s -= (global[k]||0)*0.12; s += ((h>>> (k.length%7)) % 100)/400;           // petite variété, et on évite qu'un passif soit partout
        if (!best || s>best.s) best = {k, s}; }
      used.add(best.k); global[best.k] = (global[best.k]||0)+1;
      const L = PAS_LIB[best.k], q = {3:0.75, 4:0.88, 5:1}[M.stars] || 1, p = {k:best.k, ...L.mk(q, M.el)};
      const sk = P(L.names[M.el] || L.names.dark, p); sk.ups = []; sk.gen = true; sk.d = describe(sk); M.skills.push(sk); }
  }
}

for (const [k,L] of Object.entries(PAS_LIB)) PASSIVE_TXT[k] = L.d;
PASSIVE_TXT.critOverflow = p => `Пассивка: +${p.v}% шанса крита; шанс крита сверх 100% превращается в урон крита (×1,5).`;
function pasDmgMul(a, d){ let m = 1; for (const p of pasAll(a)) m *= pasDmgMul1(a, d, p); return m; }
function pasDmgMul1(a, d, p){
  if (p.k==='cond') return condMul(a, d, p);
  if (p.s7 && p.flat) return 1.15;
  if (p.k==='fury') return 1 + p.v/100*(a.furyN||0);
  if (p.k==='pyreJudge') return 1 + p.v/100*Math.min(BURN_MAX, d.st.burn ? (d.st.burn.stk?.length || 1) : 0);
  if (p.k==='fallenHunger') return 1 + p.v/100*(a.hungerN||0);
  if (p.k==='cruelty') return 1 + p.v/100*Object.keys(d.st).filter(k=>!STATUS[k].good).length;

async function arenaResolvePending(){

      const e = {t:q.when, id:q.id, ctr:q.ctr, from:P, to:P, win, turns:res.turns, seen:false};

// 5 adversaires mieux classés que le joueur, répartis sur une fenêtre qui se resserre en haut du classement
function arenaRefresh(){
  const A = S.arena; arenaSync(); const P = A.rank, w = Math.max(5, Math.round(P*0.05)), lo = Math.max(1, P-w), span = P-lo;
  const opp = new Set();
  if (span <= 5) for (let r=lo; r<P; r++) opp.add(r);
  else for (let i=0;i<5;i++){ const a = lo + Math.floor(span*i/5), b = lo + Math.floor(span*(i+1)/5)-1; opp.add(rint(a, Math.max(a,b))); }
  A.opp = [...opp].sort((a,b)=>a-b).map(r=>({id:A.lad[r-1], ctr:null})).filter(o=>o.id);
}

/* IA de ciblage : note chaque ennemi et vise le meilleur.
   Priorités : achever une cible tuable, PV bas, défense brisée / marquée / affaiblie, avantage élémentaire,
   soigneurs et attaquants dangereux, et garder la même cible que l'équipe (focus). On évite les cibles invincibles,
   et les contrôleurs évitent de ré-appliquer un effet déjà présent. */
function expDamage(a, d, sk){
  const adv = elemAdv(a.el, d.el);
  let base = effStat(a,'atk')*sk.m*spdFactor(a, sk); if (sk.sc) base += (sk.sc==='hp' ? a.maxHp : effStat(a, sk.sc)) * sk.sm;
  const ign = Math.min(90, (hwM(a)==='burningBlade' ? 30 : 0) + (sk.ignDef||0) + (sk.slipStrike ? Math.min(sk.slipStrike, Math.max(0, (effStat(a,'spd')-100)/5)) : 0));
  let dmg = base * 1000 / (1140 + 3.5*effStat(d,'def')*(1-ign/100)*(trOf(a)==='shatter'?0.85:1));
  if (sk.perDebuff) dmg *= 1 + sk.perDebuff/100*Object.keys(d.st).filter(k=>!STATUS[k].good).length;
  if (sk.pctHp) dmg += (d.wb ? 60000 : d.maxHp)*sk.pctHp/100*(d.boss?0.3:1)*(sk.hits?1/sk.hits:1);   // boss mondial : PV de référence fixes
  if (sk.lowHp) dmg *= 1 + sk.lowHp*(1 - d.hp/d.maxHp);
  dmg *= extraMods(a, d, sk) * traitDmgMul(a, d) * pasDmgMul(a, d) * wardMul(a, d, sk) * SIG.dmgMul(sk, a, d) * (a.shiny ? 1.1 : 1);
  if (!!pasK(a,'bonusVsDebuff') && hasBad(d)) dmg *= 1 + pasK(a,'bonusVsDebuff').v/100;
  dmg *= hwDmgMul(a, d);
  if (d.st.mark) dmg *= 1.25;
  if (d.st.carapace) dmg *= 1 - 0.15*d.st.carapace.n;
  if (a.st.overheat) dmg *= 1 + 0.15*a.st.overheat.n;
  if (!!pasK(d,'dmgReduce')) dmg *= 1 - pasK(d,'dmgReduce').v/100;
  const co = pasK(a,'critOverflow'), ch = effStat(a,'cr') + (adv>0?15:0) + (co ? co.v : 0), cr = Math.min(100, ch)/100;
  dmg *= 1 + cr*(effStat(a,'cd') + (sk.cdBonus||0) + (sk.critBonus||0)*2 + (co ? Math.max(0, ch-100)*1.5 : 0))/100;
  if (adv>0) dmg*=1.3; else if (adv<0) dmg*=0.8;
  return dmg * (sk.hits||1);
}
function aiPickFoe(b, u, s, foes){
  const ROLE_W = {Soin:18, Attaque:12, Soutien:8, 'Contrôle':6, 'Défense':-6};
  const cc = (s.fx||[]).filter(f=>f.k==='debuff').map(f=>f.s), focus = b.focus?.[b.allies.includes(u)?'a':'e'];
  let best = null, bs = -1e9;
  for (const f of foes){
    const hpPct = f.hp/f.maxHp, dmg = s.m>0 ? expDamage(u, f, s) : 0, eff = f.hp + (f.st.shield?.v||0);
    let sc = (1-hpPct)*60;                                   // PV manquants
    sc += Math.min(1, dmg/Math.max(1,eff))*45;               // part des PV restants qu'on enlève
    if (dmg >= eff) sc += 60;                                // coup fatal
    if (f.st.defBreak) sc += 28; if (f.st.mark) sc += 18;
    sc += Object.keys(f.st).filter(k=>!STATUS[k].good).length*4;
    const adv = elemAdv(u.el, f.el); sc += adv>0 ? 18 : adv<0 ? -14 : 0;
    sc += ROLE_W[f.tpl.role] || 0;
    if (f.boss && foes.length>1) sc -= 10;                  // on nettoie les adds avant le boss
    if (f.st.invincible) sc -= 200; if (f.st.shield) sc -= 6;
    if (!!pasK(f,'reflect') || f.st.reflectUp) sc -= 6;
    for (const k of cc) if (f.st[k] && !['burn','defBreak','mark'].includes(k)) sc -= 22;  // déjà sous l'effet
    if (cc.length && (!!pasK(f,'immuneCC') || f.st.immunity)) sc -= 15;
    if (focus===f.uid) sc += 14;
    const anti = s.breakShield || s.pierce || (s.fx||[]).some(x=>['devour','strip','steal','invert'].includes(x.k) || ['curse','seal','healBlock','oblivion'].includes(x.s));
    if (anti){ if (f.st.shield) sc += 22; sc += Object.keys(f.st).filter(k=>STATUS[k].good).length*7; if (f.tpl.role==='Soin' || f.tpl.role==='Soutien') sc += 14; }
    if (sc > bs){ bs = sc; best = f; }
  }
  if (best){ b.focus ??= {}; b.focus[b.allies.includes(u)?'a':'e'] = best.uid; }
  return best || b.lowest(foes);
}
function aiChoose(b, u){
  const sk = u.skills, friends = b.friends(u), foes = b.foes(u);
  const low = b.lowest(friends), anyDead = b.side(u).some(x=>x.dead);
  for (let i=sk.length-1; i>=0; i--){
    if (!b.usable(u,i)) continue;
    const s = sk[i], fx = s.fx||[];
    if (i>0 && s.m===0){
      const revives = fx.some(f=>f.k==='revive'), heals = fx.some(f=>f.k==='heal');
      if (revives && !anyDead && low.hp/low.maxHp > 0.5) continue;
      if (!revives && heals && low.hp/low.maxHp > 0.65) continue;
    }
    let target;
    if (s.t==='enemy') target = aiPickFoe(b, u, s, foes);
    else if (s.t==='ally') target = low;
    else if (s.t==='self') target = u;
    else target = (s.t==='enemies'||s.t==='random'?foes:friends)[0];
    return {i, target};
  }
  return {i:0, target:b.lowest(foes)};
}

Battle.prototype.proc = function(u, on, ctx={}){
  if (!u || u.dead) return;
  for (const p of pasAll(u)){ if (p.k!=='proc' || p.on!==on) continue;
    u.pcnt ??= {}; const key = on+p.fx;
    if (p.cap){ const w = this.waveIdx||0; if (u.pcntW!==w){ u.pcnt = {}; u.pcntW = w; } if ((u.pcnt[key]||0) >= p.cap) continue; u.pcnt[key] = (u.pcnt[key]||0)+1; }
    const foes = this.foes(u), fr = this.friends(u), atk = effStat(u,'atk');
    const nm = u.skills.find(s=>s.passive===p)?.n; if (nm) UI.float(u, '✦ '+nm, 'info');
    switch (p.fx){
      case 'atbSelf': u.atb = Math.min(100, u.atb + p.v); break;
      case 'atbAllies': fr.forEach(x=>{ if (x!==u) x.atb = Math.min(100, x.atb + p.v); }); break;
      case 'healSelf': this.heal(u, u.maxHp*p.v/100); break;
      case 'healAllies': fr.forEach(x=>this.heal(x, x.maxHp*p.v/100)); break;
      case 'shieldSelf': this.addStatus(u,'shield',2,{v:Math.round(u.maxHp*p.v/100)}); break;
      case 'shieldLow': { const l = this.lowest(fr); if (l) this.addStatus(l,'shield',2,{v:Math.round(u.maxHp*p.v/100)}); break; }
      case 'buffSelf': this.addStatus(u, p.s, p.d); break;
      case 'buffAllies': fr.forEach(x=>this.addStatus(x, p.s, p.d)); break;
      case 'debuffSrc': if (ctx.src && !ctx.src.dead && ctx.src.side!==u.side) this.tryDebuff(u, ctx.src, {s:p.s, c:p.c, turns:2}); break;
      case 'debuffRnd': if (foes.length) this.tryDebuff(u, pick(foes), {s:p.s, c:p.c, turns:2}); break;
      case 'strikeAll': foes.forEach(o=>this.damage(o, Math.round(atk*p.v/100*1000/(1140+3.5*effStat(o,'def'))*3), {glance:true}, u)); break;

function designPassives(){
  // passifs d'origine trop répandus (plus de 3 monstres) : au-delà des 3 premiers, on les redessine aussi
  const seen = {};
  for (const M of MONSTERS){ if (M.dungeonBoss) continue; for (const s of M.skills){ if (!s.passive || s.gen || ['critOverflow','exploit'].includes(s.passive.k)) continue;
    seen[s.passive.k] = (seen[s.passive.k]||0)+1; if (seen[s.passive.k] > 3) s.gen = true; } }

  const DEBUFF_EL = {fire:['burn','defBreak'], water:['slow','atkBreak'], wind:['atkBreak','slow'], light:['mark','silence'], dark:['healBlock','curse']};
  const BUFFS_BY_ROLE = {Attaque:['atkUp','critUp','spdUp'], 'Contrôle':['spdUp','immunity','critUp'], Soutien:['spdUp','atkUp','defUp','immunity'], Soin:['regen','defUp','immunity'], 'Défense':['defUp','counterUp','reflectUp','endure']};
  for (const M of MONSTERS){ if (M.dungeonBoss) continue;
    M.skills.forEach((ps, idx)=>{ if (!ps.passive || !ps.gen || ps.passive.k==='critOverflow') return;
      const role = ROLES[M.role]?.n || M.role, g = kitSignals(M), q = {3:0.75, 4:0.88, 5:1}[M.stars] || 1, own = new Set(M.skills.filter(s=>s.passive && s!==ps).map(s=>JSON.stringify([s.passive.k, s.passive.on, s.passive.fx, s.passive.when])));
      const cands = [];
      // déclencheur → effet
      for (const on of Object.keys(TRIG)) for (const fx of Object.keys(PFX)){
        let s = 0;
        const off = role==='Attaque', sup = role==='Soutien'||role==='Soin', tank = role==='Défense';
        if (['strikeAll','strikeOne','stackAtk'].includes(fx)) s += off?2:role==='Contrôle'?0.8:-1;
        if (['healSelf','shieldSelf','stackDef'].includes(fx)) s += tank?2:0.3;
        if (['healAllies','shieldLow','cleanseAllies','buffAllies','atbAllies'].includes(fx)) s += sup?2.2:tank?0.8:-0.5;
        if (['debuffSrc'].includes(fx)) s += tank?1.8:0.2;
        if (['debuffRnd','drainAtb','stripRnd'].includes(fx)) s += role==='Contrôle'?2:0.4;
        if (['atbSelf','cdSelf','stackSpd','buffSelf'].includes(fx)) s += off||role==='Contrôle'?1.2:0.5;
        if (on==='hit' || on==='hitCrit') s += tank?1.5:-0.3;
        if (on==='kill') s += off?1.6:-1.5;
        if (on==='crit') s += (g.hits||0)+(g.crit||0)*0.8 + (off?0.6:-0.5);
        if (on==='allyCrit') s += sup?0.9:-0.3;
        if (on==='cdUse') s += (g.cd||0)*0.8;
        if (on==='resist') s += tank||role==='Soin'?0.6:0;
        if (on==='lowHp') s += tank?1:0.2;
        if (on==='allyDeath') s += (g.vengeance||0)+(g.berserk||0)*0.6;
        if (on==='foeDeath') s += (g.drain||0)*0.8 + (g.kill||0)*0.5;
        if (on==='turnStart' || on==='every3') s += sup?0.7:0.3;
        if (fx==='debuffSrc' && !(on==='hit'||on==='hitCrit')) continue;
        if ((fx==='healSelf'||fx==='shieldSelf') && on==='kill' && tank) s += 0.5;
        if (fx==='cleanseSelf' && on!=='turnStart' && on!=='lowHp' && on!=='every3') s -= 1;
        if (['turnStart'].includes(on) && ['strikeAll','healAllies','atbAllies','buffAllies','stackAtk','stackDef','stackSpd','drainAtb'].includes(fx)) s -= 0.6; // trop fort à chaque tour
        cands.push({p:{k:'proc', on, fx}, s});
      }
      // dégâts conditionnels
      if (role==='Attaque' || role==='Contrôle') for (const w of Object.keys(COND)){ let s = role==='Attaque' ? 2.5 : 1.5;
        if (w==='slower') s += (g.spd||0)*0.8; if (w==='stunned') s += (g.ctrl||0)*0.7; if (w==='perDead') s += (g.vengeance||0)*0.7; if (w==='shielded') s -= 0.4;
        if (w==='highDef') s += (g.def||0)*0.4; if (w==='buffed') s += (g.atbS||0)*0.3;
        cands.push({p:{k:'cond', when:w}, s}); }
      // protections conditionnelles
      if (role!=='Attaque') for (const w of Object.keys(WARD)){ let s = role==='Défense' ? 2.6 : 1.2; if (w==='debuffedSrc') s += (g.debuffs||0)*0.3; cands.push({p:{k:'ward', when:w}, s}); }
      // passifs spéciaux de la bibliothèque
      for (const [k,L] of Object.entries(PAS_LIB)){ if (k==='exploit' || (PAS_FORBID[role]||[]).includes(k)) continue;
        let s = 0; for (const [sig,w] of Object.entries(L.fit)) s += (g[sig]||0)*w; cands.push({p:{k}, s:s*0.95+0.6}); }
      // choix : adéquation au kit, rareté de l'usage, petite part de hasard stable
      let best = null; const h = hp6(M.id+'#'+idx);
      for (const c of cands){ const key = JSON.stringify([c.p.k, c.p.on, c.p.fx, c.p.when]); if (own.has(key)) continue;
        const sc = c.s - useCnt(key)*1.6 - (c.p.k!=='proc'&&c.p.k!=='cond'&&c.p.k!=='ward' ? useCnt('lib:'+c.p.k)*0.35 : 0) + ((hp6(M.id+key)%1000)/1000)*1.4;
        if (!best || sc>best.sc) best = {...c, sc, key}; }

      const sk = P(name, p); sk.ups = []; sk.gen = true; sk.d = describe(sk); M.skills[idx] = sk;
    });
  }
}

    if (keys.some(k=>s[k]) || (r.fx||[]).some(f=>(s.fx||[]).some(x=>x.k===f.k && (x.s||'')===(f.s||'')))) return null;

const BUFF_COL = {atkUp:'#ff6a5a', defUp:'#5aa8ff', spdUp:'#6affa0', critUp:'#ffd24a', immunity:'#ffffff', regen:'#7aff9a', invincible:'#fff2a8', shield:'#9ad8ff'};
async function supportAnim(u, ts, sk, C){
  const fx = sk.fx||[];
  const [cx,cy]=feet(u); FX.sigil(cx,cy,70,C.a,.7); FX.p({x:cen(u)[0],y:cen(u)[1],life:.4,size:20,size2:70,color:C.a});
  await wt(180);
  const has = k => fx.some(f=>f.k===k);
  if (has('revive')) for (const t of B.side(u)){ if (!t.dead && !ts.includes(t)) continue; const [x]=cen(t), [,fy]=feet(t);
    FX.column(x,fy,80,fy+40,'#fff6c8',.8); FX.burst(x,fy-80,{n:14,speed:160,color:'#fff',shape:'feather',size:6,life:1,grav:80,vr:3,add:false}); }
  for (const t of ts){ const [x,y]=cen(t), [fx2,fy]=feet(t);
    if (has('heal')){ for (let i=0;i<10;i++){ const a=i/10*6.28; FX.p({x:x+Math.cos(a)*45,y:fy-10,vx:-Math.cos(a)*20,vy:-140-Math.random()*80,life:.9,size:18,shape:'glyph',glyph:'✚',color:'#7dff9a',add:false}); }
      FX.add({life:.8, draw(c,p,tt){ c.globalCompositeOperation='lighter'; c.globalAlpha=1-p; for (let i=0;i<3;i++){ c.strokeStyle='#7dff9a'; c.lineWidth=3; c.beginPath(); c.ellipse(x,fy-p*160-i*30,50-i*8,12,0,tt*8+i,tt*8+i+3.5); c.stroke(); } }}); }
    if (fx.some(f=>f.s==='shield')) FX.dome(x,y,85,'#9ad8ff',1);
    const bf = fx.filter(f=>f.k==='buff' && f.s!=='shield');
    if (bf.length){ FX.sigil(fx2,fy,60,BUFF_COL[bf[0].s]||C.a,.8);
      bf.forEach((f,j)=>{ for (let i=0;i<5;i++) FX.p({x:x+(Math.random()-.5)*70,y:fy-20,vy:-200-Math.random()*90,life:.8,size:20,shape:'glyph',glyph:'▲',color:BUFF_COL[f.s]||C.a,add:false}); }); }
    if (fx.some(f=>f.k==='atb' && f.v>0)) for (let i=0;i<6;i++) FX.streak(x-90,y-40+i*16,x+90,y-40+i*16,'#bff',.3,2.5);
    if (has('cleanse')) FX.burst(x,y,{n:14,speed:150,color:'#fff',shape:'glyph',glyph:'✧',size:14,life:.7,grav:-150,add:false});
  }
  await wt(250);
}
async function playAnim(u, sk, targets, A){
  const C = FXCOL[u.el]||FXCOL.fire; u._skn = sk.n.toLowerCase();
  const fn = ANIMS[A.kind]||ANIMS.fireball, MELEE = ['claw','bite','slash','charge','punch'];
  const go = !isOff(sk) ? supportAnim(u, targets, sk, C)
    : (MELEE.includes(A.kind) && targets.length>1) ? Promise.all(targets.map((t,i)=>wait(i*70).then(()=>fn(u,[t],C)))) : fn(u, targets, C);
  try { await Promise.race([go, wait(2600)]); } catch(e){}
}

  const parts = Array.from({length:tier>1?10:5},(_,i)=>`<b style="left:${10+Math.random()*80}%;animation-delay:-${(Math.random()*2.4).toFixed(2)}s;animation-duration:${(1.8+Math.random()*1.4).toFixed(2)}s"></b>`).join('');
  return `<div class="aura6 t${tier} sz-${size}"><i class="glow"></i><i class="ring"></i><div class="parts">${parts}</div></div>${tier>1?`<div class="aura6 aura6b t${tier} sz-${size}"><canvas class="abolt" data-t="${tier}"></canvas></div>`:''}`;
}
// Effet « second éveil » : flammes spirituelles aux couleurs de l'élément + orbes qui tournent
function spiritFx(on, size='big'){
  if (!on) return '';
  const orbs = Array.from({length:size==='big'?7:5},(_,i)=>`<b style="animation-delay:-${(i*0.55).toFixed(2)}s"></b>`).join('');
  return `<div class="spiritfx sz-${size}"><i class="sfl f1"></i><i class="sfl f2"></i><i class="sfl f3"></i><div class="sorbs">${orbs}</div></div>`;

let screen = 'lobby', selMon = null, runeFilter = 0, prepStage = 1, prepDungeon = null, prepArena = null;

// Re-dessine l'écran courant en conservant la position de défilement des listes (sélection d'un monstre, etc.)
let lastScreen = null;
function render(){
  const keep = [];
  if (lastScreen===screen){ const cnt = {};
    $('#scr').querySelectorAll('*').forEach(e=>{ const k = e.className; cnt[k] = (cnt[k]||0)+1; if (e.scrollTop||e.scrollLeft) keep.push([k, cnt[k], e.scrollTop, e.scrollLeft]); }); }
  $('#scr').innerHTML = `<div class="screen${lastScreen===screen?' still':''}">${SCREENS[screen]()}</div>`;
  if (keep.length){ const cnt = {}, els = {};
    $('#scr').querySelectorAll('*').forEach(e=>{ const k = e.className; cnt[k] = (cnt[k]||0)+1; els[k+'#'+cnt[k]] = e; });
    for (const [k,i,t,l] of keep){ const e = els[k+'#'+i]; if (e){ e.scrollTop = t; e.scrollLeft = l; } } }
  lastScreen = screen;
  if (screen==='worldboss' && !S.wb?.board && !wbBusy){ wbBusy = true; wbBoard((i,n)=>{ const p = document.getElementById('wbprog'); if (p) p.textContent = i+'/'+n; }).then(()=>{ wbBusy = false; if (screen==='worldboss') render(); }); }
  if (monQ) applyMonQ();
  if (RD && !$('#modal').classList.contains('hidden') && $('#modal .rdetail')) runeDetail(RD);
}

function teamSlot(m, i, x, y){
  if (!m) return `<div class="pslot" style="left:${x}px;top:${y-170}px"><div class="pedestal"></div><div class="empty">+</div></div>`;
  const t = TPL[m.tpl];
  return `<div class="pslot el-${t.el} ${i===0?'leader':''}" style="--sc:${mscale(t)};left:${x}px;top:${y-170}px" data-act="teamToggle" data-id="${m.id}"><div class="pedestal"></div>
    ${i===0?`<div class="crown" title="Лидер команды${t.lead?' : '+leadTxt(t.lead):" (нет умения лидера)"}">👑<span>ЛИДЕР</span></div>`:`<button class="mkld" data-act="setLeader" data-id="${m.id}" title="Сделать лидером">👑</button>`}
    <div class="idle ${isFlipped(t,'ally')?'flip':''}" style="position:absolute;inset:0">${mSprite(m)}</div><div class="nm">${ROLE_ICON[roleN(t)]||''} ${t.name} <span class="mut">${m.lvl}</span></div></div>`;
}
function skillIcon(t, i, s0){
  const k = `${t.id}-${i}`; if (!s0?.awk6New && SKILL_ICONS[k]) return `<img src="${SKILL_ICONS[k]}" alt="">`;
  const s = s0 || t.skills[i], fx = s.fx||[];
  if (s.passive) return '✴️';
  if (isOff(s)) return ANIM_ICON[animOf(s,t.el).kind]||'⚔️';
  if (fx.some(f=>f.k==='revive')) return '🕊️';
  if (fx.some(f=>f.s==='shield')) return '🔰';
  if (fx.some(f=>f.s==='provoke')) return '😡';
  if (fx.some(f=>f.k==='heal')) return '💚';
  if (s.m===0) return '🔆';
  if (fx.some(f=>f.s==='stun')) return '💫';
  if (fx.some(f=>f.k==='drain')) return '🩸';
  if (s.t==='enemies') return '💥';
  if ((s.hits||1)>1) return '🗡️';
  return i===0 ? '⚔️' : '🔥';
}
function runeHex(r, act='', extra=''){
  // fusionne la couleur de rareté avec un éventuel style passé dans extra (position…)
  const m = extra.match(/style="([^"]*)"/), st = (m ? m[1] : '') + (r ? `;--rc:${RARITY[r.rarity].c}` : '');
  const rest = extra.replace(/style="[^"]*"/, '');
  if (!r) return `<div class="hex empty" ${act} ${rest} style="${st}"><div>+</div></div>`;
  const tw = r.rarity>=6 && r.awk;
  return `${tw?`<i class="hexhalo" style="${st}"></i>`:''}<div class="hex${r.awk?' awk':''}${tw?' tawk':''}" ${act} ${rest} style="${st}">${r.awk?'<b class="awkst">✦</b>':''}<div><span class="si">${SETS[r.set].icon}</span>+${r.lvl}<span class="rmain">${RS[r.main].n}${RS[r.main].pct?'%':''}</span></div></div>`;
}

const ago = t => { const s = Math.max(0, (Date.now()-t)/1000); return s<60 ? "только что" : s<3600 ? `${Math.floor(s/60)} мин назад` : s<86400 ? `${Math.floor(s/3600)} ч назад` : `${Math.floor(s/86400)} дн. назад`; };
// Récapitulatif de fin de combat : dégâts infligés / subis, soins, éliminations
function battleRecap(){
  if (!B) return '';
  const rows = (list, foe) => { const mx = Math.max(1, ...list.map(u=>u.sDmg||0)), mh = Math.max(1, ...list.map(u=>u.sHeal||0));
    return list.map(u=>`<tr class="${u.dead?'dead':''}"><td><div class="rcp-n"><span class="mini el-${u.el}">${sprite(u.tpl)}</span>${u.tpl.name}</div></td>

      <td>${fmt(Math.round(u.sTaken||0))}</td>
      <td><div class="rcp-bar"><i style="width:${(u.sHeal||0)/mh*100}%;background:#6ee7a0"></i><span>${fmt(Math.round(u.sHeal||0))}</span></div></td>
      <td>${u.sKills||0}</td></tr>`).join(''); };
  const total = l => fmt(Math.round(l.reduce((a,u)=>a+(u.sDmg||0),0)));
  const head = `<tr><th>Монстр</th><th>Нанесено урона</th><th>Получено</th><th>Лечение</th><th>💀</th></tr>`;
  return `<details class="recap"><summary>📊 Итоги боя <span class="mut">· ходов: ${B.turns} · твоя команда: ${total(B.allies)} урона</span></summary>
    <table>${head}${rows(B.allies)}</table>
    <div class="mut" style="margin:8px 0 4px;font-size:12px">Враги${B.waves.length>1?" (последняя волна)":''} · ${total(B.enemies)} урона</div>
    <table>${rows(B.enemies, true)}</table></details>`;
}

function startBattle(s, dungeon=null, arena=null){

  if (B && B.over) leaveBattle(null, true, true);
  if (!MINI) UI.close(); prepStage = s; prepDungeon = dungeon; prepArena = arena; B = new Battle(s, dungeon, arena); if (S.prefs.autoRepeat) B.auto = true; UI.openBattle(); B.run();

function leaveBattle(to, quiet=false, unmini=false){

function applyBuild(m, ids){ let taken = 0, miss = 0, done = 0;
  (ids||[]).forEach(rid=>{ if (!rid) return; const r = rune(rid); if (!r){ miss++; return; }

const essDrop = (f, tier) => tier==='low' ? (f<=2 ? 3+f : f<=5 ? 2 : 0) : tier==='mid' ? (f<=2 ? 0 : f<=5 ? f-1 : 2) : (f>=6 ? 1+Math.floor((f-6)/2) : 0);
// Les 3 premiers donjons se débloquent un par un en terminant les chapitres de l'histoire
const DG_REQ = {colosse:0, wyverne:1, echos:2, tresor:2, omni:2, forge:2, dim:2, inst:2};
const dgLockCard = (id, title, scn) => { const lk = dgLocked(id); return `<div class="zcard locked"><div class="bg">${scene(scn)}</div><h3>${title}</h3>
  <div class="dglock"><div style="font-size:54px">🔒</div><b>Пройди главу ${lk.ch}</b><span>${lk.z.icon||''} ${lk.z.n} (этап ${lk.z.to})</span><div class="fb"><i style="width:${lk.pct}%"></i></div><small class="mut">Прогресс главы: ${lk.done}/5 этапов</small><button class="sbtn" data-act="go" data-s="map" style="margin-top:8px">🗺️ К сюжету</button></div></div>`; };
function dgLocked(id){ const zi = DG_REQ[id]; if (zi===undefined) return null; const z = ZONES[zi];
  if (S.cleared?.[z.to] || (S.dclear?.[id]||0) > 0) return null;
  const done = Array.from({length:z.to-z.from+1},(_,i)=>z.from+i).filter(x=>S.cleared?.[x]).length;
  return {ch:zi+1, z, done, pct:done/(z.to-z.from+1)*100}; }
{ const _g = go; go = function(s, arg){ const lk = s==='dims' && dgLocked('dim'); if (lk) return toast(`🔒 Измерения пробуждения: сначала пройди главу ${lk.ch} (${lk.z.n})`); return _g(s, arg); }; }
function bestSpot(kind, a){
  S.dclear ??= {}; const open = id => dgLocked(id) ? 0 : Math.min((S.dclear[id]||0)+1, DUNGEONS[id].floors);
  const pickFloor = (id, score) => { const D = DUNGEONS[id]; let best = null;
    for (let f=1; f<=D.floors; f++){ const s = score(f); if (s<=0) continue; const ok = f<=open(id), v = ok ? s*100+f : -f;   // étages accessibles d'abord, sinon le plus bas
      if (!best || v>best.v) best = {id, f, v, ok, s}; }
    return best; };
  if (kind==='ess'){ let best = null;
    for (const [id,D] of Object.entries(DUNGEONS)) if (D.rot && !D.hidden){
      const b = pickFloor(id, f=>TPL[dungeonBoss(id,f)].el===a.el ? essDrop(f,a.tier) : 0); if (b && (!best || b.v>best.v)) best = b; }
    return best && {dg:{id:best.id, floor:best.f}, why:`${DUNGEONS[best.id].icon} ${DUNGEONS[best.id].n} ур. ${best.f}: босс ${ELEM[a.el].n}, ~${best.s} ${ESS_TIERS[a.tier].n.toLowerCase()}${best.ok?'':" (этаж ещё не открыт: пройди предыдущие)"}`}; }
  if (kind==='mana'){ const f = open('tresor'); return {dg:{id:'tresor', floor:f}, why:`💰 Пещера сокровищ ур. ${f}: много маны`}; }
  if (kind==='xp'){ const f = open('echos'); return {dg:{id:'echos', floor:f}, why:`👼 Святилище эха ур. ${f}: опыт ×3`}; }
  if (kind==='forge'){ const f = open('forge'); return {dg:{id:'forge', floor:f}, why:`🔨 Кузня рун ур. ${f}: камни переброса и самоцветы`}; }
  if (kind==='dim' && AWK2[a.tpl]?.star5) return {dg:{id:'inst', floor:INST_A2_FLOOR}, why:`🐙 Инстанс Великого Древнего, этаж ${INST_A2_FLOOR}: шкала пробуждения 5★${(S.dclear?.inst||0)<INST_A2_FLOOR-1?" (сначала пройди предыдущие этажи)":''}`};
  if (kind==='dim') return {dim:a.tpl, why:`🌀 Измерение пробуждения: ${TPL[a.tpl].name}`};
  if (kind==='frag') return {screen:'feature', why:`🗝️ Тайный рейд: ${TPL[a.tpl].fam}`};
  return null;
}

/* ---------- Récompenses de présence ----------
   Toutes les 15 minutes passées dans le jeu (même onglet en arrière-plan), un coffre se débloque.
   Aucun plafond quotidien : les coffres s'accumulent tant que le jeu est ouvert. Le contenu suit un cycle,
   avec de gros coffres réguliers (☯️ tous les 8, 🌟 tous les 16, 💎 gemme tous les 24, 🌈 tous les 48). */
const PRES_MS = 15*60*1000;
const presState = () => (S.pres ??= {acc:0, avail:0, total:0, last:Date.now()});
function presReward(k){ // k = numéro du coffre (1, 2, 3…)
  const g = {}, add = (key,v)=>g[key]=(g[key]||0)+v;
  [()=>add('mana',4000), ()=>add('crystals',15), ()=>add('scrolls',1), ()=>{ add('mana',6000); add('rune',1); }, ()=>add('crystals',20), ()=>add('reroll',1)][(k-1)%6]();
  if (k%4===0) add('crystals',30);
  if (k%8===0) add('ldScrolls',1);
  if (k%16===0) add('legScrolls',1);
  if (k%24===0) add('gem',1);
  if (k%48===0) add('allScrolls',1);
  return g;
}
const PRES_ICON = {mana:'🔷', crystals:'💎', scrolls:'📜', ldScrolls:'☯️', legScrolls:'🌟', allScrolls:'🌈', rune:"⬡ руна", reroll:'🔮', gem:'💠'};
const presTxt = g => Object.entries(g).map(([k,v])=>`${PRES_ICON[k]} ${k==='rune'?'×'+v:fmt(v)}`).join(' · ');
function presBtn(){ const P = presState(), left = Math.max(0, PRES_MS - P.acc), mm = Math.floor(left/60000), ss = Math.floor(left/1000)%60;
  return `<button class="presb ${P.avail?'ready':''}" id="presBtn" data-act="presence" title="Сундук присутствия: один сундук каждые 15 минут игры">🎁 <span>${P.avail?`${P.avail} готово`:`${mm}:${String(ss).padStart(2,'0')}`}</span></button>`; }
function presTick(){
  if (!S) return; const P = presState(), now = Date.now(), d = now - (P.last||now); P.last = now;
  if (d > 0 && d < 120000) P.acc += d;             // le temps hors jeu (page fermée, ordinateur en veille) ne compte pas
  let got = 0; while (P.acc >= PRES_MS){ P.acc -= PRES_MS; P.avail++; got++; }
  if (got){ save(); toast(`🎁 Доступен сундук присутствия!`); }
  const b = document.getElementById('presBtn'); if (b){ const left = Math.max(0, PRES_MS - P.acc);
    b.classList.toggle('ready', P.avail>0);
    b.querySelector('span').textContent = P.avail ? `${P.avail} готово` : `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`; }
}
setInterval(presTick, 1000);

  if (e.target.id==='modal'){ UI.close(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (f) f(a.dataset, e);
});

  else if (k==='sortK'){ S.prefs.sortK = e.target.value; save(); render(); }

document.addEventListener('input', e=>{ if (e.target.dataset.inp==='monQ'){ monQ = e.target.value; applyMonQ(); } else if (e.target.dataset.inp==='musVol') MUS.setVol(+e.target.value); });
